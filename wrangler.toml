name = "ciasystem"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# --- Ambiente de desenvolvimento ---
# wrangler deploy --env dev
[env.dev]
name = "ciasystem-dev"
routes = [
  { pattern = "api-rpg-dev.vitorcape.com.br/*", zone_name = "vitorcape.com.br" }
]

[env.dev.triggers]
crons = ["0 3 * * *"]  # todo dia às 03:00 UTC — expira exonerações temporárias vencidas

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ciasystem-db-dev"
database_id = "<preencher-com-o-uuid-do-banco-dev>"

# --- Ambiente de produção ---
# wrangler deploy --env production
[env.production]
name = "ciasystem"
routes = [
  { pattern = "api-rpg.vitorcape.com.br/*", zone_name = "vitorcape.com.br" }
]

[env.production.triggers]
crons = ["0 3 * * *"]  # todo dia às 03:00 UTC — expira exonerações temporárias vencidas

[[env.production.d1_databases]]
binding = "DB"
database_name = "ciasystem-db"
database_id = "<preencher-com-o-uuid-do-banco-producao>"
