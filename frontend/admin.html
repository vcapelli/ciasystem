<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
  <div class="flex-1 min-w-0 px-6 pt-8">
    <h1 class="text-xl font-display font-bold mb-4">Administração</h1>
    <div id="conteudo">
      <p class="text-sm text-muted">Carregando…</p>
    </div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/seletor-usuarios.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/editor-html.js"></script>
<script src="/assets/layout.js"></script>
<script>
  const TIPOS_REQUERIMENTO = [
    'instrucao_inicial','promocao','rebaixamento','advertencia','licenca','volta_licenca','reserva',
    'transferencia_conta','transferencia_corpo','venda_cargo','contratacao','tag','turno_tarefa','reforma',
    'desligamento_honroso','desligamento_desonroso','exoneracao','bonificacao','cancelamento',
  ];

  function tituloTipoAdmin(tipo) {
    return tipo.replace(/_/g, ' ').replace(/\b\w/g, (l) => l.toUpperCase());
  }

  let abaAtual = 'hierarquia';

  function renderAbasAdmin() {
    const abas = [
      { id: 'hierarquia', label: 'Hierarquia' },
      { id: 'permissoes', label: 'Permissões' },
      { id: 'documentos', label: 'Documentos' },
      { id: 'footer', label: 'Footer' },
      { id: 'medalhas', label: 'Medalhas' },
      { id: 'sugestoes', label: 'Sugestões' },
      { id: 'banners', label: 'Banners' },
      { id: 'infracoes', label: 'Infrações' },
      { id: 'menu', label: 'Menu' },
      { id: 'configuracoes', label: 'Configurações' },
      { id: 'usuarios', label: 'Usuários' },
      { id: 'logs', label: 'Logs' },
    ];
    return `
      <div class="flex gap-6 border-b border-border mb-5">
        ${abas.map((a) => `
          <button data-aba="${a.id}" class="btn-aba-admin pb-3 text-sm font-semibold border-b-2 transition-colors ${abaAtual === a.id ? 'border-accent text-dark' : 'border-transparent text-muted hover:text-dark'}">
            ${a.label}
          </button>
        `).join('')}
      </div>
      <div id="conteudo-aba"></div>
    `;
  }

  // ---------- Hierarquia (patentes/cargos + requisitos) ----------
  const REQUISITO_TIPO_INFO = {
    tempo_na_patente: { label: 'Tempo na patente', icone: 'fa-solid fa-clock', cor: '#3b82f6' },
    tempo_na_policia: { label: 'Tempo na polícia', icone: 'fa-solid fa-hourglass-half', cor: '#8b5cf6' },
    curso: { label: 'Curso concluído', icone: 'fa-solid fa-graduation-cap', cor: '#22c55e' },
    certificado: { label: 'Certificado concluído', icone: 'fa-solid fa-certificate', cor: '#eab308' },
    grupo: { label: 'Membro do grupo', icone: 'fa-solid fa-people-group', cor: '#f97316' },
    outro: { label: 'Outro', icone: 'fa-solid fa-circle-info', cor: '#6b7280' },
  };

  function descreverRequisito(r) {
    if (r.tipo === 'tempo_na_patente') return `${r.dias} dia(s) na patente`;
    if (r.tipo === 'tempo_na_policia') return `${r.dias} dia(s) na polícia`;
    if (r.tipo === 'curso') return r.curso_nome || (r.aula_titulo ? `${r.aula_titulo} (${r.aula_grupo_nome})` : 'Curso');
    if (r.tipo === 'certificado') return r.certificado_tipo;
    if (r.tipo === 'grupo') return `Membro de ${r.grupo_nome || 'grupo'}`;
    return r.descricao || 'Outro requisito';
  }

  async function carregarHierarquia() {
    const raiz = document.getElementById('conteudo-aba');
    raiz.innerHTML = '<p class="text-sm text-muted">Carregando…</p>';

    const [patentesResp, requisitosResp, gruposResp, cursosDeGruposResp] = await Promise.all([
      apiFetch('/patentes'), apiFetch('/requisitos-patente'), apiFetch('/grupos'), apiFetch('/grupos/todos-cursos'),
    ]);
    const todasPatentes = patentesResp.ok ? await patentesResp.json() : [];
    const todosRequisitos = requisitosResp.ok ? await requisitosResp.json() : [];
    const grupos = gruposResp.ok ? await gruposResp.json() : [];
    const cursosDeGrupos = cursosDeGruposResp.ok ? await cursosDeGruposResp.json() : [];

    const oficiais = todasPatentes.filter((p) => p.sub_corpo === 'oficiais' || p.nome === 'Alto Comando Militar').sort((a, b) => b.ordem - a.ordem);
    const pracas = todasPatentes.filter((p) => p.sub_corpo === 'pracas' || p.sub_corpo === 'pracas_especiais').sort((a, b) => b.ordem - a.ordem);
    const executivo = todasPatentes.filter((p) => p.corpo === 'executivo').sort((a, b) => b.ordem - a.ordem);

    function requisitosDe(patenteId) {
      return todosRequisitos.filter((r) => r.patente_id === patenteId);
    }

    function renderCardPatente(p) {
      const reqs = requisitosDe(p.id);
      return `
        <details class="bg-card border border-border rounded-2xl shadow-sm overflow-hidden group" style="border-left: 4px solid ${p.cor || '#212529'}">
          <summary class="flex items-center justify-between px-4 py-3 cursor-pointer list-none">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-chevron-right text-xs text-muted transition-transform group-open:rotate-90"></i>
              <span class="h-2.5 w-2.5 rounded-full shrink-0" style="background: ${p.cor || '#212529'}"></span>
              <p class="text-sm font-semibold">${p.nome}</p>
              <span class="text-xs text-muted">${p.vagas ? `· ${p.vagas} vaga(s)` : ''}</span>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" data-editar-patente="${p.id}" class="text-muted hover:text-accent transition-colors text-xs"><i class="fa-solid fa-pen"></i></button>
              <button type="button" data-excluir-patente="${p.id}" class="text-muted hover:text-red-600 transition-colors text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
          </summary>
          <div class="px-4 pb-4 border-t border-border pt-3">
            <div id="editar-patente-${p.id}" class="hidden mb-3"></div>
            <div class="space-y-1.5 mb-3">
              ${reqs.length ? reqs.map((r) => {
                const info = REQUISITO_TIPO_INFO[r.tipo];
                return `
                  <div class="flex items-center justify-between px-2.5 py-1.5 rounded-lg" style="background: ${info.cor}15">
                    <span class="text-xs font-medium flex items-center gap-1.5" style="color: ${info.cor}">
                      <i class="${info.icone}"></i> ${descreverRequisito(r)}
                    </span>
                    <button type="button" data-remover-requisito="${r.id}" class="text-muted hover:text-red-600 transition-colors">
                      <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                  </div>
                `;
              }).join('') : '<p class="text-xs text-muted">Nenhum requisito cadastrado.</p>'}
            </div>
            <button type="button" data-add-requisito="${p.id}" class="text-xs font-semibold text-accent hover:underline">
              <i class="fa-solid fa-plus"></i> Adicionar requisito
            </button>
            <div id="form-requisito-${p.id}" class="hidden mt-3"></div>
          </div>
        </details>
      `;
    }

    raiz.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold uppercase tracking-wide text-muted">Corpo de Oficiais</h2>
            <button id="btn-nova-patente-oficiais" class="text-xs font-semibold text-accent hover:underline"><i class="fa-solid fa-plus"></i> Nova patente</button>
          </div>
          <div id="form-nova-patente-oficiais" class="hidden mb-3"></div>
          <div class="space-y-3">${oficiais.map(renderCardPatente).join('')}</div>

          <div class="flex items-center justify-between mb-3 mt-6">
            <h2 class="text-sm font-bold uppercase tracking-wide text-muted">Corpo de Praças</h2>
            <button id="btn-nova-patente-pracas" class="text-xs font-semibold text-accent hover:underline"><i class="fa-solid fa-plus"></i> Nova patente</button>
          </div>
          <div id="form-nova-patente-pracas" class="hidden mb-3"></div>
          <div class="space-y-3">${pracas.map(renderCardPatente).join('')}</div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold uppercase tracking-wide text-muted">Corpo Executivo</h2>
            <button id="btn-nova-patente-executivo" class="text-xs font-semibold text-accent hover:underline"><i class="fa-solid fa-plus"></i> Novo cargo</button>
          </div>
          <div id="form-nova-patente-executivo" class="hidden mb-3"></div>
          <div class="space-y-3">${executivo.map(renderCardPatente).join('')}</div>
        </div>
      </div>
    `;

    // --- Adicionar requisito (formulário inline por card) ---
    raiz.querySelectorAll('[data-add-requisito]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const patenteId = btn.dataset.addRequisito;
        const container = document.getElementById(`form-requisito-${patenteId}`);
        const abrindo = container.classList.contains('hidden');
        raiz.querySelectorAll('[id^="form-requisito-"]').forEach((el) => el.classList.add('hidden'));
        if (!abrindo) return;

        container.classList.remove('hidden');
        container.innerHTML = `
          <form data-form-requisito="${patenteId}" class="space-y-2 bg-basebg border border-border rounded-lg p-3">
            <select data-campo="tipo" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">
              ${Object.entries(REQUISITO_TIPO_INFO).map(([t, i]) => `<option value="${t}">${i.label}</option>`).join('')}
            </select>
            <div data-campo-dinamico></div>
            <button type="submit" class="text-xs font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-3 py-1.5 transition-colors">Adicionar</button>
          </form>
        `;

        const form = container.querySelector('form');
        const campoDinamico = form.querySelector('[data-campo-dinamico]');
        const selectTipo = form.querySelector('[data-campo="tipo"]');

        function atualizarCampoDinamico() {
          const tipo = selectTipo.value;
          if (tipo === 'tempo_na_patente' || tipo === 'tempo_na_policia') {
            campoDinamico.innerHTML = `<input type="number" min="0" placeholder="Dias" data-campo="dias" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">`;
          } else if (tipo === 'curso') {
            campoDinamico.innerHTML = `<select data-campo="curso_id" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">
              ${cursosDeGrupos.map((cu) => `<option value="aula:${cu.id}">${cu.titulo} — ${cu.grupo_nome}</option>`).join('')}
            </select>`;
          } else if (tipo === 'certificado') {
            campoDinamico.innerHTML = `<select data-campo="certificado_tipo" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent"><option value="CFO">CFO</option><option value="CQ">CQ</option><option value="CCJ">CCJ</option></select>`;
          } else if (tipo === 'grupo') {
            campoDinamico.innerHTML = `<select data-campo="grupo_id" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">${grupos.map((g) => `<option value="${g.id}">${g.nome}</option>`).join('')}</select>`;
          } else {
            campoDinamico.innerHTML = `<input type="text" placeholder="Descrição" data-campo="descricao" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">`;
          }
        }
        atualizarCampoDinamico();
        selectTipo.addEventListener('change', atualizarCampoDinamico);

        form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const tipo = selectTipo.value;
          const campoValor = campoDinamico.querySelector('[data-campo]')?.value;
          const corpo = { patente_id: Number(patenteId), tipo };
          if (tipo === 'tempo_na_patente' || tipo === 'tempo_na_policia') corpo.dias = Number(campoValor);
          else if (tipo === 'curso') {
            const [origem, id] = campoValor.split(':');
            if (origem === 'aula') corpo.aula_id = Number(id);
            else corpo.curso_id = Number(id);
          }
          else if (tipo === 'certificado') corpo.certificado_tipo = campoValor;
          else if (tipo === 'grupo') corpo.grupo_id = Number(campoValor);
          else corpo.descricao = campoValor;

          await apiFetch('/requisitos-patente', { method: 'POST', body: JSON.stringify(corpo) });
          carregarHierarquia();
        });
      });
    });

    raiz.querySelectorAll('[data-remover-requisito]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        await apiFetch(`/requisitos-patente/${btn.dataset.removerRequisito}`, { method: 'DELETE' });
        carregarHierarquia();
      });
    });

    // --- Editar patente (nome/ordem/vagas) ---
    raiz.querySelectorAll('[data-editar-patente]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const id = btn.dataset.editarPatente;
        const p = todasPatentes.find((x) => String(x.id) === id);
        const container = document.getElementById(`editar-patente-${id}`);
        const abrindo = container.classList.contains('hidden');
        raiz.querySelectorAll('[id^="editar-patente-"]').forEach((el) => el.classList.add('hidden'));
        if (!abrindo) return;

        container.classList.remove('hidden');
        container.innerHTML = `
          <div class="bg-basebg border border-border rounded-lg p-3 space-y-2">
            <input data-campo="nome" value="${p.nome}" placeholder="Nome" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">
            <div class="grid grid-cols-2 gap-2">
              <input data-campo="ordem" type="number" value="${p.ordem}" placeholder="Ordem" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">
              <input data-campo="vagas" type="number" value="${p.vagas ?? ''}" placeholder="Vagas (vazio = sem limite)" class="w-full bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">
            </div>
            <div class="flex items-center gap-2">
              <label class="text-xs text-muted">Cor do card nas listagens:</label>
              <input data-campo="cor" type="color" value="${p.cor || '#212529'}" class="h-8 w-14 bg-card border border-border rounded-lg cursor-pointer">
              <button type="button" data-cor-padrao class="text-xs text-muted hover:text-dark underline">Usar padrão</button>
            </div>
            <button type="button" data-salvar-patente="${id}" class="text-xs font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-3 py-1.5 transition-colors">Salvar</button>
            <p data-erro-patente class="hidden text-xs text-red-500"></p>
          </div>
        `;

        let corRemovida = false;
        container.querySelector('[data-campo="cor"]').addEventListener('input', () => { corRemovida = false; });
        container.querySelector('[data-cor-padrao]').addEventListener('click', () => {
          corRemovida = true;
          container.querySelector('[data-campo="cor"]').value = '#212529';
        });

        container.querySelector('[data-salvar-patente]').addEventListener('click', async () => {
          const nome = container.querySelector('[data-campo="nome"]').value.trim();
          const ordem = Number(container.querySelector('[data-campo="ordem"]').value);
          const vagasValor = container.querySelector('[data-campo="vagas"]').value;
          const resp = await apiFetch(`/patentes/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({
              nome, ordem, vagas: vagasValor ? Number(vagasValor) : null,
              cor: corRemovida ? null : container.querySelector('[data-campo="cor"]').value,
            }),
          });
          if (!resp.ok) {
            const d = await resp.json().catch(() => ({}));
            const erroEl = container.querySelector('[data-erro-patente]');
            erroEl.textContent = d.erro || 'Não foi possível salvar.';
            erroEl.classList.remove('hidden');
            return;
          }
          carregarHierarquia();
        });
      });
    });

    raiz.querySelectorAll('[data-excluir-patente]').forEach((btn) => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Desativar essa patente/cargo? Só funciona se ninguém estiver ocupando ela no momento.')) return;
        const resp = await apiFetch(`/patentes/${btn.dataset.excluirPatente}`, { method: 'DELETE' });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          alert(d.erro || 'Não foi possível desativar.');
          return;
        }
        carregarHierarquia();
      });
    });

    // --- Nova patente/cargo (um formulário por coluna) ---
    function ligarFormNovaPatente(botaoId, containerId, corpo, subCorpoFixo) {
      document.getElementById(botaoId).addEventListener('click', () => {
        const container = document.getElementById(containerId);
        const abrindo = container.classList.contains('hidden');
        container.classList.add('hidden');
        if (!abrindo) return;
        container.classList.remove('hidden');
        const mostrarSeletorSubCorpo = subCorpoFixo === undefined;
        container.innerHTML = `
          <form class="bg-card border border-border rounded-2xl shadow-sm p-4 space-y-2">
            <input data-campo="nome" placeholder="Nome" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            ${mostrarSeletorSubCorpo ? `
              <select data-campo="sub_corpo" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                <option value="pracas">Praças</option>
                <option value="pracas_especiais">Praças Especiais</option>
              </select>
            ` : ''}
            <div class="grid grid-cols-2 gap-2">
              <input data-campo="ordem" type="number" placeholder="Ordem" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <input data-campo="vagas" type="number" placeholder="Vagas (opcional)" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            </div>
            <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Criar</button>
            <p data-erro-nova class="hidden text-xs text-red-500"></p>
          </form>
        `;
        container.querySelector('form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const nome = container.querySelector('[data-campo="nome"]').value.trim();
          const ordem = Number(container.querySelector('[data-campo="ordem"]').value);
          const vagasValor = container.querySelector('[data-campo="vagas"]').value;
          const subCorpo = mostrarSeletorSubCorpo ? container.querySelector('[data-campo="sub_corpo"]').value : subCorpoFixo;
          const resp = await apiFetch('/patentes', {
            method: 'POST',
            body: JSON.stringify({ corpo, sub_corpo: subCorpo, nome, ordem, vagas: vagasValor ? Number(vagasValor) : null }),
          });
          if (!resp.ok) {
            const d = await resp.json().catch(() => ({}));
            const erroEl = container.querySelector('[data-erro-nova]');
            erroEl.textContent = d.erro || 'Não foi possível criar.';
            erroEl.classList.remove('hidden');
            return;
          }
          carregarHierarquia();
        });
      });
    }
    ligarFormNovaPatente('btn-nova-patente-oficiais', 'form-nova-patente-oficiais', 'militar', 'oficiais');
    ligarFormNovaPatente('btn-nova-patente-pracas', 'form-nova-patente-pracas', 'militar', undefined);
    ligarFormNovaPatente('btn-nova-patente-executivo', 'form-nova-patente-executivo', 'executivo', null);
  }

  // ---------- Permissões ----------
  async function carregarPermissoes() {
    const raiz = document.getElementById('conteudo-aba');
    raiz.innerHTML = '<p class="text-sm text-muted">Carregando…</p>';

    const [permResp, gruposResp] = await Promise.all([apiFetch('/permissoes-requerimentos'), apiFetch('/grupos')]);
    const permissoesLista = permResp.ok ? await permResp.json() : [];
    const grupos = gruposResp.ok ? await gruposResp.json() : [];

    raiz.innerHTML = `
      <div class="bg-card border border-border rounded-2xl shadow-sm divide-y divide-border overflow-hidden mb-5">
        ${permissoesLista.length ? permissoesLista.map((p) => `
          <div class="flex items-center justify-between px-4 py-3">
            <div>
              <p class="text-sm font-semibold">${p.usuario_nick ? `Usuário: ${p.usuario_nick}` : `Grupo: ${p.grupo_nome}`}</p>
              <p class="text-xs text-muted mt-0.5">
                ${p.tipo ? tituloTipoAdmin(p.tipo) : 'Todos os tipos'} ·
                ${p.pode_aprovar ? 'Aprovar' : ''}${p.pode_aprovar && p.pode_cancelar ? ' + ' : ''}${p.pode_cancelar ? 'Cancelar' : ''}
                · definido por ${p.definido_por_nick || '—'}
              </p>
            </div>
            <button data-remover-permissao="${p.id}" class="text-muted hover:text-red-600 transition-colors px-2">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `).join('') : '<p class="text-sm text-muted p-4">Nenhuma permissão concedida ainda.</p>'}

            <input id="perm-usuario-nick" placeholder="Buscar por nick…" autocomplete="off" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">

    let alvoModo = 'usuario';
    let usuarioSelecionadoId = null;

    raiz.querySelectorAll('.btn-alvo-modo').forEach((btn) => {

        raiz.querySelectorAll('.btn-alvo-modo').forEach((b) => b.className = 'btn-alvo-modo flex-1 text-xs font-semibold px-3 py-2 rounded-lg bg-basebg text-muted');

        document.getElementById('campo-alvo-usuario').classList.toggle('hidden', alvoModo !== 'usuario');

    const inputNick = document.getElementById('perm-usuario-nick');
    const sugestoes = document.getElementById('perm-usuario-sugestoes');
    inputNick.addEventListener('input', () => {

      clearTimeout(debounce);
      const termo = inputNick.value.trim();
      if (termo.length < 2) { sugestoes.classList.add('hidden'); return; }
      debounce = setTimeout(async () => {
        const r = await apiFetch(`/usuarios?busca=${encodeURIComponent(termo)}`);
        const lista = r.ok ? await r.json() : [];

          ? lista.map((u) => `<button type="button" data-id="${u.id}" data-nick="${u.nick}" class="w-full text-left px-3 py-2 text-sm hover:bg-basebg transition-colors">${u.nick}</button>`).join('')

      sugestoes.classList.add('hidden');
    });

    raiz.querySelectorAll('[data-remover-permissao]').forEach((btn) => {

        carregarPermissoes();

    });

    document.getElementById('form-permissao').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('perm-erro');
      erroEl.classList.add('hidden');

        erroEl.textContent = 'Selecione um usuário na busca.'; erroEl.classList.remove('hidden'); return;
      }

      const resp = await apiFetch('/permissoes-requerimentos', {
        method: 'POST',
        body: JSON.stringify({
          usuario_id: alvoModo === 'usuario' ? usuarioSelecionadoId : undefined,
          grupo_id: alvoModo === 'grupo' ? Number(document.getElementById('perm-grupo-id').value) : undefined,
          tipo: document.getElementById('perm-tipo').value || null,
          pode_aprovar: document.getElementById('perm-aprovar').checked,
          pode_cancelar: document.getElementById('perm-cancelar').checked,
        }),
      });

      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        erroEl.textContent = d.erro || 'Não foi possível conceder.';
        erroEl.classList.remove('hidden');
        return;
      }
      carregarPermissoes();
    });
  }

      <div id="lista-usuarios-admin" class="bg-card border border-border rounded-2xl divide-y divide-border overflow-hidden shadow-sm mb-5">

  // Segunda confirmação — modal pedindo pra digitar o nick de novo.
  function abrirModalExcluirUsuario(id, nick) {
    const modal = document.getElementById('modal-excluir-usuario');
    const input = document.getElementById('modal-excluir-confirmacao');
    const btnConfirmar = document.getElementById('modal-excluir-confirmar');
    const erroEl = document.getElementById('modal-excluir-erro');

    document.getElementById('modal-excluir-nick').textContent = nick;
    input.placeholder = nick;
    input.value = '';
    erroEl.classList.add('hidden');
    atualizarBotaoModal();
    modal.classList.remove('hidden');

    function atualizarBotaoModal() {
      const habilitado = input.value.trim() === nick;
      btnConfirmar.disabled = !habilitado;
      btnConfirmar.className = `text-sm font-semibold px-4 py-2 rounded-lg text-white transition-colors ${habilitado ? 'bg-red-600 hover:bg-red-700 cursor-pointer' : 'bg-red-600 opacity-40 cursor-not-allowed'}`;
    }

    input.oninput = atualizarBotaoModal;

    document.getElementById('modal-excluir-cancelar').onclick = () => modal.classList.add('hidden');

    btnConfirmar.onclick = async () => {
      if (input.value.trim() !== nick) return;
      btnConfirmar.disabled = true;
      btnConfirmar.textContent = 'Excluindo…';
      const resp = await apiFetch(`/usuarios/${id}`, { method: 'DELETE' });
      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        erroEl.textContent = d.erro || 'Não foi possível excluir.';
        erroEl.classList.remove('hidden');
        btnConfirmar.textContent = 'Excluir definitivamente';
        atualizarBotaoModal();
        return;
      }
      modal.classList.add('hidden');
      document.getElementById('busca-usuario-admin').dispatchEvent(new Event('input'));
    };
  }

              <option value="conta_oficial" ${u.tipo === 'conta_oficial' ? 'selected' : ''}>Conta oficial</option>

              <option value="executivo" ${u.corpo === 'executivo' ? 'selected' : ''}>Executivo</option>
            </select>
          </label>
          <label class="text-xs text-muted" data-campo-patente>Patente/Cargo
            <select data-campo="patente_atual_id" class="w-full mt-1 bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">

    const form = document.getElementById('form-editar-usuario');
    const selectTipo = form.querySelector('[data-campo="tipo"]');
    const selectCorpo = form.querySelector('[data-campo="corpo"]');
    const selectPatente = form.querySelector('[data-campo="patente_atual_id"]');
    const campoCorpoWrap = form.querySelector('[data-campo-corpo]');
    const campoPatenteWrap = form.querySelector('[data-campo-patente]');
    const campoExoneracaoWrap = form.querySelector('[data-campo-exoneracao]');
    const camposContaOficial = form.querySelectorAll('[data-campo-conta-oficial]');

    function atualizarVisibilidade() {
      const ehConta = selectTipo.value === 'conta_oficial';
      campoCorpoWrap.classList.toggle('hidden', ehConta);
      campoPatenteWrap.classList.toggle('hidden', ehConta);
      campoExoneracaoWrap.classList.toggle('hidden', form.querySelector('[data-campo="status"]').value !== 'exonerado');
      camposContaOficial.forEach((el) => el.classList.toggle('hidden', !ehConta));
    }
    selectTipo.addEventListener('change', atualizarVisibilidade);
    form.querySelector('[data-campo="status"]').addEventListener('change', atualizarVisibilidade);
    atualizarVisibilidade();

    form.querySelector('[data-campo="logo_url"]').addEventListener('input', (e) => {
      const preview = document.getElementById('editar-logo-preview');
      preview.innerHTML = e.target.value.trim() ? `<img src="${e.target.value.trim()}" class="max-w-full max-h-full object-contain" alt="">` : '';
    });
    form.querySelector('[data-campo="figure_fixa"]').addEventListener('input', (e) => {
      const preview = document.getElementById('editar-figure-preview');
      const figure = e.target.value.trim();
      preview.innerHTML = figure ? `<img src="${avatarUrl(figure, 'mini', '2')}" class="w-full h-[190%] object-cover object-top -mt-3" alt="">` : '';
    });

    selectCorpo.addEventListener('change', () => {
      selectPatente.innerHTML = opcoesPatente(selectCorpo.value);
    });

    document.getElementById('btn-fechar-editor').addEventListener('click', () => { editor.innerHTML = ''; });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg-editar-usuario');
      const ehConta = selectTipo.value === 'conta_oficial';

      const corpoValor = form.querySelector('[data-campo="corpo"]').value;
      const patenteValor = form.querySelector('[data-campo="patente_atual_id"]').value;
      const exoneracaoValor = form.querySelector('[data-campo="exoneracao_ate"]').value;
      const statusValor = form.querySelector('[data-campo="status"]').value;

      const resp = await apiFetch(`/usuarios/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({
          nick: form.querySelector('[data-campo="nick"]').value.trim(),
          tag: form.querySelector('[data-campo="tag"]').value.trim() || null,
          tipo: selectTipo.value,
          corpo: ehConta ? null : corpoValor,
          patente_atual_id: ehConta ? null : Number(patenteValor),
          status: statusValor,
          data_ingresso: form.querySelector('[data-campo="data_ingresso"]').value || undefined,
          data_ultimo_ato_funcional: form.querySelector('[data-campo="data_ultimo_ato_funcional"]').value || null,
          exoneracao_ate: statusValor === 'exonerado' ? (exoneracaoValor || null) : null,
          biografia: form.querySelector('[data-campo="biografia"]').value.trim() || null,
          logo_url: form.querySelector('[data-campo="logo_url"]').value.trim() || null,
          figure_fixa: form.querySelector('[data-campo="figure_fixa"]').value.trim() || null,
        }),
      });

      msg.classList.remove('hidden');
      if (resp.ok) {
        msg.textContent = 'Salvo!';
        msg.className = 'text-xs text-green-600';
      } else {
        const d = await resp.json().catch(() => ({}));
        msg.textContent = d.erro || 'Não foi possível salvar.';
        msg.className = 'text-xs text-red-500';
      }
    });
  }

            </div>

  // ---------- Medalhas (emblemas, honrarias, conquistas) ----------
  const TIPOS_MEDALHA = {
    emblemas: { label: 'Emblemas' },
    honrarias: { label: 'Honrarias' },
    conquistas: { label: 'Conquistas' },
  };
  let subAbaMedalha = 'emblemas';

  async function carregarMedalhas() {
    const raiz = document.getElementById('conteudo-aba');
    raiz.innerHTML = `
      <div class="flex gap-2 mb-4">
        ${Object.entries(TIPOS_MEDALHA).map(([id, cfg]) => `
          <button data-subaba-medalha="${id}" class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${subAbaMedalha === id ? 'bg-accent text-white' : 'bg-card border border-border text-muted'}">${cfg.label}</button>
        `).join('')}
      </div>
      <div id="medalha-conteudo"><p class="text-sm text-muted">Carregando…</p></div>
    `;
    raiz.querySelectorAll('[data-subaba-medalha]').forEach((btn) => {
      btn.addEventListener('click', () => { subAbaMedalha = btn.dataset.subabaMedalha; carregarMedalhas(); });
    });
    await montarListaMedalhas(subAbaMedalha);
  }

  async function montarListaMedalhas(tipo) {
    const container = document.getElementById('medalha-conteudo');
    const [itensResp, gruposResp] = await Promise.all([apiFetch(`/${tipo}`), apiFetch('/grupos')]);
    const itens = itensResp.ok ? await itensResp.json() : [];
    const grupos = gruposResp.ok ? await gruposResp.json() : [];

    container.innerHTML = `
      <div class="space-y-3 mb-5">
        ${itens.length ? itens.map((item) => `
          <div class="bg-card border border-border rounded-2xl shadow-sm p-4">
            <div class="flex items-center gap-3">
              <img src="${item.imagem_url}" class="h-12 w-12 rounded-lg object-cover border border-border shrink-0" alt="">
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold truncate">${item.titulo}</p>
                ${item.descricao ? `<p class="text-xs text-muted truncate">${item.descricao}</p>` : ''}
              </div>
              <button data-distribuir="${item.id}" class="text-xs font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-3 py-1.5 transition-colors">Distribuir</button>
              <button data-excluir-medalha="${item.id}" class="text-muted hover:text-red-600 px-1"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div id="distribuir-${item.id}" class="hidden mt-3 pt-3 border-t border-border"></div>
          </div>
        `).join('') : '<p class="text-sm text-muted">Nenhuma cadastrada ainda.</p>'}
      </div>

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 max-w-lg">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Nova ${TIPOS_MEDALHA[tipo].label.toLowerCase().replace(/s$/, '')}</h2>
        <form id="form-nova-medalha" class="space-y-2">
          <input id="medalha-titulo" placeholder="Título" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <input id="medalha-imagem" placeholder="URL da imagem" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <textarea id="medalha-descricao" placeholder="Descrição (opcional)" rows="2" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
          <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Criar</button>
          <p id="erro-nova-medalha" class="hidden text-xs text-red-500"></p>
        </form>
      </div>
    `;

    container.querySelectorAll('[data-excluir-medalha]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Excluir? Quem já recebeu continua com ela — só some do catálogo pra novas distribuições.')) return;
        await apiFetch(`/${tipo}/${btn.dataset.excluirMedalha}`, { method: 'DELETE' });
        montarListaMedalhas(tipo);
      });
    });

    container.querySelectorAll('[data-distribuir]').forEach((btn) => {
      btn.addEventListener('click', () => abrirFormDistribuir(tipo, btn.dataset.distribuir, grupos));
    });

    document.getElementById('form-nova-medalha').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resp = await apiFetch(`/${tipo}`, {
        method: 'POST',
        body: JSON.stringify({
          titulo: document.getElementById('medalha-titulo').value.trim(),
          imagem_url: document.getElementById('medalha-imagem').value.trim(),
          descricao: document.getElementById('medalha-descricao').value.trim() || undefined,
        }),
      });
      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        const erroEl = document.getElementById('erro-nova-medalha');
        erroEl.textContent = d.erro || 'Não foi possível criar.';
        erroEl.classList.remove('hidden');
        return;
      }
      montarListaMedalhas(tipo);
    });
  }

  async function abrirFormDistribuir(tipo, itemId, grupos) {
    const container = document.getElementById(`distribuir-${itemId}`);
    const abrindo = container.classList.contains('hidden');
    document.querySelectorAll('[id^="distribuir-"]').forEach((el) => el.classList.add('hidden'));
    if (!abrindo) return;
    container.classList.remove('hidden');

    const cursosResp = await apiFetch('/grupos/todos-cursos');
    const cursos = cursosResp.ok ? await cursosResp.json() : [];

    container.innerHTML = `
      <label class="block text-xs text-muted mb-1">Critério de distribuição</label>
      <select id="distrib-criterio-${itemId}" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-accent">
        <option value="todos_atuais">Todos que têm conta agora (exceto exonerados/desligados desonrosos)</option>
        <option value="grupo">Ser membro de um grupo</option>
        <option value="dias_na_policia">Estar há X dias na polícia</option>
        <option value="curso_concluido">Ter concluído um curso</option>
        <option value="manual">Selecionar manualmente</option>
      </select>
      <div id="distrib-campos-${itemId}" class="mb-2"></div>
      <button data-confirmar-distribuir="${itemId}" class="text-xs font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-3 py-2 transition-colors">Distribuir agora</button>
      <p id="distrib-resultado-${itemId}" class="hidden text-xs mt-2"></p>
    `;

    function repintarCampos() {
      const criterio = document.getElementById(`distrib-criterio-${itemId}`).value;
      const campos = document.getElementById(`distrib-campos-${itemId}`);
      if (criterio === 'grupo') {
        campos.innerHTML = `<select id="distrib-grupo-${itemId}" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">${grupos.map((g) => `<option value="${g.id}">${g.nome}</option>`).join('')}</select>`;
      } else if (criterio === 'dias_na_policia') {
        campos.innerHTML = `<input id="distrib-dias-${itemId}" type="number" min="1" placeholder="Quantidade de dias" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">`;
      } else if (criterio === 'curso_concluido') {
        campos.innerHTML = `<select id="distrib-curso-${itemId}" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">${cursos.map((cu) => `<option value="${cu.id}">${cu.titulo} — ${cu.grupo_nome}</option>`).join('')}</select>`;
      } else if (criterio === 'manual') {
        campos.innerHTML = seletorUsuariosHtml(`distrib-manual-${itemId}`, 'Buscar por nick…');
        ligarSeletorUsuarios(`distrib-manual-${itemId}`, {});
      } else {
        campos.innerHTML = '';
      }
    }
    document.getElementById(`distrib-criterio-${itemId}`).addEventListener('change', repintarCampos);
    repintarCampos();

    document.querySelector(`[data-confirmar-distribuir="${itemId}"]`).addEventListener('click', async () => {
      const criterio = document.getElementById(`distrib-criterio-${itemId}`).value;
      const corpo = { criterio };
      if (criterio === 'grupo') corpo.grupo_id = Number(document.getElementById(`distrib-grupo-${itemId}`).value);
      else if (criterio === 'dias_na_policia') corpo.dias = Number(document.getElementById(`distrib-dias-${itemId}`).value);
      else if (criterio === 'curso_concluido') corpo.aula_id = Number(document.getElementById(`distrib-curso-${itemId}`).value);
      else if (criterio === 'manual') corpo.usuario_ids = obterSelecionados(`distrib-manual-${itemId}`);

      const resp = await apiFetch(`/${tipo}/${itemId}/distribuir`, { method: 'POST', body: JSON.stringify(corpo) });
      const resultadoEl = document.getElementById(`distrib-resultado-${itemId}`);
      resultadoEl.classList.remove('hidden');
      if (resp.ok) {
        const d = await resp.json();
        resultadoEl.textContent = `Distribuído pra ${d.concedidos} pessoa(s) (de ${d.alvos_encontrados} encontradas).`;
        resultadoEl.className = 'text-xs mt-2 text-green-600';
      } else {
        resultadoEl.textContent = 'Não foi possível distribuir.';
        resultadoEl.className = 'text-xs mt-2 text-red-500';
      }
    });
  }

  // ---------- Documentos: quem pode criar/editar/deletar ----------
  async function carregarPermissoesDocumentos() {
    const raiz = document.getElementById('conteudo-aba');
    raiz.innerHTML = '<p class="text-sm text-muted">Carregando…</p>';

    const [permResp, gruposResp, docsResp] = await Promise.all([
      apiFetch('/documentos-permissoes'), apiFetch('/grupos'), apiFetch('/documentos'),
    ]);
    const permissoesLista = permResp.ok ? await permResp.json() : [];
    const grupos = gruposResp.ok ? await gruposResp.json() : [];
    const documentosLista = docsResp.ok ? await docsResp.json() : [];

    raiz.innerHTML = `
      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-5">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Quem pode ver as solicitações em aberto de cada documento</h2>
        <p class="text-xs text-muted mb-3">Além de quem já participa da solicitação (autores/aprovadores/administradores) e dos administradores do sistema, que sempre veem tudo.</p>
        <div class="space-y-2">
          ${documentosLista.map((d) => `
            <div class="flex items-center justify-between gap-3 px-3 py-2 bg-basebg border border-border rounded-lg">
              <p class="text-sm font-semibold flex-1">${d.titulo}</p>
              <select data-grupo-visualizacao="${d.id}" class="bg-card border border-border rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent">
                <option value="">Ninguém além dos participantes</option>
                ${grupos.map((g) => `<option value="${g.id}" ${d.grupo_visualizacao_solicitacoes_id === g.id ? 'selected' : ''}>${g.nome}</option>`).join('')}
              </select>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    raiz.querySelectorAll('[data-grupo-visualizacao]').forEach((select) => {
      select.addEventListener('change', async () => {
        await apiFetch(`/documentos/${select.dataset.grupoVisualizacao}`, {
          method: 'PATCH',
          body: JSON.stringify({ grupo_visualizacao_solicitacoes_id: select.value ? Number(select.value) : null }),
        });
      });
    });

    raiz.insertAdjacentHTML('beforeend', `
      <div class="bg-card border border-border rounded-2xl shadow-sm divide-y divide-border overflow-hidden mb-5">
        ${permissoesLista.length ? permissoesLista.map((p) => `
          <div class="flex items-center justify-between px-4 py-3">
            <div>
              <p class="text-sm font-semibold">${p.usuario_nick ? `Usuário: ${p.usuario_nick}` : `Grupo: ${p.grupo_nome}`}</p>
              <p class="text-xs text-muted mt-0.5">
                ${[p.pode_criar && 'Criar', p.pode_editar && 'Editar', p.pode_deletar && 'Deletar'].filter(Boolean).join(' + ')}
                · definido por ${p.definido_por_nick || '—'}
              </p>
            </div>
            <button data-remover-permissao-doc="${p.id}" class="text-muted hover:text-red-600 transition-colors px-2">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `).join('') : '<p class="text-sm text-muted p-4">Nenhuma permissão concedida ainda — só administradores do sistema mexem em documentos por enquanto.</p>'}
      </div>

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Conceder nova permissão</h2>
        <form id="form-permissao-doc" class="space-y-3">
          <div class="flex gap-2">
            <button type="button" data-alvo-modo-doc="usuario" class="btn-alvo-modo-doc flex-1 text-xs font-semibold px-3 py-2 rounded-lg bg-accent text-white">Usuário</button>
            <button type="button" data-alvo-modo-doc="grupo" class="btn-alvo-modo-doc flex-1 text-xs font-semibold px-3 py-2 rounded-lg bg-basebg text-muted">Grupo</button>
          </div>

          <div id="campo-alvo-usuario-doc" class="relative">
            <input id="perm-doc-usuario-nick" placeholder="Buscar por nick…" autocomplete="off" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <div id="perm-doc-usuario-sugestoes" class="hidden absolute z-10 mt-1 w-full bg-card border border-border rounded-lg shadow-md max-h-48 overflow-y-auto"></div>
          </div>
          <div id="campo-alvo-grupo-doc" class="hidden">
            <select id="perm-doc-grupo-id" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              ${grupos.map((g) => `<option value="${g.id}">${g.nome}</option>`).join('')}
            </select>
          </div>

          <div class="flex gap-4">
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="perm-doc-criar"> Pode criar</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="perm-doc-editar"> Pode editar</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="perm-doc-deletar"> Pode deletar</label>
          </div>

          <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Conceder</button>
          <p id="perm-doc-erro" class="hidden text-xs text-red-500"></p>
        </form>
      </div>
    `);

    let alvoModo = 'usuario';
    let usuarioSelecionadoId = null;

    raiz.querySelectorAll('.btn-alvo-modo-doc').forEach((btn) => {
      btn.addEventListener('click', () => {
        alvoModo = btn.dataset.alvoModoDoc;
        raiz.querySelectorAll('.btn-alvo-modo-doc').forEach((b) => b.className = 'btn-alvo-modo-doc flex-1 text-xs font-semibold px-3 py-2 rounded-lg bg-basebg text-muted');
        btn.className = 'btn-alvo-modo-doc flex-1 text-xs font-semibold px-3 py-2 rounded-lg bg-accent text-white';
        document.getElementById('campo-alvo-usuario-doc').classList.toggle('hidden', alvoModo !== 'usuario');
        document.getElementById('campo-alvo-grupo-doc').classList.toggle('hidden', alvoModo !== 'grupo');
      });
    });

    let debounce;
    const inputNick = document.getElementById('perm-doc-usuario-nick');
    const sugestoes = document.getElementById('perm-doc-usuario-sugestoes');
    inputNick.addEventListener('input', () => {
      usuarioSelecionadoId = null;
      clearTimeout(debounce);
      const termo = inputNick.value.trim();
      if (termo.length < 2) { sugestoes.classList.add('hidden'); return; }
      debounce = setTimeout(async () => {
        const r = await apiFetch(`/usuarios?busca=${encodeURIComponent(termo)}`);
        const lista = r.ok ? await r.json() : [];
        sugestoes.innerHTML = lista.length
          ? lista.map((u) => `<button type="button" data-id="${u.id}" data-nick="${u.nick}" class="w-full text-left px-3 py-2 text-sm hover:bg-basebg transition-colors">${u.nick}</button>`).join('')
          : '<p class="px-3 py-2 text-sm text-muted">Nenhum usuário encontrado.</p>';
        sugestoes.classList.remove('hidden');
      }, 250);
    });
    sugestoes.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      usuarioSelecionadoId = Number(btn.dataset.id);
      inputNick.value = btn.dataset.nick;
      sugestoes.classList.add('hidden');
    });

    raiz.querySelectorAll('[data-remover-permissao-doc]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remover essa permissão?')) return;
        await apiFetch(`/documentos-permissoes/${btn.dataset.removerPermissaoDoc}`, { method: 'DELETE' });
        carregarPermissoesDocumentos();
      });
    });

    document.getElementById('form-permissao-doc').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('perm-doc-erro');
      erroEl.classList.add('hidden');

      if (alvoModo === 'usuario' && !usuarioSelecionadoId) {
        erroEl.textContent = 'Selecione um usuário na busca.'; erroEl.classList.remove('hidden'); return;
      }

      const resp = await apiFetch('/documentos-permissoes', {
        method: 'POST',
        body: JSON.stringify({
          usuario_id: alvoModo === 'usuario' ? usuarioSelecionadoId : undefined,
          grupo_id: alvoModo === 'grupo' ? Number(document.getElementById('perm-doc-grupo-id').value) : undefined,
          pode_criar: document.getElementById('perm-doc-criar').checked,
          pode_editar: document.getElementById('perm-doc-editar').checked,
          pode_deletar: document.getElementById('perm-doc-deletar').checked,
        }),
      });

      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        erroEl.textContent = d.erro || 'Não foi possível conceder.';
        erroEl.classList.remove('hidden');
        return;
      }
      carregarPermissoesDocumentos();
    });

    raiz.insertAdjacentHTML('beforeend', `
      <h2 class="text-sm font-bold uppercase tracking-wide text-muted mt-8 mb-3">Categorias de documento</h2>
      <div id="conteudo-aba-categorias"></div>
    `);
    carregarCategoriasDocumento();
  }

  // ---------- Categorias de documento ----------
  async function carregarCategoriasDocumento() {
    const raiz = document.getElementById('conteudo-aba-categorias');
    if (!raiz) return;
    raiz.innerHTML = '<p class="text-sm text-muted">Carregando…</p>';

    const resp = await apiFetch('/documentos-categorias');
    const categorias = resp.ok ? await resp.json() : [];

    raiz.innerHTML = `
      <div class="space-y-3 mb-5">
        ${categorias.map((cat) => `
          <div class="bg-card border border-border rounded-2xl shadow-sm overflow-hidden">
            <div class="h-16 bg-cover bg-center ${!cat.banner_url ? 'bg-basebg' : ''}" ${cat.banner_url ? `style="background-image: url('${cat.banner_url}')"` : ''}></div>
            <div class="p-4 flex items-center gap-3">
              <input data-campo-nome="${cat.id}" value="${cat.nome}" class="flex-1 bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <input data-campo-banner="${cat.id}" value="${cat.banner_url || ''}" placeholder="URL do banner" class="flex-1 bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <button data-salvar-categoria="${cat.id}" class="text-xs font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-3 py-2 transition-colors">Salvar</button>
              <button data-excluir-categoria="${cat.id}" class="text-muted hover:text-red-600 transition-colors px-2"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 max-w-lg">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Nova categoria</h2>
        <form id="form-nova-categoria" class="space-y-2">
          <input data-campo="nome" placeholder="Nome" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <input data-campo="banner_url" placeholder="URL do banner (opcional)" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Criar</button>
          <p data-erro class="hidden text-xs text-red-500"></p>
        </form>
      </div>
    `;

    raiz.querySelectorAll('[data-salvar-categoria]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.salvarCategoria;
        await apiFetch(`/documentos-categorias/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({
            nome: raiz.querySelector(`[data-campo-nome="${id}"]`).value.trim(),
            banner_url: raiz.querySelector(`[data-campo-banner="${id}"]`).value.trim() || null,
          }),
        });
        carregarCategoriasDocumento();
      });
    });

    raiz.querySelectorAll('[data-excluir-categoria]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Excluir essa categoria? Só funciona se nenhum documento estiver nela.')) return;
        const resp = await apiFetch(`/documentos-categorias/${btn.dataset.excluirCategoria}`, { method: 'DELETE' });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          alert(d.erro || 'Não foi possível excluir.');
          return;
        }
        carregarCategoriasDocumento();
      });
    });

    document.getElementById('form-nova-categoria').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resp = await apiFetch('/documentos-categorias', {
        method: 'POST',
        body: JSON.stringify({
          nome: document.querySelector('#form-nova-categoria [data-campo="nome"]').value.trim(),
          banner_url: document.querySelector('#form-nova-categoria [data-campo="banner_url"]').value.trim() || undefined,
        }),
      });
      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        const erroEl = document.querySelector('#form-nova-categoria [data-erro]');
        erroEl.textContent = d.erro || 'Não foi possível criar.';
        erroEl.classList.remove('hidden');
        return;
      }
      carregarCategoriasDocumento();
    });
  }

  // ---------- Sugestões ----------
  async function carregarSugestoes() {

      aprovada: 'bg-green-500/15 text-green-600',
      rejeitada: 'bg-red-500/15 text-red-600',
    };

    raiz.innerHTML = `
      <div class="space-y-3">
        ${lista.length ? lista.map((s) => `
          <div class="bg-card border border-border rounded-2xl shadow-sm p-4">
            <div class="flex items-center justify-between gap-2">
              <p class="text-sm font-semibold">${s.titulo}</p>
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full capitalize ${BADGE_SUGESTAO[s.status] || ''}">${s.status}</span>
            </div>
            <p class="text-xs text-muted mt-1">por ${s.autor_nick || '—'} · ${new Date(s.criado_em).toLocaleDateString('pt-BR')}</p>

            ${s.status === 'pendente' ? `
              <div class="flex gap-2 mt-3">
                <button data-decidir="${s.id}" data-status="aprovada" class="btn-decidir-sugestao text-xs font-semibold px-3 py-1.5 rounded-lg bg-green-500/15 text-green-600 hover:bg-green-500/25 transition-colors">
                  <i class="fa-solid fa-check"></i> Aprovar
                </button>
                <button data-decidir="${s.id}" data-status="rejeitada" class="btn-decidir-sugestao text-xs font-semibold px-3 py-1.5 rounded-lg bg-red-500/15 text-red-600 hover:bg-red-500/25 transition-colors">
                  <i class="fa-solid fa-xmark"></i> Rejeitar
                </button>
              </div>
            ` : ''}
          </div>
        `).join('') : '<p class="text-sm text-muted">Nenhuma sugestão registrada ainda.</p>'}
      </div>
    `;

    raiz.querySelectorAll('.btn-decidir-sugestao').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const motivo = prompt('Motivo da decisão (opcional):') || undefined;
        await apiFetch(`/sugestoes/${btn.dataset.decidir}/decidir`, {
          method: 'POST',
          body: JSON.stringify({ status: btn.dataset.status, motivo_decisao: motivo }),
        });
        carregarSugestoes();
      });
    });
  }

              <p class="text-sm flex-1 truncate">${b.nome || b.imagem_url}</p>
              <button type="button" data-remover-banner="${b.id}" class="text-muted hover:text-red-600 transition-colors px-2">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `).join('') : '<p class="text-sm text-muted">Nenhum banner cadastrado ainda.</p>'}
        </div>
        <form id="form-novo-banner-admin" class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2">
          <input id="novo-banner-url-admin" placeholder="URL da imagem" required class="bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <input id="novo-banner-nome-admin" placeholder="Nome (opcional)" class="bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Adicionar</button>
        </form>
      </div>
    `;

    document.getElementById('form-novo-banner-admin').addEventListener('submit', async (e) => {
      e.preventDefault();
      await apiFetch('/banners-perfil', {
        method: 'POST',
        body: JSON.stringify({
          imagem_url: document.getElementById('novo-banner-url-admin').value.trim(),
          nome: document.getElementById('novo-banner-nome-admin').value.trim() || undefined,
        }),
      });
      carregarBanners();
    });

    raiz.querySelectorAll('[data-remover-banner]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remover esse banner da lista?')) return;
        await apiFetch(`/banners-perfil/${btn.dataset.removerBanner}`, { method: 'DELETE' });
        carregarBanners();
      });
    });
  }

  // ---------- Infrações (crimes) ----------
  async function carregarInfracoes() {
    const raiz = document.getElementById('conteudo-aba');
    raiz.innerHTML = '<p class="text-sm text-muted">Carregando…</p>';

    const resp = await apiFetch('/crimes');
    const lista = resp.ok ? await resp.json() : [];

    raiz.innerHTML = `
      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 max-w-lg">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Infrações cadastradas</h2>
        <div class="space-y-1 mb-4">
          ${lista.length ? lista.map((cr) => `
            <div class="flex items-center justify-between px-3 py-2 bg-basebg border border-border rounded-lg">
              <p class="text-sm">${cr.nome}</p>
              <button type="button" data-remover-crime="${cr.id}" class="text-muted hover:text-red-600 transition-colors px-2">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `).join('') : '<p class="text-sm text-muted">Nenhuma infração cadastrada.</p>'}
        </div>
        <form id="form-nova-infracao" class="flex gap-2">
          <input id="nova-infracao-nome" placeholder="Nome da infração" required class="flex-1 bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Adicionar</button>
        </form>
      </div>
    `;

    document.getElementById('form-nova-infracao').addEventListener('submit', async (e) => {
      e.preventDefault();
      await apiFetch('/crimes', { method: 'POST', body: JSON.stringify({ nome: document.getElementById('nova-infracao-nome').value.trim() }) });
      carregarInfracoes();
    });

    raiz.querySelectorAll('[data-remover-crime]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remover essa infração?')) return;
        await apiFetch(`/crimes/${btn.dataset.removerCrime}`, { method: 'DELETE' });
        carregarInfracoes();
      });
    });
  }

  // ---------- Menu personalizado ----------
  async function carregarMenuAdmin() {
    const raiz = document.getElementById('conteudo-aba');
    raiz.innerHTML = '<p class="text-sm text-muted">Carregando…</p>';

    const resp = await apiFetch('/menu/todos');
    const itens = resp.ok ? await resp.json() : [];

    raiz.innerHTML = `
      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-5">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Itens extras do menu</h2>
        <p class="text-xs text-muted mb-3">Aparecem na seção "Mais" do menu lateral, embaixo dos itens fixos.</p>
        <div class="space-y-1 mb-4">
          ${itens.length ? itens.map((i) => `
            <div class="flex items-center justify-between px-3 py-2 bg-basebg border border-border rounded-lg">
              <div>
                <p class="text-sm">${i.titulo}</p>
                <p class="text-xs text-muted">${i.url || '—'}</p>
              </div>
              <button type="button" data-remover-item-menu="${i.id}" class="text-muted hover:text-red-600 transition-colors px-2">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `).join('') : '<p class="text-sm text-muted">Nenhum item extra cadastrado.</p>'}
        </div>
        <form id="form-novo-item-menu" class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2">
          <input id="novo-item-titulo" placeholder="Título" required class="bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <input id="novo-item-url" placeholder="URL (ex: /pagina.html)" required class="bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Adicionar</button>
        </form>
      </div>
    `;

    document.getElementById('form-novo-item-menu').addEventListener('submit', async (e) => {
      e.preventDefault();
      await apiFetch('/menu', {
        method: 'POST',
        body: JSON.stringify({
          titulo: document.getElementById('novo-item-titulo').value.trim(),
          url: document.getElementById('novo-item-url').value.trim(),
        }),
      });
      carregarMenuAdmin();
    });

    raiz.querySelectorAll('[data-remover-item-menu]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remover esse item do menu?')) return;
        await apiFetch(`/menu/${btn.dataset.removerItemMenu}`, { method: 'DELETE' });
        carregarMenuAdmin();
      });
    });
  }

  const CARREGADORES_ABA = {
    hierarquia: carregarHierarquia,
    permissoes: carregarPermissoes,
    documentos: carregarPermissoesDocumentos,
    footer: carregarFooterAdmin,
    medalhas: carregarMedalhas,
    sugestoes: carregarSugestoes,
    banners: carregarBanners,
    infracoes: carregarInfracoes,
    menu: carregarMenuAdmin,
    configuracoes: carregarConfiguracoes,
    usuarios: carregarUsuarios,
    logs: carregarLogs,
  };

  function montarAdmin() {
    wireAbas();
    CARREGADORES_ABA[abaAtual]();
  }

  function wireAbas() {
    const container = document.getElementById('conteudo');
    container.innerHTML = renderAbasAdmin();
    container.querySelectorAll('.btn-aba-admin').forEach((btn) => {
      btn.addEventListener('click', () => {
        abaAtual = btn.dataset.aba;
        wireAbas();
        CARREGADORES_ABA[abaAtual]();
      });
    });
  }

  montarLayout('/admin.html').then((me) => {
    if (!me) return;
    if (!me.administrador_sistema) {
      document.getElementById('conteudo').innerHTML = '<p class="text-sm text-red-500">Essa página é restrita a administradores do sistema.</p>';
      return;
    }
    montarAdmin();
  });
</script>
</body>
</html>
