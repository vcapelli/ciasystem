<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
  <div class="max-w-5xl mx-auto flex-1 w-full px-4 pt-10">
      <div id="boas-vindas"></div>

      <div class="grid md:grid-cols-2 gap-5 mt-5">
        <div>
          <h2 class="text-sm font-bold uppercase tracking-wide text-muted mb-3 flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-accent"></i> Novos membros
          </h2>
          <div id="home-novos-membros" class="flex items-start gap-3 flex-wrap">
            <p class="text-sm text-muted">Carregando…</p>
          </div>
        </div>

        <div>
          <h2 class="text-sm font-bold uppercase tracking-wide text-muted mb-3 flex items-center gap-2">
            <i class="fa-solid fa-bullhorn text-accent"></i> Últimas notícias
          </h2>
          <div id="home-ultimas-noticias" class="bg-card border border-border rounded-2xl shadow-sm divide-y divide-border overflow-hidden">
            <p class="text-sm text-muted p-4">Carregando…</p>
          </div>

          <h2 class="text-sm font-bold uppercase tracking-wide text-muted mb-3 mt-5 flex items-center gap-2">
            <i class="fa-solid fa-book-bookmark text-accent"></i> Diário Oficial
          </h2>
          <div id="home-diario-oficial" class="bg-card border border-border rounded-2xl shadow-sm divide-y divide-border overflow-hidden">
            <p class="text-sm text-muted p-4">Carregando…</p>
          </div>
        </div>
      </div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/layout.js"></script>
<script>
  const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function saudacaoPorHorario() {
    const h = new Date().getHours();
    if (h < 12) return 'Bom dia';
    if (h < 18) return 'Boa tarde';
    return 'Boa noite';
  }

  function atualizarRelogio() {
    const agora = new Date();
    const hora = String(agora.getHours()).padStart(2, '0');
    const min = String(agora.getMinutes()).padStart(2, '0');
    const horaEl = document.getElementById('relogio-hora');
    const diaEl = document.getElementById('relogio-data');
    if (horaEl) horaEl.textContent = `${hora}:${min}`;
    if (diaEl) diaEl.textContent = `· ${DIAS[agora.getDay()]}, ${agora.getDate()} de ${MESES[agora.getMonth()]}`;
  }

  function formatarDataCurtaHome(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const MESES_CURTO = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return `${String(d.getDate()).padStart(2,'0')} ${MESES_CURTO[d.getMonth()]} ${d.getFullYear()}`;
  }

  function renderCardNovoMembro(u) {
    return `
      <a href="/perfil/${u.nick}" class="card-membro-fundo shrink-0 block hover:opacity-90 transition-opacity" title="${u.nick}">
        <div class="absolute inset-0 overflow-hidden rounded-[7px]">
          <span class="absolute top-0 mt-1.5 inset-x-0 text-center text-white text-sm font-bold px-2 pb-1.5 truncate bg-gradient-to-b from-black/60 to-transparent z-10">
            ${u.nick}
          </span>
          ${u.figure ? `<img src="${avatarUrl(u.figure, 'card', '3')}" class="absolute inset-x-0 top-0 mx-auto h-[92%] w-auto object-contain pointer-events-none select-none" alt="">` : ''}
        </div>
      </a>
    `;
  }

  async function carregarNovosMembros() {
    const raiz = document.getElementById('home-novos-membros');
    const resp = await apiFetch('/usuarios/recentes?limite=4');
    const membros = resp.ok ? await resp.json() : [];
    raiz.innerHTML = membros.length
      ? membros.map(renderCardNovoMembro).join('')
      : '<p class="text-sm text-muted">Nenhum membro cadastrado ainda.</p>';
  }

  function renderLinhaNoticiaHome(n) {
    return `
      <a href="/noticias.html" class="flex items-center gap-3 px-4 py-3 hover:bg-basebg transition-colors">
        ${n.imagem_capa_url
          ? `<img src="${n.imagem_capa_url}" class="h-12 w-12 rounded-lg object-cover shrink-0" alt="">`
          : `<span class="h-12 w-12 rounded-lg bg-basebg border border-border flex items-center justify-center text-accent shrink-0"><i class="fa-solid fa-bullhorn"></i></span>`}
        <div class="min-w-0">
          <p class="text-sm font-semibold truncate">${n.titulo}</p>
          <p class="text-xs text-muted mt-0.5">${n.autor_nick} · ${formatarDataCurtaHome(n.publicado_em || n.criado_em)}</p>
        </div>
      </a>
    `;
  }

  async function carregarUltimasNoticias() {
    const raiz = document.getElementById('home-ultimas-noticias');
    const resp = await apiFetch('/noticias?status=publicada');
    const noticias = resp.ok ? (await resp.json()).slice(0, 3) : [];
    raiz.innerHTML = noticias.length
      ? noticias.map(renderLinhaNoticiaHome).join('')
      : '<p class="text-sm text-muted p-4">Nenhuma notícia publicada ainda.</p>';
  }

  function renderLinhaDecretoHome(d) {
    return `
      <a href="/diario-oficial/${d.id}" class="flex items-center gap-3 px-4 py-3 hover:bg-basebg transition-colors">
        <span class="h-10 w-10 rounded-lg bg-basebg border border-border flex items-center justify-center overflow-hidden shrink-0 p-1">
          ${d.grupo_imagem_url ? `<img src="${d.grupo_imagem_url}" class="max-w-full max-h-full object-contain" alt="">` : '<i class="fa-solid fa-book-bookmark text-muted text-xs"></i>'}
        </span>
        <div class="min-w-0">
          <p class="text-sm font-semibold truncate">${d.titulo}</p>
          <p class="text-xs text-muted mt-0.5 font-mono">DECRETO-${d.numero}/${d.ano} · ${formatarDataCurtaHome(d.criado_em)}</p>
        </div>
      </a>
    `;
  }

  async function carregarUltimosDecretos() {
    const raiz = document.getElementById('home-diario-oficial');
    const resp = await apiFetch('/decretos?pagina=1');
    const dados = resp.ok ? await resp.json() : { decretos: [] };
    const decretos = (dados.decretos || []).slice(0, 3);
    raiz.innerHTML = decretos.length
      ? decretos.map(renderLinhaDecretoHome).join('')
      : '<p class="text-sm text-muted p-4">Nenhuma publicação no diário oficial ainda.</p>';
  }

  montarLayout('/index.html').then((me) => {
    if (!me) return;

    document.getElementById('boas-vindas').innerHTML = `
      <div class="bg-[#191b1f] text-[#e2e6e9] rounded-2xl p-6 relative overflow-hidden">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <h1 class="font-display text-2xl md:text-3xl font-black tracking-tight leading-tight flex items-center gap-2">
            <span>${saudacaoPorHorario()}, <span class="text-[#eaa506]">${me.nick}</span>!</span>
          </h1>
        </div>

        <div class="relative flex flex-wrap items-center justify-between gap-4 border-b border-[#3b3f45]/40 pb-4 mt-4">
          <div class="flex flex-wrap items-center gap-2">
            <a href="/perfil/${me.nick}" class="rounded-xl bg-[#2a2e32]/45 hover:bg-[#2a2e32]/80 hover:text-[#eaa506] transition-all px-4 py-2 text-sm font-bold text-[#e2e6e9]/90">Meu Perfil</a>
            <a href="/requerimentos/instrucao-inicial.html" class="rounded-xl bg-[#2a2e32]/45 hover:bg-[#2a2e32]/80 hover:text-[#eaa506] transition-all px-4 py-2 text-sm font-bold text-[#e2e6e9]/90">Requerimentos</a>
            <a href="/membros.html" class="rounded-xl bg-[#2a2e32]/45 hover:bg-[#2a2e32]/80 hover:text-[#eaa506] transition-all px-4 py-2 text-sm font-bold text-[#e2e6e9]/90">Membros</a>
            <a href="/feed.html" class="rounded-xl bg-[#2a2e32]/45 hover:bg-[#2a2e32]/80 hover:text-[#eaa506] transition-all px-4 py-2 text-sm font-bold text-[#e2e6e9]/90">Feed</a>
          </div>

          <div class="flex items-center gap-2 pr-20 md:pr-24 text-[#7b848e]">
            <div id="relogio" class="flex items-baseline gap-1 text-[#e2e6e9]">
              <span id="relogio-hora" class="font-display text-sm font-black tabular-nums leading-none"></span>
              <span id="relogio-data" class="hidden md:inline text-[0.74rem] font-bold text-[#7b848e]/70"></span>
            </div>
          </div>

          <div class="absolute -right-4 bottom-0 h-[150px] w-[110px] overflow-hidden pointer-events-none hidden sm:block">
            ${me.figure ? `
            <img class="absolute bottom-0 right-0 h-[140px] w-auto object-contain select-none"
              src="${avatarUrl(me.figure, 'pose', 'l')}">
            ` : ''}
          </div>
        </div>
      </div>

      ${!me.tem_senha ? `
        <div class="bg-card border border-accent/30 rounded-2xl p-5 mt-4 flex items-center justify-between gap-4 flex-wrap">
          <div>
            <p class="text-sm font-semibold flex items-center gap-2"><i class="fa-solid fa-key text-accent"></i> Você ainda não tem uma senha definida</p>
            <p class="text-xs text-muted mt-1">Hoje a única forma de entrar é pelo código na missão do Habblet. Defina uma senha pra poder entrar direto.</p>
          </div>
          <a href="/perfil/${me.nick}/configuracoes" class="text-xs font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors shrink-0">
            Definir senha
          </a>
        </div>
      ` : ''}
    `;

    atualizarRelogio();
    setInterval(atualizarRelogio, 1000 * 30);

    carregarNovosMembros();
    carregarUltimasNoticias();
    carregarUltimosDecretos();
  });
</script>
</body>
</html>
