<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-base text-dark font-sans min-h-screen">

  <div class="flex">
    <aside id="layout-sidebar" class="w-60 shrink-0 border-r border-border min-h-[calc(100vh-57px)] p-4 sticky top-[57px]"></aside>

    <main class="flex-1 max-w-3xl mx-auto px-4 py-10">
      <div id="boas-vindas"></div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-8">
        <a href="/requerimentos/instrucao-inicial.html" class="bg-card border border-border rounded-2xl p-5 hover:border-accent transition-colors">
          <p class="text-2xl mb-2">📝</p>
          <p class="font-semibold text-sm">Novo requerimento</p>
          <p class="text-xs text-muted mt-1">Instrução Inicial, promoção, licença...</p>
        </a>
        <a href="/grupos.html" class="bg-card border border-border rounded-2xl p-5 hover:border-accent transition-colors">
          <p class="text-2xl mb-2">🏢</p>
          <p class="font-semibold text-sm">Meus grupos</p>
          <p class="text-xs text-muted mt-1">Companhias, subcompanhias e órgãos</p>
        </a>
        <a href="/feed.html" class="bg-card border border-border rounded-2xl p-5 hover:border-accent transition-colors">
          <p class="text-2xl mb-2">🗨️</p>
          <p class="font-semibold text-sm">Feed</p>
          <p class="text-xs text-muted mt-1">Últimas publicações da corporação</p>
        </a>
      </div>
    </main>
  </div>

<script src="/assets/api.js"></script>
<script src="/assets/layout.js"></script>
<script>
  montarLayout('/index.html').then((me) => {
    if (!me) return;
    document.getElementById('boas-vindas').innerHTML = `
      <h1 class="text-2xl font-bold">Bem-vindo(a), ${me.nick}</h1>
      <p class="text-muted mt-1">
        ${me.patente_nome ? `${me.patente_nome} · ` : ''}${me.corpo === 'militar' ? 'Corpo Militar' : me.corpo === 'executivo' ? 'Corpo Executivo' : 'Conta institucional'}
      </p>
    `;
  });
</script>
</body>
</html>
