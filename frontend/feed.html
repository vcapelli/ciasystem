<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
  <div class="max-w-4xl mx-auto flex-1 w-full px-4 pt-8">
      <h1 class="text-xl font-display font-bold mb-4">Feed</h1>

      <div id="card-escrever" class="bg-card border border-border rounded-2xl p-4 mb-6">
        <p class="text-sm text-muted">Carregando…</p>
      </div>

      <div id="lista-tweets" class="space-y-3">
        <p class="text-sm text-muted">Carregando…</p>
      </div>

      <div id="paginacao" class="flex items-center justify-center gap-2 mt-6"></div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/tweets.js"></script>
<script>
  const PLACEHOLDERS_TWEET = [
    'O que está pensando?',
    'O que está acontecendo na corporação?',
    'Compartilhe uma novidade com o pessoal…',
    'Algum destaque do seu turno hoje?',
  ];

  let paginaAtual = 1;
  const POR_PAGINA = 5;
  let meAtual = null;

  // ---------- Card de escrever ----------
  async function montarCardEscrever(me) {
    const card = document.getElementById('card-escrever');
    card.innerHTML = `
      <div class="flex items-center gap-2.5 mb-3">
        ${renderAvatarTweet(me.nick, me.figure, 'grande')}
        <span class="font-semibold text-sm">${me.nick}</span>
      </div>
      <form id="form-tweet">
        <textarea id="tweet-conteudo" rows="3" maxlength="500" placeholder="${PLACEHOLDERS_TWEET[0]}"
          class="w-full bg-transparent resize-none text-dark placeholder:text-muted/60 focus:outline-none text-sm"></textarea>
        <div class="flex justify-end mt-2">
          <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-xl px-5 py-2 text-sm transition-colors">
            Publicar
          </button>
        </div>
      </form>
    `;

    const textarea = document.getElementById('tweet-conteudo');
    let indicePlaceholder = 0;
    setInterval(() => {
      if (document.activeElement === textarea || textarea.value) return;
      indicePlaceholder = (indicePlaceholder + 1) % PLACEHOLDERS_TWEET.length;
      textarea.placeholder = PLACEHOLDERS_TWEET[indicePlaceholder];
    }, 3500);

    document.getElementById('form-tweet').addEventListener('submit', async (e) => {
      e.preventDefault();
      const conteudo = textarea.value.trim();
      if (!conteudo) return;
      const resposta = await apiFetch('/tweets', { method: 'POST', body: JSON.stringify({ conteudo }) });
      if (resposta.ok) {
        textarea.value = '';
        paginaAtual = 1;
        carregarFeed();
      }
    });
  }

  function renderPaginacao(total) {
    const totalPaginas = Math.max(1, Math.ceil(total / POR_PAGINA));
    const paginacao = document.getElementById('paginacao');
    if (totalPaginas <= 1) { paginacao.innerHTML = ''; return; }

    paginacao.innerHTML = `
      <button id="btn-pagina-anterior" ${paginaAtual === 1 ? 'disabled' : ''} class="h-8 w-8 rounded-lg bg-card border border-border text-sm disabled:opacity-40 hover:bg-basebg transition-colors">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <span class="text-xs text-muted px-2">Página ${paginaAtual} de ${totalPaginas}</span>
      <button id="btn-pagina-seguinte" ${paginaAtual === totalPaginas ? 'disabled' : ''} class="h-8 w-8 rounded-lg bg-card border border-border text-sm disabled:opacity-40 hover:bg-basebg transition-colors">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    `;

    document.getElementById('btn-pagina-anterior')?.addEventListener('click', () => {
      if (paginaAtual > 1) { paginaAtual--; carregarFeed(); }
    });
    document.getElementById('btn-pagina-seguinte')?.addEventListener('click', () => {
      if (paginaAtual < totalPaginas) { paginaAtual++; carregarFeed(); }
    });
  }

  async function carregarFeed() {
    const resposta = await apiFetch(`/tweets?pagina=${paginaAtual}`);
    const lista = document.getElementById('lista-tweets');
    if (!resposta.ok) {
      lista.innerHTML = '<p class="text-sm text-red-400">Não foi possível carregar o feed.</p>';
      return;
    }
    const { tweets, total } = await resposta.json();
    await preencherFigurasTweets(tweets);

    lista.innerHTML = tweets.length
      ? tweets.map((t) => renderCardTweet(t)).join('')
      : '<p class="text-sm text-muted">Ainda não há publicações.</p>';

    renderPaginacao(total);
    ligarAcoesTweet(lista, meAtual);
  }

  montarLayout('/feed.html').then((me) => {
    if (!me) return;
    meAtual = me;
    montarCardEscrever(me);
    carregarFeed();
  });
</script>
</body>
</html>
