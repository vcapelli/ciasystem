<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
  <div class="max-w-6xl mx-auto flex-1 w-full px-4 pt-8">
      <div id="conteudo">
        <p class="text-sm text-muted">Carregando…</p>
      </div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/tweets.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/requerimentos.js"></script>
<script>
  const partes = location.pathname.split('/').filter(Boolean); // ['perfil', nick, aba?]
  const nickAlvo = decodeURIComponent(partes[1] || '');
  const aba = partes[2] || 'linha-do-tempo';

  const BADGE_STATUS = {
    ativo: 'bg-green-500/15 text-green-400',
    licenca: 'bg-accent/15 text-accent',
    reformado: 'bg-white/10 text-muted',
    desligado_honroso: 'bg-white/10 text-muted',
    desligado_desonroso: 'bg-red-500/15 text-red-400',
    exonerado: 'bg-red-500/15 text-red-400',
  };

  const ICONE_TIPO = {
    instrucao_inicial: 'fa-solid fa-graduation-cap', promocao: 'fa-solid fa-arrow-up', rebaixamento: 'fa-solid fa-arrow-down',
    advertencia: 'fa-solid fa-triangle-exclamation', licenca: 'fa-solid fa-pause', volta_licenca: 'fa-solid fa-play',
    reserva: 'fa-solid fa-clock', transferencia_conta: 'fa-solid fa-right-left', transferencia_corpo: 'fa-solid fa-right-left',
    venda_cargo: 'fa-solid fa-sack-dollar', contratacao: 'fa-solid fa-user-plus', tag: 'fa-solid fa-tag',
    turno_tarefa: 'fa-solid fa-clock', reforma: 'fa-solid fa-medal', desligamento_honroso: 'fa-solid fa-door-open',
    desligamento_desonroso: 'fa-solid fa-door-open', exoneracao: 'fa-solid fa-ban', bonificacao: 'fa-solid fa-star',
    cancelamento: 'fa-solid fa-xmark',
  };

  // Monta a URL do avatar do perfil com a pose escolhida pelo próprio
  // usuário (direção do corpo, da cabeça, expressão) — cai nos padrões
  // de sempre quando ele nunca personalizou.
  function montarUrlAvatarPerfil(dados) {
    const params = new URLSearchParams({ figure: dados.figure, img_format: 'png' });
    params.set('direction', dados.avatar_direction || '2');
    params.set('head_direction', dados.avatar_head_direction || dados.avatar_direction || '2');
    params.set('gesture', dados.avatar_gesture || 'std');
    return `https://imaging.habblet.city/avatarimage?${params.toString()}`;
  }

  function formatarDataCurta(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return `${String(d.getDate()).padStart(2,'0')} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
  }

  // Fluxo de definir/alterar senha — pede código (posta na missão do
  // Habblet), depois confirma junto com a senha nova. Reaproveita os
  // mesmos endpoints do login por código.
  function ligarFluxoSenha(dados) {
    const btnIniciar = document.getElementById('btn-iniciar-senha');
    if (!btnIniciar) return;
    const fluxo = document.getElementById('fluxo-senha');

    btnIniciar.addEventListener('click', () => {
      const abrindo = fluxo.classList.contains('hidden');
      fluxo.classList.add('hidden');
      if (!abrindo) return;
      fluxo.classList.remove('hidden');
      fluxo.innerHTML = `
        <form id="form-solicitar-codigo-senha">
          <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Enviar código pra minha missão</button>
        </form>
      `;

      document.getElementById('form-solicitar-codigo-senha').addEventListener('submit', async (e) => {
        e.preventDefault();
        const resp = await apiFetch('/auth/solicitar-codigo', {
          method: 'POST',
          body: JSON.stringify({ nick: dados.nick, finalidade: 'senha' }),
        });
        if (!resp.ok) {
          fluxo.innerHTML = '<p class="text-xs text-red-500">Não foi possível gerar o código, tenta de novo.</p>';
          return;
        }
        const { codigo, instrucao } = await resp.json();

        fluxo.innerHTML = `
          <div class="bg-basebg border border-border rounded-lg p-4 mb-3">
            <p class="text-xs text-muted mb-1">Coloque esse código na sua missão do Habblet:</p>
            <p class="text-lg font-bold font-mono tracking-wide">${codigo}</p>
            <p class="text-xs text-muted mt-1">${instrucao}</p>
          </div>
          <form id="form-definir-senha" class="space-y-2">
            <input id="nova-senha" type="password" placeholder="Nova senha (mín. 6 caracteres)" required minlength="6" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <input id="confirmar-senha" type="password" placeholder="Confirme a nova senha" required minlength="6" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Confirmar e salvar senha</button>
            <p id="msg-definir-senha" class="hidden text-xs mt-2"></p>
          </form>
        `;

        document.getElementById('form-definir-senha').addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const msg = document.getElementById('msg-definir-senha');
          const senha = document.getElementById('nova-senha').value;
          const confirmar = document.getElementById('confirmar-senha').value;

          msg.classList.remove('hidden');
          if (senha !== confirmar) {
            msg.textContent = 'As senhas não coincidem.';
            msg.className = 'text-xs mt-2 text-red-500';
            return;
          }

          const respSenha = await apiFetch('/auth/definir-senha', {
            method: 'POST',
            body: JSON.stringify({ nick: dados.nick, codigo, senha }),
          });

          if (respSenha.ok) {
            msg.textContent = 'Senha salva! Já pode entrar com nick e senha da próxima vez.';
            msg.className = 'text-xs mt-2 text-green-600';
          } else {
            const d = await respSenha.json().catch(() => ({}));
            msg.textContent = d.erro || 'Não foi possível salvar a senha — o código pode ter expirado, tenta de novo.';
            msg.className = 'text-xs mt-2 text-red-500';
          }
        });
      });
    });
  }

  const PREFIXO_IDENTIFICACAO = {
    promocao: '', rebaixamento: 'R/',
    // outros tipos entram aqui conforme forem confirmados nos moldes oficiais
  };

  function montarIdentificacao(nick, tipo, autorTag, data) {
    const prefixo = PREFIXO_IDENTIFICACAO[tipo] ?? '';
    return `${nick} [${prefixo}${autorTag || '—'}] ${formatarDataCurta(data)}`;
  }

  function tituloTipo(tipo) {
    return tipo.replace(/_/g, ' ').replace(/\b\w/g, (l) => l.toUpperCase());
  }

  function renderDistincoes(titulo, lista) {
    if (!lista.length) return '';
    return `
      <div class="mt-3">
        <p class="text-xs uppercase tracking-wide text-muted mb-2">${titulo}</p>
        <div class="flex flex-wrap gap-2">
          ${lista.map((d) => `
            <span title="${d.descricao || ''}" class="flex items-center gap-1.5 bg-basebg border border-border rounded-full pl-1 pr-3 py-1 text-xs">
              <img src="${d.imagem_url}" class="h-5 w-5 rounded-full object-cover" onerror="this.style.display='none'">
              ${d.titulo}
            </span>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderAbas(nick, ehMeuPerfil) {
    const abas = [
      { id: 'linha-do-tempo', label: 'Linha do tempo', href: `/perfil/${nick}` },
      { id: 'cursos', label: 'Cursos', href: `/perfil/${nick}/cursos` },
      { id: 'postagens', label: 'Feed', href: `/perfil/${nick}/postagens` },
    ];
    if (ehMeuPerfil) abas.push({ id: 'configuracoes', label: 'Configurações', href: `/perfil/${nick}/configuracoes` });
    return `
      <div class="flex gap-6 border-b border-border mb-4">
        ${abas.map((a) => `
          <a href="${a.href}" class="pb-3 text-sm font-semibold border-b-2 transition-colors ${aba === a.id ? 'border-accent text-dark' : 'border-transparent text-muted hover:text-dark'}">
            ${a.label}
          </a>
        `).join('')}
      </div>
    `;
  }

  function renderTimeline(itens, patentesMapa, me) {
    if (!itens.length) return '<p class="text-sm text-muted">Nenhum requerimento registrado ainda.</p>';
    return `
      <div class="space-y-3">
        ${itens.map((r, i) => {
          const cor = COR_STATUS_REQ[r.status] || COR_STATUS_REQ.pendente;
          const icone = ICONE_TIPO[r.tipo] || 'fa-solid fa-file-lines';
          return `
            <div class="flex gap-3">
              <div class="flex flex-col items-center">
                <span class="h-9 w-9 rounded-full bg-basebg border-2 flex items-center justify-center text-sm shrink-0" style="border-color: ${cor.barra}; color: ${cor.barra}">
                  <i class="${icone}"></i>
                </span>
                ${i < itens.length - 1 ? '<span class="flex-1 w-px bg-border mt-1"></span>' : ''}
              </div>
              <div class="flex-1 mb-1 min-w-0">
                ${renderCardRequerimento(r, patentesMapa, me)}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderCursos(usuarioId) {
    setTimeout(() => montarCursosAsync(usuarioId), 0);
    return '<div id="cursos-raiz"><p class="text-sm text-muted">Carregando…</p></div>';
  }

  async function montarCursosAsync(usuarioId) {
    const raiz = document.getElementById('cursos-raiz');
    if (!raiz) return;
    const resp = await apiFetch(`/grupos/cursos-concluidos/${usuarioId}`);
    const cursos = resp.ok ? await resp.json() : [];

    raiz.innerHTML = cursos.length ? `
      <div class="space-y-2">
        ${cursos.map((c) => `
          <div class="bg-card border border-border rounded-2xl shadow-sm px-4 py-3 flex items-center gap-3">
            <span class="h-11 w-11 rounded-xl bg-basebg border border-border flex items-center justify-center overflow-hidden shrink-0 p-1.5">
              ${c.grupo_imagem_url ? `<img src="${c.grupo_imagem_url}" class="max-w-full max-h-full object-contain" alt="">` : `<i class="fa-solid fa-graduation-cap text-muted"></i>`}
            </span>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold truncate">${c.curso_titulo}</p>
              <p class="text-xs text-muted truncate">Instrutor: ${c.instrutor_nick}</p>
              ${c.comentario ? `<p class="text-xs text-muted mt-0.5">${c.comentario}</p>` : ''}
            </div>
            <p class="text-xs text-muted shrink-0">${c.data_efetiva}</p>
          </div>
        `).join('')}
      </div>
    ` : '<p class="text-sm text-muted">Nenhum curso concluído ainda.</p>';
  }

  function renderPostagens(tweets, me) {
    setTimeout(() => montarPostagensAsync(tweets, me), 0);
    return '<div id="postagens-raiz"><p class="text-sm text-muted">Carregando…</p></div>';
  }

  async function montarPostagensAsync(tweets, me) {
    const raiz = document.getElementById('postagens-raiz');
    if (!raiz) return;
    if (!tweets.length) { raiz.innerHTML = '<p class="text-sm text-muted">Nenhuma publicação ainda.</p>'; return; }

    // Repostagens: busca o post original (com o mesmo formato dos
    // demais) e guarda quem repostou pra desenhar o aviso em cima.
    const itens = await Promise.all(tweets.map(async (t) => {
      if (!t.tweet_original_id) return { tweetParaExibir: t, repostadoPor: null };
      const r = await apiFetch(`/tweets/${t.tweet_original_id}`);
      if (!r.ok) return { tweetParaExibir: t, repostadoPor: t.autor_nick };
      return { tweetParaExibir: await r.json(), repostadoPor: t.autor_nick };
    }));

    await preencherFigurasTweets(itens.map((i) => i.tweetParaExibir));

    raiz.innerHTML = `<div class="space-y-3">${itens.map((i) => renderCardTweet(i.tweetParaExibir, i.repostadoPor, me)).join('')}</div>`;
    ligarAcoesTweet(raiz, me);
  }

  function renderThumbBanner(banner, selecionado) {
    return `
      <button type="button" data-banner-id="${banner.id}"
        class="thumb-banner relative h-20 rounded-xl overflow-hidden border-2 transition-colors ${selecionado ? 'border-accent' : 'border-transparent'}"
        style="background-image: url('${banner.imagem_url}'); background-size: cover; background-position: center;">
        ${selecionado ? '<span class="absolute top-1 right-1 h-5 w-5 rounded-full bg-accent text-white flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></span>' : ''}
      </button>
    `;
  }

  function renderConfiguracoes(dados, banners, me) {
    let bannerSelecionadoId = dados.banner_perfil_id || null;
    let corSelecionada = dados.cor_avatar_fundo || null;
    let imagemSelecionada = dados.avatar_fundo_imagem_url || null;
    let modoFundoAvatar = imagemSelecionada ? 'imagem' : 'cor';
    let direcaoCorpo = dados.avatar_direction || '2';
    let direcaoCabeca = dados.avatar_head_direction || dados.avatar_direction || '2';
    let gestoSelecionado = dados.avatar_gesture || 'std';

    const DIRECOES_AVATAR = [
      { valor: '0', rotulo: 'Direita' }, { valor: '1', rotulo: 'Frente-Direita' },
      { valor: '2', rotulo: 'Frente' }, { valor: '3', rotulo: 'Frente-Esquerda' },
      { valor: '4', rotulo: 'Esquerda' }, { valor: '5', rotulo: 'Trás-Esquerda' },
      { valor: '6', rotulo: 'Trás' }, { valor: '7', rotulo: 'Trás-Direita' },
    ];
    const GESTOS_AVATAR = [
      { valor: 'std', rotulo: 'Normal' }, { valor: 'sml', rotulo: 'Sorriso' },
      { valor: 'sad', rotulo: 'Triste' }, { valor: 'ang', rotulo: 'Bravo' },
      { valor: 'eyb', rotulo: 'Olhos fechados' },
    ];

    function atualizarPreviewPose() {
      const el = document.getElementById('preview-pose-avatar');
      if (!el || !dados.figure) return;
      const url = montarUrlAvatarPerfil({ figure: dados.figure, avatar_direction: direcaoCorpo, avatar_head_direction: direcaoCabeca, avatar_gesture: gestoSelecionado });
      el.innerHTML = `<img src="${url.replace('img_format=png', 'img_format=png&size=l')}" class="w-full h-[190%] object-cover object-top -mt-6" alt="">`;
    }

    setTimeout(() => {
      const raiz = document.getElementById('config-perfil-raiz');
      if (!raiz) return;

      function repintar() {
        raiz.innerHTML = `
          <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-4">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Banner do perfil</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
              <button type="button" data-banner-id="" class="thumb-banner relative h-20 rounded-xl overflow-hidden border-2 flex items-center justify-center text-xs text-muted bg-basebg ${!bannerSelecionadoId ? 'border-accent' : 'border-transparent'}">
                Padrão do sistema
                ${!bannerSelecionadoId ? '<span class="absolute top-1 right-1 h-5 w-5 rounded-full bg-accent text-white flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></span>' : ''}
              </button>
              ${banners.map((b) => renderThumbBanner(b, bannerSelecionadoId === b.id)).join('')}
            </div>
            ${!banners.length ? '<p class="text-xs text-muted mt-2">Nenhum banner extra cadastrado ainda — fala com um administrador do sistema.</p>' : ''}
          </div>

          <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-4">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Fundo do avatar</h2>
            <div class="flex gap-2 mb-3">
              <button type="button" data-modo="cor" class="btn-modo-fundo text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${modoFundoAvatar === 'cor' ? 'bg-accent text-white' : 'bg-basebg text-muted'}">Cor</button>
              <button type="button" data-modo="imagem" class="btn-modo-fundo text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${modoFundoAvatar === 'imagem' ? 'bg-accent text-white' : 'bg-basebg text-muted'}">Imagem</button>
            </div>

            ${modoFundoAvatar === 'cor' ? `
              <div class="flex items-center gap-3">
                <input id="cor-avatar" type="color" value="${corSelecionada || '#e2e4e9'}" class="h-10 w-16 bg-basebg border border-border rounded-lg cursor-pointer">
                <button type="button" id="btn-cor-padrao" class="text-xs text-muted hover:text-dark transition-colors underline">Usar padrão</button>
              </div>
            ` : `
              <input id="imagem-avatar" placeholder="https://…" value="${imagemSelecionada || ''}" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <p class="text-xs text-muted mt-1">Cole o link de uma imagem — livre, sem precisar de aprovação.</p>
            `}
          </div>

          <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-4">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Pose do avatar</h2>
            <div class="flex flex-col sm:flex-row gap-5">
              <div class="shrink-0 text-center">
                <span id="preview-pose-avatar" class="h-28 w-28 mx-auto rounded-full bg-basebg border border-border overflow-hidden inline-block"></span>
                <p class="text-xs text-muted mt-1.5">Pré-visualização</p>
              </div>
              <div class="flex-1 space-y-3">
                <div>
                  <p class="text-xs text-muted mb-1.5">Direção do corpo</p>
                  <div class="flex flex-wrap gap-1.5">
                    ${DIRECOES_AVATAR.map((d) => `
                      <button type="button" data-corpo="${d.valor}" title="${d.rotulo}" class="btn-direcao-corpo h-8 w-8 rounded-lg text-xs font-semibold transition-colors ${direcaoCorpo === d.valor ? 'bg-accent text-white' : 'bg-basebg text-muted hover:bg-border/60'}">${d.valor}</button>
                    `).join('')}
                  </div>
                </div>
                <div>
                  <p class="text-xs text-muted mb-1.5">Direção da cabeça</p>
                  <div class="flex flex-wrap gap-1.5">
                    ${DIRECOES_AVATAR.map((d) => `
                      <button type="button" data-cabeca="${d.valor}" title="${d.rotulo}" class="btn-direcao-cabeca h-8 w-8 rounded-lg text-xs font-semibold transition-colors ${direcaoCabeca === d.valor ? 'bg-accent text-white' : 'bg-basebg text-muted hover:bg-border/60'}">${d.valor}</button>
                    `).join('')}
                  </div>
                </div>
                <div>
                  <p class="text-xs text-muted mb-1.5">Expressão</p>
                  <div class="flex flex-wrap gap-1.5">
                    ${GESTOS_AVATAR.map((g) => `
                      <button type="button" data-gesto="${g.valor}" class="btn-gesto-avatar text-xs font-semibold px-2.5 py-1.5 rounded-lg transition-colors ${gestoSelecionado === g.valor ? 'bg-accent text-white' : 'bg-basebg text-muted hover:bg-border/60'}">${g.rotulo}</button>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <button id="btn-salvar-config" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-5 py-2.5 text-sm transition-colors">
            Salvar
          </button>
          <p id="msg-salvar-config" class="hidden text-xs mt-2"></p>

          <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-6">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-1">Senha de acesso</h2>
            <p class="text-xs text-muted mb-3">
              ${dados.tem_senha
                ? 'Você já tem uma senha definida — pode entrar com ela em vez de pedir código toda vez.'
                : 'Hoje a única forma de entrar é pelo código na missão do Habblet. Defina uma senha pra poder entrar direto com nick e senha.'}
            </p>
            <button id="btn-iniciar-senha" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">
              ${dados.tem_senha ? 'Alterar senha' : 'Definir senha'}
            </button>
            <div id="fluxo-senha" class="hidden mt-4"></div>
          </div>

          ${me.administrador_sistema ? `
            <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-6">
              <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Administração — banners disponíveis</h2>
              <div class="space-y-2 mb-4">
                ${banners.length ? banners.map((b) => `
                  <div class="flex items-center gap-3 bg-basebg border border-border rounded-xl p-2">
                    <div class="h-12 w-20 rounded-lg bg-cover bg-center shrink-0" style="background-image: url('${b.imagem_url}')"></div>
                    <p class="text-sm flex-1 truncate">${b.nome || b.imagem_url}</p>
                    <button type="button" data-remover-id="${b.id}" class="btn-remover-banner text-muted hover:text-red-600 transition-colors px-2">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </div>
                `).join('') : '<p class="text-sm text-muted">Nenhum banner cadastrado ainda.</p>'}
              </div>
              <form id="form-novo-banner" class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2">
                <input id="novo-banner-url" placeholder="URL da imagem" required class="bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                <input id="novo-banner-nome" placeholder="Nome (opcional)" class="bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Adicionar</button>
              </form>
            </div>
          ` : ''}
        `;

        atualizarPreviewPose();
        ligarFluxoSenha(dados);

        raiz.querySelectorAll('.thumb-banner').forEach((btn) => {
          btn.addEventListener('click', () => {
            bannerSelecionadoId = btn.dataset.bannerId ? Number(btn.dataset.bannerId) : null;
            repintar();
          });
        });

        raiz.querySelectorAll('.btn-direcao-corpo').forEach((btn) => {
          btn.addEventListener('click', () => { direcaoCorpo = btn.dataset.corpo; repintar(); });
        });
        raiz.querySelectorAll('.btn-direcao-cabeca').forEach((btn) => {
          btn.addEventListener('click', () => { direcaoCabeca = btn.dataset.cabeca; repintar(); });
        });
        raiz.querySelectorAll('.btn-gesto-avatar').forEach((btn) => {
          btn.addEventListener('click', () => { gestoSelecionado = btn.dataset.gesto; repintar(); });
        });

        raiz.querySelectorAll('.btn-modo-fundo').forEach((btn) => {
          btn.addEventListener('click', () => {
            modoFundoAvatar = btn.dataset.modo;
            repintar();
          });
        });

        document.getElementById('cor-avatar')?.addEventListener('input', (e) => { corSelecionada = e.target.value; });
        document.getElementById('btn-cor-padrao')?.addEventListener('click', () => {
          corSelecionada = null;
          document.getElementById('cor-avatar').value = '#e2e4e9';
        });
        document.getElementById('imagem-avatar')?.addEventListener('input', (e) => { imagemSelecionada = e.target.value.trim() || null; });

        document.getElementById('btn-salvar-config').addEventListener('click', async () => {
          const msg = document.getElementById('msg-salvar-config');
          const resp = await apiFetch('/usuarios/me', {
            method: 'PATCH',
            body: JSON.stringify({
              banner_perfil_id: bannerSelecionadoId,
              cor_avatar_fundo: modoFundoAvatar === 'cor' ? corSelecionada : null,
              avatar_fundo_imagem_url: modoFundoAvatar === 'imagem' ? imagemSelecionada : null,
              avatar_direction: direcaoCorpo,
              avatar_head_direction: direcaoCabeca,
              avatar_gesture: gestoSelecionado,
            }),
          });
          msg.classList.remove('hidden');
          if (resp.ok) {
            msg.textContent = 'Salvo! Recarregue a página do perfil pra ver o resultado.';
            msg.className = 'text-xs mt-2 text-green-600';
          } else {
            const d = await resp.json().catch(() => ({}));
            msg.textContent = d.erro || 'Não foi possível salvar.';
            msg.className = 'text-xs mt-2 text-red-500';
          }
        });

        const formNovoBanner = document.getElementById('form-novo-banner');
        if (formNovoBanner) {
          formNovoBanner.addEventListener('submit', async (e) => {
            e.preventDefault();
            const resp = await apiFetch('/banners-perfil', {
              method: 'POST',
              body: JSON.stringify({
                imagem_url: document.getElementById('novo-banner-url').value.trim(),
                nome: document.getElementById('novo-banner-nome').value.trim() || undefined,
              }),
            });
            if (resp.ok) {
              const nova = await apiFetch('/banners-perfil');
              banners.length = 0;
              banners.push(...(nova.ok ? await nova.json() : []));
              repintar();
            }
          });

          raiz.querySelectorAll('.btn-remover-banner').forEach((btn) => {
            btn.addEventListener('click', async () => {
              if (!confirm('Remover esse banner da lista?')) return;
              await apiFetch(`/banners-perfil/${btn.dataset.removerId}`, { method: 'DELETE' });
              const idx = banners.findIndex((b) => String(b.id) === btn.dataset.removerId);
              if (idx >= 0) banners.splice(idx, 1);
              if (bannerSelecionadoId === Number(btn.dataset.removerId)) bannerSelecionadoId = null;
              repintar();
            });
          });
        }
      }

      repintar();
    }, 0);

    return '<div id="config-perfil-raiz"><p class="text-sm text-muted">Carregando…</p></div>';
  }

  async function carregar(me) {
    const container = document.getElementById('conteudo');
    const respPerfil = await apiFetch(`/usuarios/nick/${encodeURIComponent(nickAlvo)}`);

    if (!respPerfil.ok) {
      container.innerHTML = '<p class="text-sm text-red-400">Usuário não encontrado.</p>';
      return;
    }

    const perfil = await respPerfil.json();
    const ehMeuPerfil = me.nick === perfil.nick;

    const [emblemasResp, honrariasResp, conquistasResp, gruposResp, requerimentosResp, tweetsResp, patentesResp, bannersResp, meCompletoResp] = await Promise.all([
      apiFetch(`/emblemas/usuario/${perfil.id}`),
      apiFetch(`/honrarias/usuario/${perfil.id}`),
      apiFetch(`/conquistas/usuario/${perfil.id}`),
      apiFetch(`/grupos/usuario/${perfil.id}`),
      apiFetch(`/requerimentos/alvo/${perfil.id}`),
      apiFetch(`/tweets?autor_id=${perfil.id}`),
      apiFetch(`/patentes`),
      ehMeuPerfil && aba === 'configuracoes' ? apiFetch('/banners-perfil') : Promise.resolve(null),
      ehMeuPerfil && aba === 'configuracoes' ? apiFetch('/usuarios/me') : Promise.resolve(null),
    ]);
    const emblemas = emblemasResp.ok ? await emblemasResp.json() : [];
    const honrarias = honrariasResp.ok ? await honrariasResp.json() : [];
    const conquistas = conquistasResp.ok ? await conquistasResp.json() : [];
    const grupos = gruposResp.ok ? await gruposResp.json() : [];
    const requerimentos = requerimentosResp.ok ? await requerimentosResp.json() : [];
    const tweetsResposta = tweetsResp.ok ? await tweetsResp.json() : { tweets: [] };
    const tweets = tweetsResposta.tweets ?? [];
    const patentesMapa = {};
    if (patentesResp.ok) {
      for (const p of await patentesResp.json()) patentesMapa[p.id] = p.nome;
    }
    const banners = bannersResp?.ok ? await bannersResp.json() : [];
    const meCompleto = meCompletoResp?.ok ? await meCompletoResp.json() : me;

    const ultimoRequerimento = requerimentos[0]?.criado_em;
    const avatarCirculo = perfil.figure ? montarUrlAvatarPerfil(perfil) : null;
    const avatarGrande = perfil.figure ? avatarUrl(perfil.figure, 'grande', '2') : null;

    // Dias no posto (desde a última mudança de patente aprovada) e
    // dias na polícia (desde a instrução inicial/contratação).
    const TIPOS_MUDANCA_PATENTE = ['instrucao_inicial', 'promocao', 'rebaixamento', 'contratacao', 'transferencia_corpo'];
    const TIPOS_INGRESSO = ['instrucao_inicial', 'contratacao'];
    const reqsAprovados = requerimentos.filter((r) => r.status === 'aprovado');
    function diasDesde(iso) { return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null; }

    const ultimaMudancaPatente = reqsAprovados.find((r) => TIPOS_MUDANCA_PATENTE.includes(r.tipo));
    const diasNoPosto = diasDesde(ultimaMudancaPatente?.criado_em);

    const reqsIngresso = reqsAprovados.filter((r) => TIPOS_INGRESSO.includes(r.tipo));
    const primeiroIngresso = reqsIngresso[reqsIngresso.length - 1] || reqsAprovados[reqsAprovados.length - 1];
    const diasNaPolicia = diasDesde(primeiroIngresso?.criado_em);

    const textoIdentificacao = requerimentos[0]
      ? montarIdentificacao(perfil.nick, requerimentos[0].tipo, requerimentos[0].autor_tag, requerimentos[0].criado_em)
      : `${perfil.nick}${perfil.tag ? ` [${perfil.tag}]` : ''}`;
    const abreviacoesGrupos = grupos.filter((g) => g.nivel_abreviacao).map((g) => `${g.nivel_abreviacao}.${g.codigo}`);
    const textoIdentificacaoCompleto = abreviacoesGrupos.length
      ? `${textoIdentificacao} - ${abreviacoesGrupos.join('/')}`
      : textoIdentificacao;

    container.innerHTML = `
      <div class="relative mb-16">
        <div class="perfil-banner h-44 rounded-2xl overflow-hidden" ${perfil.banner_imagem_url ? `style="background-image: url('${perfil.banner_imagem_url}')"` : ''}></div>
        <div class="absolute left-6 -bottom-14 h-28 w-28 rounded-full ring-4 ring-basebg overflow-hidden"
          style="${perfil.avatar_fundo_imagem_url ? `background-image: url('${perfil.avatar_fundo_imagem_url}'); background-size: cover; background-position: center;` : `background-color: ${perfil.cor_avatar_fundo || '#e2e4e9'};`}">
          ${avatarCirculo
            ? `<img src="${avatarCirculo}" class="absolute inset-0 w-full h-full object-cover object-center" alt="">`
            : `<div class="w-full h-full flex items-center justify-center text-2xl font-bold">${perfil.nick.slice(0,2).toUpperCase()}</div>`}
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6">
        <div>
          <div class="bg-card border border-border rounded-2xl p-5 shadow-sm">
            ${avatarGrande ? `
              <div class="flex justify-center mb-3">
                <img src="${avatarGrande}" class="max-h-64 object-contain" alt="Avatar de ${perfil.nick}">
              </div>
            ` : ''}
            <p class="text-center text-lg font-display font-bold">${perfil.nick}</p>

            <div class="flex items-center gap-2 bg-basebg border border-border rounded-lg px-3 py-2 mt-3">
              <p id="texto-identificacao" class="text-xs flex-1 min-w-0 truncate">${textoIdentificacaoCompleto}</p>
              <button id="btn-copiar-identificacao" title="Copiar" class="text-muted hover:text-accent transition-colors shrink-0">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>

            <div class="text-sm mt-4 space-y-1.5">
              <p><b>Status:</b> <span class="capitalize">${(perfil.status || '').replace(/_/g, ' ')}</span></p>
              <p><b>Patente/Cargo:</b> ${perfil.patente_nome || 'Conta institucional'}</p>
              <p><b>Dias no posto:</b> ${diasNoPosto ?? '—'}</p>
              <p><b>Dias na polícia:</b> ${diasNaPolicia ?? '—'}</p>
            </div>
          </div>

          ${grupos.length ? `
            <div class="bg-card border border-border rounded-2xl p-4 mt-4 shadow-sm">
              <p class="text-xs uppercase tracking-wide text-muted mb-2">Grupos</p>
              <div class="flex flex-wrap gap-2">
                ${grupos.map((g) => `
                  <a href="/grupos/${g.slug}" title="${g.nome} · ${g.nivel_nome}" class="h-11 w-11 rounded-xl bg-basebg border border-border flex items-center justify-center overflow-hidden p-1.5 hover:border-accent transition-colors">
                    ${g.imagem_url ? `<img src="${g.imagem_url}" class="max-w-full max-h-full object-contain" alt="${g.nome}">` : `<span class="text-xs font-bold">${g.codigo}</span>`}
                  </a>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div class="bg-card border border-border rounded-2xl p-4 mt-4 shadow-sm">
            <p class="text-xs uppercase tracking-wide text-muted mb-2">Biografia</p>
            <div id="bio-area"></div>
          </div>

          <div class="bg-card border border-border rounded-2xl p-4 mt-4 shadow-sm">
            <p class="text-xs uppercase tracking-wide text-muted mb-1">Distinções</p>
            ${renderDistincoes('Emblemas', emblemas)}
            ${renderDistincoes('Honrarias', honrarias)}
            ${renderDistincoes('Conquistas', conquistas)}
            ${!emblemas.length && !honrarias.length && !conquistas.length ? '<p class="text-sm text-muted mt-1">Nenhuma distinção ainda.</p>' : ''}
          </div>
        </div>

        <div>
          ${renderAbas(perfil.nick, ehMeuPerfil)}
          ${aba === 'postagens' ? renderPostagens(tweets, me) : aba === 'cursos' ? renderCursos(perfil.id) : aba === 'configuracoes' && ehMeuPerfil ? renderConfiguracoes(meCompleto, banners, me) : renderTimeline(requerimentos, patentesMapa, me)}
        </div>
      </div>
    `;

    document.getElementById('btn-copiar-identificacao').addEventListener('click', async () => {
      const btn = document.getElementById('btn-copiar-identificacao');
      try {
        await navigator.clipboard.writeText(document.getElementById('texto-identificacao').textContent);
        btn.innerHTML = '<i class="fa-solid fa-check text-green-600"></i>';
        setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy"></i>'; }, 1500);
      } catch {}
    });


    const bioArea = document.getElementById('bio-area');
    if (ehMeuPerfil) {
      bioArea.innerHTML = `
        <textarea id="bio-textarea" rows="3" maxlength="500" placeholder="Escreva algo sobre você…"
          class="w-full bg-card border border-border rounded-xl px-3 py-2 text-sm text-dark placeholder:text-muted/60 focus:outline-none focus:ring-2 focus:ring-accent">${perfil.biografia || ''}</textarea>
        <div class="flex justify-end mt-1.5">
          <button id="btn-salvar-bio" class="text-xs bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-3 py-1.5 transition-colors">Salvar</button>
        </div>
      `;
      document.getElementById('btn-salvar-bio').addEventListener('click', async () => {
        const biografia = document.getElementById('bio-textarea').value.trim();
        await apiFetch('/usuarios/me', { method: 'PATCH', body: JSON.stringify({ biografia }) });
      });
    } else {
      bioArea.innerHTML = perfil.biografia
        ? `<p class="text-sm text-muted whitespace-pre-wrap">${perfil.biografia}</p>`
        : '';
    }
  }

  montarLayout('/perfil').then((me) => {
    if (!me) return;
    carregar(me);
    ligarAcoesRequerimento(document.getElementById('conteudo'), () => carregar(me));
  });
</script>
</body>
</html>
