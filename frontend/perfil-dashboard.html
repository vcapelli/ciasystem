<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-base text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-base p-4 overflow-y-auto"></aside>

  <main class="ml-60 max-w-6xl px-4 py-8">
      <div id="conteudo">
        <p class="text-sm text-muted">Carregando…</p>
      </div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/layout.js"></script>
<script>
  const partes = location.pathname.split('/').filter(Boolean); // ['perfil', nick, aba?]
  const nickAlvo = decodeURIComponent(partes[1] || '');
  const aba = partes[2] || 'linha-do-tempo';

  const BADGE_STATUS = {
    ativo: 'bg-green-500/15 text-green-400',
    licenca: 'bg-accent/15 text-accent',
    reformado: 'bg-white/10 text-muted',
    desligado_honroso: 'bg-white/10 text-muted',
    desligado_desonroso: 'bg-red-500/15 text-red-400',
    exonerado: 'bg-red-500/15 text-red-400',
  };

  const ICONE_TIPO = {
    instrucao_inicial: '🎓', promocao: '↑', rebaixamento: '↓', advertencia: '⚠',
    licenca: '⏸', volta_licenca: '▶', reserva: '💤', transferencia_conta: '⇄',
    transferencia_corpo: '⇄', venda_cargo: '💰', contratacao: '➕', tag: '🏷',
    turno_tarefa: '🕒', reforma: '🎖', desligado_honroso: '🚪', desligamento_honroso: '🚪',
    desligamento_desonroso: '🚪', exoneracao: '⛔', bonificacao: '⭐', cancelamento: '✖',
  };

  const COR_STATUS = {
    pendente: { anel: 'ring-gray-400/40', bg: 'bg-gray-500/20', texto: 'text-gray-300' },
    aprovado: { anel: 'ring-green-400/40', bg: 'bg-green-500/20', texto: 'text-green-400' },
    reprovado: { anel: 'ring-red-400/40', bg: 'bg-red-500/20', texto: 'text-red-400' },
    cancelado: { anel: 'ring-red-400/40', bg: 'bg-red-500/20', texto: 'text-red-400' },
  };

  function formatarDataCurta(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return `${String(d.getDate()).padStart(2,'0')} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
  }

  const PREFIXO_IDENTIFICACAO = {
    promocao: '', rebaixamento: 'R/',
    // outros tipos entram aqui conforme forem confirmados nos moldes oficiais
  };

  function montarIdentificacao(nick, tipo, autorTag, data) {
    const prefixo = PREFIXO_IDENTIFICACAO[tipo] ?? '';
    return `${nick} [${prefixo}${autorTag || '—'}] ${formatarDataCurta(data)}`;
  }

  function tituloTipo(tipo) {
    return tipo.replace(/_/g, ' ').replace(/\b\w/g, (l) => l.toUpperCase());
  }

  function renderDistincoes(titulo, lista) {
    if (!lista.length) return '';
    return `
      <div class="mt-3">
        <p class="text-xs uppercase tracking-wide text-muted mb-2">${titulo}</p>
        <div class="flex flex-wrap gap-2">
          ${lista.map((d) => `
            <span title="${d.descricao || ''}" class="flex items-center gap-1.5 bg-base border border-border rounded-full pl-1 pr-3 py-1 text-xs">
              <img src="${d.imagem_url}" class="h-5 w-5 rounded-full object-cover" onerror="this.style.display='none'">
              ${d.titulo}
            </span>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderAbas(nick) {
    const abas = [
      { id: 'linha-do-tempo', label: 'Linha do tempo', href: `/perfil/${nick}` },
      { id: 'postagens', label: 'Postagens', href: `/perfil/${nick}/postagens` },
    ];
    return `
      <div class="flex gap-6 border-b border-border mb-4">
        ${abas.map((a) => `
          <a href="${a.href}" class="pb-3 text-sm font-semibold border-b-2 transition-colors ${aba === a.id ? 'border-accent text-dark' : 'border-transparent text-muted hover:text-dark'}">
            ${a.label}
          </a>
        `).join('')}
      </div>
    `;
  }

  function renderTimeline(itens) {
    if (!itens.length) return '<p class="text-sm text-muted">Nenhum requerimento registrado ainda.</p>';
    return `
      <div class="space-y-4">
        ${itens.map((item) => {
          const cor = COR_STATUS[item.status] || COR_STATUS.pendente;
          const icone = ICONE_TIPO[item.tipo] || '📄';
          return `
            <div class="flex gap-3">
              <div class="flex flex-col items-center">
                <span class="h-9 w-9 rounded-full ${cor.bg} ring-2 ${cor.anel} flex items-center justify-center text-sm shrink-0">${icone}</span>
                <span class="flex-1 w-px bg-border mt-1"></span>
              </div>
              <div class="bg-card border border-border rounded-xl px-4 py-3 flex-1 mb-1 shadow-sm">
                <div class="flex items-center justify-between gap-2">
                  <p class="text-sm font-semibold">${tituloTipo(item.tipo)}</p>
                  <span class="text-xs font-semibold ${cor.texto} capitalize">${item.status}</span>
                </div>
                <p class="text-xs text-muted mt-0.5">${item.tag_requerimento} · ${formatarDataCurta(item.criado_em)}</p>
                ${item.motivo_recusa ? `<p class="text-xs text-red-400 mt-1">${item.motivo_recusa}</p>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderPostagens(tweets) {
    if (!tweets.length) return '<p class="text-sm text-muted">Nenhuma publicação ainda.</p>';
    return `
      <div class="space-y-3">
        ${tweets.map((t) => `
          <div class="bg-card border border-border rounded-2xl p-4 shadow-sm">
            <p class="text-sm whitespace-pre-wrap">${t.conteudo || ''}</p>
            <p class="text-xs text-muted mt-2">${new Date(t.criado_em).toLocaleString('pt-BR')}</p>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function carregar(me) {
    const container = document.getElementById('conteudo');
    const respPerfil = await apiFetch(`/usuarios/nick/${encodeURIComponent(nickAlvo)}`);

    if (!respPerfil.ok) {
      container.innerHTML = '<p class="text-sm text-red-400">Usuário não encontrado.</p>';
      return;
    }

    const perfil = await respPerfil.json();
    const ehMeuPerfil = me.nick === perfil.nick;

    const [emblemasResp, honrariasResp, conquistasResp, gruposResp, requerimentosResp, tweetsResp] = await Promise.all([
      apiFetch(`/emblemas/usuario/${perfil.id}`),
      apiFetch(`/honrarias/usuario/${perfil.id}`),
      apiFetch(`/conquistas/usuario/${perfil.id}`),
      apiFetch(`/grupos/usuario/${perfil.id}`),
      apiFetch(`/requerimentos/alvo/${perfil.id}`),
      apiFetch(`/tweets?autor_id=${perfil.id}`),
    ]);
    const emblemas = emblemasResp.ok ? await emblemasResp.json() : [];
    const honrarias = honrariasResp.ok ? await honrariasResp.json() : [];
    const conquistas = conquistasResp.ok ? await conquistasResp.json() : [];
    const grupos = gruposResp.ok ? await gruposResp.json() : [];
    const requerimentos = requerimentosResp.ok ? await requerimentosResp.json() : [];
    const tweets = tweetsResp.ok ? await tweetsResp.json() : [];

    const ultimoRequerimento = requerimentos[0]?.criado_em;
    const avatarCirculo = perfil.figure ? avatarUrl(perfil.figure, 'mini', '2') : null;
    const avatarGrande = perfil.figure ? avatarUrl(perfil.figure, 'grande', '2') : null;

    container.innerHTML = `
      <div class="relative mb-16">
        <div class="perfil-banner h-44 rounded-2xl overflow-hidden"></div>
        <div class="absolute left-6 -bottom-14 h-28 w-28 rounded-full ring-4 ring-base bg-border overflow-hidden">
          ${avatarCirculo
            ? `<img src="${avatarCirculo}" class="absolute inset-0 w-full h-full object-cover object-center" alt="">`
            : `<div class="w-full h-full flex items-center justify-center text-2xl font-bold">${perfil.nick.slice(0,2).toUpperCase()}</div>`}
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6">
        <div>
          <div class="bg-card border border-border rounded-2xl p-5 shadow-sm">
            ${avatarGrande ? `
              <div class="flex justify-center mb-4">
                <img src="${avatarGrande}" class="max-h-64 object-contain" alt="Avatar de ${perfil.nick}">
              </div>
            ` : ''}

            <h1 class="text-xl font-display font-bold">${perfil.nick}${perfil.tag ? ` <span class="text-muted font-normal text-base">[${perfil.tag}]</span>` : ''}</h1>
            <p class="text-xs text-muted mt-1">${requerimentos[0] ? montarIdentificacao(perfil.nick, requerimentos[0].tipo, requerimentos[0].autor_tag, requerimentos[0].criado_em) : `${perfil.nick}${perfil.tag ? ` [${perfil.tag}]` : ''}`}</p>
            <p class="text-xs text-muted mt-0.5">Último requerimento: ${formatarDataCurta(ultimoRequerimento)}</p>

            <div class="mt-2">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full capitalize ${BADGE_STATUS[perfil.status] || 'bg-white/10 text-white'}">
                ${(perfil.status || '').replace(/_/g, ' ')}
              </span>
            </div>

            <p class="text-sm mt-2">${perfil.patente_nome || 'Conta institucional'}${perfil.corpo ? ` · ${perfil.corpo === 'militar' ? 'Corpo Militar' : 'Corpo Executivo'}` : ''}</p>

            ${grupos.length ? `
              <div class="mt-4">
                <p class="text-xs uppercase tracking-wide text-muted mb-2">Grupos</p>
                <div class="flex flex-wrap gap-2">
                  ${grupos.map((g) => `
                    <span title="${g.nome} · ${g.nivel_nome}" class="h-9 w-9 rounded-xl bg-base border border-border flex items-center justify-center text-xs font-bold">
                      ${g.codigo}
                    </span>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <div id="bio-area" class="mt-4"></div>
          </div>

          <div class="bg-card border border-border rounded-2xl p-4 mt-4 shadow-sm">
            <p class="text-xs uppercase tracking-wide text-muted mb-1">Distinções</p>
            ${renderDistincoes('Emblemas', emblemas)}
            ${renderDistincoes('Honrarias', honrarias)}
            ${renderDistincoes('Conquistas', conquistas)}
            ${!emblemas.length && !honrarias.length && !conquistas.length ? '<p class="text-sm text-muted mt-1">Nenhuma distinção ainda.</p>' : ''}
          </div>
        </div>

        <div>
          ${renderAbas(perfil.nick)}
          ${aba === 'postagens' ? renderPostagens(tweets) : renderTimeline(requerimentos)}
        </div>
      </div>
    `;

    const bioArea = document.getElementById('bio-area');
    if (ehMeuPerfil) {
      bioArea.innerHTML = `
        <textarea id="bio-textarea" rows="3" maxlength="500" placeholder="Escreva algo sobre você…"
          class="w-full bg-card border border-border rounded-xl px-3 py-2 text-sm text-dark placeholder:text-muted/60 focus:outline-none focus:ring-2 focus:ring-accent">${perfil.biografia || ''}</textarea>
        <div class="flex justify-end mt-1.5">
          <button id="btn-salvar-bio" class="text-xs bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-3 py-1.5 transition-colors">Salvar</button>
        </div>
      `;
      document.getElementById('btn-salvar-bio').addEventListener('click', async () => {
        const biografia = document.getElementById('bio-textarea').value.trim();
        await apiFetch('/usuarios/me', { method: 'PATCH', body: JSON.stringify({ biografia }) });
      });
    } else {
      bioArea.innerHTML = perfil.biografia
        ? `<p class="text-sm text-muted whitespace-pre-wrap">${perfil.biografia}</p>`
        : '';
    }
  }

  montarLayout('/perfil').then((me) => { if (me) carregar(me); });
</script>
</body>
</html>
