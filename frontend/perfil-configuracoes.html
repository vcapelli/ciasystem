<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Configurações do Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 max-w-3xl px-6 py-8">
    <a href="/perfil-dashboard.html" id="link-voltar" class="text-xs text-muted hover:text-dark transition-colors">← Voltar pro perfil</a>
    <h1 class="text-xl font-display font-bold mt-2 mb-4">Configurações do perfil</h1>

    <div id="conteudo">
      <p class="text-sm text-muted">Carregando…</p>
    </div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/layout.js"></script>
<script>
  function renderThumbBanner(banner, selecionado) {
    return `
      <button type="button" data-banner-id="${banner.id}"
        class="thumb-banner relative h-20 rounded-xl overflow-hidden border-2 transition-colors ${selecionado ? 'border-accent' : 'border-transparent'}"
        style="background-image: url('${banner.imagem_url}'); background-size: cover; background-position: center;">
        ${selecionado ? '<span class="absolute top-1 right-1 h-5 w-5 rounded-full bg-accent text-white flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></span>' : ''}
      </button>
    `;
  }

  async function carregar(me) {
    const container = document.getElementById('conteudo');
    document.getElementById('link-voltar').href = `/perfil/${me.nick}`;

    const [meResp, bannersResp] = await Promise.all([
      apiFetch('/usuarios/me'),
      apiFetch('/banners-perfil'),
    ]);
    const dados = meResp.ok ? await meResp.json() : me;
    const banners = bannersResp.ok ? await bannersResp.json() : [];

    let bannerSelecionadoId = dados.banner_perfil_id || null;
    let corSelecionada = dados.cor_avatar_fundo || null;

    function renderPagina() {
      container.innerHTML = `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-4">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Banner do perfil</h2>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <button type="button" data-banner-id="" class="thumb-banner relative h-20 rounded-xl overflow-hidden border-2 flex items-center justify-center text-xs text-muted bg-base ${!bannerSelecionadoId ? 'border-accent' : 'border-transparent'}">
              Padrão do sistema
              ${!bannerSelecionadoId ? '<span class="absolute top-1 right-1 h-5 w-5 rounded-full bg-accent text-white flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></span>' : ''}
            </button>
            ${banners.map((b) => renderThumbBanner(b, bannerSelecionadoId === b.id)).join('')}
          </div>
          ${!banners.length ? '<p class="text-xs text-muted mt-2">Nenhum banner extra cadastrado ainda — fala com um administrador do sistema.</p>' : ''}
        </div>

        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-4">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Cor de fundo do avatar</h2>
          <div class="flex items-center gap-3">
            <input id="cor-avatar" type="color" value="${corSelecionada || '#e2e4e9'}" class="h-10 w-16 bg-base border border-border rounded-lg cursor-pointer">
            <button type="button" id="btn-cor-padrao" class="text-xs text-muted hover:text-dark transition-colors underline">Usar padrão</button>
          </div>
        </div>

        <button id="btn-salvar" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-5 py-2.5 text-sm transition-colors">
          Salvar
        </button>
        <p id="msg-salvar" class="hidden text-xs mt-2"></p>

        ${me.administrador_sistema ? `
          <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-8">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Administração — banners disponíveis</h2>
            <div class="space-y-2 mb-4">
              ${banners.length ? banners.map((b) => `
                <div class="flex items-center gap-3 bg-base border border-border rounded-xl p-2">
                  <div class="h-12 w-20 rounded-lg bg-cover bg-center shrink-0" style="background-image: url('${b.imagem_url}')"></div>
                  <p class="text-sm flex-1 truncate">${b.nome || b.imagem_url}</p>
                  <button type="button" data-remover-id="${b.id}" class="btn-remover-banner text-muted hover:text-red-600 transition-colors px-2">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              `).join('') : '<p class="text-sm text-muted">Nenhum banner cadastrado ainda.</p>'}
            </div>
            <form id="form-novo-banner" class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2">
              <input id="novo-banner-url" placeholder="URL da imagem" required class="bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <input id="novo-banner-nome" placeholder="Nome (opcional)" class="bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Adicionar</button>
            </form>
          </div>
        ` : ''}
      `;

      container.querySelectorAll('.thumb-banner').forEach((btn) => {
        btn.addEventListener('click', () => {
          bannerSelecionadoId = btn.dataset.bannerId ? Number(btn.dataset.bannerId) : null;
          renderPagina();
        });
      });

      document.getElementById('cor-avatar').addEventListener('input', (e) => { corSelecionada = e.target.value; });
      document.getElementById('btn-cor-padrao').addEventListener('click', () => {
        corSelecionada = null;
        document.getElementById('cor-avatar').value = '#e2e4e9';
      });

      document.getElementById('btn-salvar').addEventListener('click', async () => {
        const msg = document.getElementById('msg-salvar');
        const resp = await apiFetch('/usuarios/me', {
          method: 'PATCH',
          body: JSON.stringify({ banner_perfil_id: bannerSelecionadoId, cor_avatar_fundo: corSelecionada }),
        });
        msg.classList.remove('hidden');
        if (resp.ok) {
          msg.textContent = 'Salvo!';
          msg.className = 'text-xs mt-2 text-green-600';
        } else {
          const d = await resp.json().catch(() => ({}));
          msg.textContent = d.erro || 'Não foi possível salvar.';
          msg.className = 'text-xs mt-2 text-red-500';
        }
      });

      const formNovoBanner = document.getElementById('form-novo-banner');
      if (formNovoBanner) {
        formNovoBanner.addEventListener('submit', async (e) => {
          e.preventDefault();
          const resp = await apiFetch('/banners-perfil', {
            method: 'POST',
            body: JSON.stringify({
              imagem_url: document.getElementById('novo-banner-url').value.trim(),
              nome: document.getElementById('novo-banner-nome').value.trim() || undefined,
            }),
          });
          if (resp.ok) {
            const nova = await apiFetch('/banners-perfil');
            banners.length = 0;
            banners.push(...(nova.ok ? await nova.json() : []));
            renderPagina();
          }
        });

        container.querySelectorAll('.btn-remover-banner').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm('Remover esse banner da lista?')) return;
            await apiFetch(`/banners-perfil/${btn.dataset.removerId}`, { method: 'DELETE' });
            const idx = banners.findIndex((b) => String(b.id) === btn.dataset.removerId);
            if (idx >= 0) banners.splice(idx, 1);
            if (bannerSelecionadoId === Number(btn.dataset.removerId)) bannerSelecionadoId = null;
            renderPagina();
          });
        });
      }
    }

    renderPagina();
  }

  montarLayout('/perfil-configuracoes.html').then((me) => { if (me) carregar(me); });
</script>
</body>
</html>
