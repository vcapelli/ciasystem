<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Listagem de Convidados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
  <div class="flex-1 min-w-0 px-6 pt-8">
    <div class="flex items-center justify-between mb-1">
      <h1 class="text-xl font-display font-bold">Listagem de Convidados</h1>
      <a href="/requerimentos/convidado.html" class="text-sm font-semibold text-accent hover:underline">
        <i class="fa-solid fa-plus"></i> Incluir/Excluir convidado
      </a>
    </div>
    <p class="text-sm text-muted mb-4">Não fazem parte da hierarquia — sem patente, sem "dias no posto"/"dias na polícia". Quem for excluído some daqui automaticamente.</p>

    <div id="lista-convidados" class="bg-card border border-border rounded-2xl divide-y divide-border overflow-hidden shadow-sm">
      <p class="text-sm text-muted p-4">Carregando…</p>
    </div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/layout.js"></script>
<script>
  const MESES_CURTOS_CONVIDADOS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  function formatarDataCurtaConvidado(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return `${String(d.getDate()).padStart(2, '0')} ${MESES_CURTOS_CONVIDADOS[d.getMonth()]} ${d.getFullYear()}`;
  }

  montarLayout('/listagem-convidados.html').then(async (me) => {
    if (!me) return;

    const raiz = document.getElementById('lista-convidados');
    const resp = await apiFetch('/usuarios/convidados');
    if (!resp.ok) { raiz.innerHTML = '<p class="text-sm text-red-400 p-4">Erro ao carregar.</p>'; return; }

    const lista = await resp.json();
    raiz.innerHTML = lista.length ? lista.map((u) => `
      <a href="/perfil/${encodeURIComponent(u.nick)}" class="flex items-center justify-between px-4 py-3 hover:bg-basebg transition-colors">
        <div>
          <p class="text-sm font-semibold">${escapeHtml(u.nick)}${u.tag ? ` [${escapeHtml(u.tag)}]` : ''}</p>
          <p class="text-xs text-muted">Convidado desde ${formatarDataCurtaConvidado(u.data_ingresso)}</p>
        </div>
        <i class="fa-solid fa-chevron-right text-muted text-xs"></i>
      </a>
    `).join('') : '<p class="text-sm text-muted p-4">Nenhum convidado ativo no momento.</p>';
  });
</script>
</body>
</html>
