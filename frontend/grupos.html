<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Grupos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-base text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-base p-4 overflow-y-auto"></aside>

  <main class="ml-60 max-w-6xl px-4 py-8">
    <h1 class="text-xl font-display font-bold mb-4">Grupos</h1>

    <div id="lista">
      <p class="text-sm text-muted">Carregando…</p>
    </div>

    <div id="form-criar-wrap"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/layout.js"></script>
<script>
  const TIPO_LABEL = {
    companhia: 'Companhias',
    subcompanhia: 'Subcompanhias',
    orgao_topo: 'Órgãos de Topo',
    setor_inteligencia: 'Setor de Inteligência',
  };

  function renderGrupo(g) {
    const corEstilo = g.cor ? `style="border-left: 4px solid ${g.cor}"` : '';
    return `
      <a href="/grupos/${g.slug}" ${corEstilo} class="flex items-center justify-between bg-base border border-border rounded-xl px-4 py-3 hover:border-accent transition-colors">
        <div class="flex items-center gap-3">
          <span class="h-10 w-10 rounded-xl bg-card border border-border flex items-center justify-center text-xs font-bold overflow-hidden">
            ${g.imagem_url ? `<img src="${g.imagem_url}" class="w-full h-full object-cover" alt="">` : g.codigo}
          </span>
          <div>
            <p class="text-sm font-semibold">${g.nome}</p>
            <p class="text-xs text-muted">${g.total_membros} membro${g.total_membros === 1 ? '' : 's'}</p>
          </div>
        </div>
        <span class="text-muted">→</span>
      </a>
    `;
  }

  function renderFormCriar() {
    return `
      <div class="bg-card border border-border rounded-2xl p-5 mt-6">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Criar grupo</h2>
        <form id="form-criar" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input id="g-codigo" required maxlength="10" placeholder="Código (ex: APM)"
            class="bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <input id="g-nome" required placeholder="Nome completo"
            class="bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <input id="g-slug" required placeholder="slug (ex: apm)"
            class="bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <select id="g-tipo" class="bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <option value="companhia">Companhia</option>
            <option value="subcompanhia">Subcompanhia</option>
            <option value="orgao_topo">Órgão de Topo</option>
            <option value="setor_inteligencia">Setor de Inteligência</option>
          </select>
          <input id="g-imagem" placeholder="URL da imagem/logo (opcional)"
            class="bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <label class="flex items-center gap-2 text-sm">
            Cor <input id="g-cor" type="color" value="#046b2f" class="h-9 w-14 bg-base border border-border rounded-lg cursor-pointer">
          </label>
          <label class="flex items-center gap-2 text-sm sm:col-span-2">
            <input id="g-aulas" type="checkbox"> Permite aulas
          </label>
          <button type="submit" class="sm:col-span-2 bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">
            Criar
          </button>
        </form>
        <p id="form-criar-erro" class="hidden text-xs text-red-400 mt-2"></p>
      </div>
    `;
  }

  async function carregar() {
    const resposta = await apiFetch('/grupos');
    const lista = document.getElementById('lista');
    if (!resposta.ok) {
      lista.innerHTML = '<p class="text-sm text-red-400">Não foi possível carregar os grupos.</p>';
      return;
    }

    const grupos = await resposta.json();
    if (!grupos.length) {
      lista.innerHTML = '<p class="text-sm text-muted">Nenhum grupo cadastrado ainda.</p>';
      return;
    }

    const porTipo = {};
    for (const g of grupos) {
      (porTipo[g.tipo] ||= []).push(g);
    }

    lista.innerHTML = Object.entries(porTipo).map(([tipo, itens]) => `
      <div class="bg-card border border-border rounded-2xl p-5 mb-4">
        <p class="text-xs uppercase tracking-wide text-muted mb-3">${TIPO_LABEL[tipo] || tipo}</p>
        <div class="space-y-2">${itens.map(renderGrupo).join('')}</div>
      </div>
    `).join('');
  }

  montarLayout('/grupos.html').then((me) => {
    if (!me) return;
    carregar();

    if (me.administrador_sistema) {
      document.getElementById('form-criar-wrap').innerHTML = renderFormCriar();
      document.getElementById('form-criar').addEventListener('submit', async (e) => {
        e.preventDefault();
        const erroEl = document.getElementById('form-criar-erro');
        erroEl.classList.add('hidden');

        const resposta = await apiFetch('/grupos', {
          method: 'POST',
          body: JSON.stringify({
            codigo: document.getElementById('g-codigo').value.trim(),
            nome: document.getElementById('g-nome').value.trim(),
            slug: document.getElementById('g-slug').value.trim(),
            tipo: document.getElementById('g-tipo').value,
            permite_aulas: document.getElementById('g-aulas').checked,
            imagem_url: document.getElementById('g-imagem').value.trim() || undefined,
            cor: document.getElementById('g-cor').value,
          }),
        });

        if (!resposta.ok) {
          const dados = await resposta.json();
          erroEl.textContent = dados.erro || 'Não foi possível criar o grupo.';
          erroEl.classList.remove('hidden');
          return;
        }

        document.getElementById('form-criar').reset();
        carregar();
      });
    }
  });
</script>
</body>
</html>
