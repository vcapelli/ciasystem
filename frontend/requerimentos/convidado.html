<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Convidado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
  <div class="flex-1 min-w-0 px-6 pt-8 max-w-2xl">
    <h1 class="text-xl font-display font-bold mb-1">Convidado</h1>
    <p class="text-sm text-muted mb-4">Convidados não fazem parte da hierarquia — sem patente, sem corpo, sem "dias no posto"/"dias na polícia". Qualquer membro pode incluir ou excluir um convidado.</p>

    <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-5">
      <div class="flex gap-2 mb-4">
        <button type="button" id="btn-acao-inclusao" class="flex-1 text-sm font-semibold rounded-lg px-4 py-2 transition-colors bg-accent text-white">Incluir convidado</button>
        <button type="button" id="btn-acao-exclusao" class="flex-1 text-sm font-semibold rounded-lg px-4 py-2 transition-colors bg-basebg border border-border text-muted hover:text-dark">Excluir convidado</button>
      </div>

      <form id="form-convidado" class="space-y-3">
        <div id="campo-inclusao">
          <label class="block text-xs text-muted mb-1">Nick do convidado (Habblet)</label>
          <input id="convidado-nick" placeholder="Nick" autocomplete="off" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
        </div>

        <div id="campo-exclusao" class="hidden relative">
          <label class="block text-xs text-muted mb-1">Buscar convidado</label>
          <input id="convidado-busca" placeholder="Buscar por nick…" autocomplete="off" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <div id="convidado-sugestoes" class="hidden absolute z-10 mt-1 w-full bg-card border border-border rounded-lg shadow-md max-h-48 overflow-y-auto"></div>
          <p id="convidado-selecionado" class="text-xs text-muted mt-1"></p>
        </div>

        <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Enviar</button>
        <p id="convidado-erro" class="hidden text-xs text-red-500"></p>
        <p id="convidado-sucesso" class="hidden text-xs text-green-600"></p>
      </form>
    </div>

    <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-2">Recentes</h2>
    <div id="req-recentes" class="space-y-3 pb-8">
      <p class="text-sm text-muted">Carregando…</p>
    </div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/requerimentos.js"></script>
<script>
  montarLayout('/requerimentos/convidado.html').then(async (me) => {
    if (!me) return;

    let acaoAtual = 'inclusao';
    let alvoSelecionadoId = null;

    const btnInclusao = document.getElementById('btn-acao-inclusao');
    const btnExclusao = document.getElementById('btn-acao-exclusao');
    const campoInclusao = document.getElementById('campo-inclusao');
    const campoExclusao = document.getElementById('campo-exclusao');

    function atualizarBotoesAcao() {
      const ativo = 'bg-accent text-white';
      const inativo = 'bg-basebg border border-border text-muted hover:text-dark';
      btnInclusao.className = `flex-1 text-sm font-semibold rounded-lg px-4 py-2 transition-colors ${acaoAtual === 'inclusao' ? ativo : inativo}`;
      btnExclusao.className = `flex-1 text-sm font-semibold rounded-lg px-4 py-2 transition-colors ${acaoAtual === 'exclusao' ? ativo : inativo}`;
      campoInclusao.classList.toggle('hidden', acaoAtual !== 'inclusao');
      campoExclusao.classList.toggle('hidden', acaoAtual !== 'exclusao');
    }

    btnInclusao.addEventListener('click', () => { acaoAtual = 'inclusao'; alvoSelecionadoId = null; atualizarBotoesAcao(); });
    btnExclusao.addEventListener('click', () => { acaoAtual = 'exclusao'; alvoSelecionadoId = null; atualizarBotoesAcao(); });

    // Busca de convidado pra excluir — só entre quem já é convidado
    // ativo (apenas_convidados=1), pra não deixar mirar um membro comum
    // por engano.
    const inputBusca = document.getElementById('convidado-busca');
    const sugestoesEl = document.getElementById('convidado-sugestoes');
    const selecionadoEl = document.getElementById('convidado-selecionado');
    let debounce;
    inputBusca.addEventListener('input', () => {
      clearTimeout(debounce);
      alvoSelecionadoId = null;
      selecionadoEl.textContent = '';
      const termo = inputBusca.value.trim();
      if (termo.length < 2) { sugestoesEl.classList.add('hidden'); return; }
      debounce = setTimeout(async () => {
        const r = await apiFetch(`/usuarios?busca=${encodeURIComponent(termo)}&apenas_convidados=1`);
        const lista = r.ok ? await r.json() : [];
        sugestoesEl.innerHTML = lista.length
          ? lista.map((u) => `<button type="button" data-id="${u.id}" data-nick="${escapeHtml(u.nick)}" class="w-full text-left px-3 py-2 text-sm hover:bg-basebg transition-colors">${escapeHtml(u.nick)}</button>`).join('')
          : '<p class="px-3 py-2 text-sm text-muted">Nenhum convidado ativo encontrado.</p>';
        sugestoesEl.classList.remove('hidden');
      }, 250);
    });
    sugestoesEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      alvoSelecionadoId = Number(btn.dataset.id);
      inputBusca.value = btn.dataset.nick;
      selecionadoEl.textContent = `Selecionado: ${btn.dataset.nick}`;
      sugestoesEl.classList.add('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#convidado-sugestoes') && e.target !== inputBusca) sugestoesEl.classList.add('hidden');
    });

    document.getElementById('form-convidado').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('convidado-erro');
      const sucessoEl = document.getElementById('convidado-sucesso');
      erroEl.classList.add('hidden');
      sucessoEl.classList.add('hidden');

      let alvo;
      if (acaoAtual === 'inclusao') {
        alvo = document.getElementById('convidado-nick').value.trim();
        if (!alvo) { erroEl.textContent = 'Digite o nick do convidado.'; erroEl.classList.remove('hidden'); return; }
      } else {
        if (!alvoSelecionadoId) { erroEl.textContent = 'Selecione um convidado na busca.'; erroEl.classList.remove('hidden'); return; }
        alvo = alvoSelecionadoId;
      }

      const resp = await apiFetch('/requerimentos', {
        method: 'POST',
        body: JSON.stringify({
          tipo: 'convidado',
          alvos: [alvo],
          dados_especificos: { acao: acaoAtual },
        }),
      });

      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        erroEl.textContent = d.erro || 'Não foi possível enviar.';
        erroEl.classList.remove('hidden');
        return;
      }

      sucessoEl.textContent = acaoAtual === 'inclusao' ? 'Convidado incluído!' : 'Convidado excluído!';
      sucessoEl.classList.remove('hidden');
      document.getElementById('form-convidado').reset();
      alvoSelecionadoId = null;
      selecionadoEl.textContent = '';
      carregarRecentes();
    });

    atualizarBotoesAcao();

    const respTodasPatentes = await apiFetch('/patentes');
    const patentesMapa = {};
    if (respTodasPatentes.ok) {
      for (const p of await respTodasPatentes.json()) patentesMapa[p.id] = p.nome;
    }

    async function renderCardRecente(r) {
      const alvos = r.alvos_json ? JSON.parse(r.alvos_json) : [];
      const apendice = await buscarApendiceIdentificacao(alvos[0]?.usuario_id);
      return renderCardRequerimento(r, patentesMapa, me, apendice);
    }

    async function carregarRecentes() {
      const resp = await apiFetch('/requerimentos');
      const container = document.getElementById('req-recentes');
      if (!resp.ok) { container.innerHTML = '<p class="text-sm text-red-400">Erro ao carregar.</p>'; return; }

      const todos = await resp.json();
      const filtrados = todos.filter((r) => r.tipo === 'convidado').slice(0, 10);

      container.innerHTML = filtrados.length
        ? (await Promise.all(filtrados.map(renderCardRecente))).join('')
        : '<p class="text-sm text-muted">Nenhum requerimento deste tipo ainda.</p>';
    }
    carregarRecentes();

    ligarAcoesRequerimento(document.getElementById('req-recentes'), carregarRecentes);
  });
</script>
</body>
</html>
