<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Integração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
  <div class="flex-1 min-w-0 px-6 pt-8">
    <h1 class="text-xl font-display font-bold mb-1">Integração</h1>
    <p class="text-sm text-muted mb-4">Exclusivo de administradores do sistema — migra pro CIASystem alguém que já está na organização há tempo (fluxo manual antigo/planilha), definindo a TAG dele e a data real de ingresso, pra não perder o tempo de serviço já cumprido.</p>
    <div id="form-requerimento-raiz">
      <p class="text-sm text-muted">Carregando…</p>
    </div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/requerimentos.js"></script>
<script>
  montarLayout('/requerimentos/integracao.html').then((me) => {
    if (!me) return;
    if (!me.administrador_sistema) {
      window.location.href = '/erro/403.html?motivo=' + encodeURIComponent('Essa página é restrita a administradores do sistema.');
      return;
    }
    montarFormularioRequerimento({
      tipos: [{ value: 'integracao', label: 'Integração' }],
      alvoLivre: true,
      permiteAutoAlvo: true,
      filtrarPatentePorAutor: true,
      tiposComPatente: ['integracao'],
      tiposComTag: ['integracao'],
      tiposComDataIntegracao: ['integracao'],
    });
  });
</script>
</body>
</html>
