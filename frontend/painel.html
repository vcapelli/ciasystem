<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
        colors: {
          base: '#121218',
          card: '#1b1b24',
          border: '#2a2a36',
          muted: '#8f8fa3',
          amber: { DEFAULT: '#f2a93b', dark: '#d9932a' },
        },
        borderRadius: { '2xl': '1.25rem' },
      },
    },
  };
</script>
</head>
<body class="bg-base text-white font-sans min-h-screen">

  <nav class="sticky top-0 z-10 bg-card/90 backdrop-blur border-b border-border px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-8 w-8 rounded-lg bg-amber/20 flex items-center justify-center text-amber font-bold text-sm">CIA</div>
      <span class="font-semibold">CIASystem</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="nav-nick" class="text-sm text-muted"></span>
      <button id="btn-logout" class="text-sm text-muted hover:text-white transition-colors">Sair</button>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-xl font-bold mb-1">Requerimentos</h1>
    <p class="text-sm text-muted mb-6">Últimos requerimentos registrados no sistema.</p>

    <div id="lista" class="space-y-3">
      <p class="text-muted text-sm">Carregando…</p>
    </div>
  </main>

<script src="assets/api.js"></script>
<script>
  const BADGE_STATUS = {
    pendente: 'bg-amber/15 text-amber',
    aprovado: 'bg-green-500/15 text-green-400',
    reprovado: 'bg-red-500/15 text-red-400',
    cancelado: 'bg-red-500/15 text-red-400',
  };

  function formatarData(iso) {
    return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }

  async function carregar() {
    const resposta = await apiFetch('/requerimentos');
    if (!resposta.ok) {
      document.getElementById('lista').innerHTML =
        '<p class="text-sm text-red-400">Não foi possível carregar os requerimentos.</p>';
      return;
    }

    const requerimentos = await resposta.json();
    const lista = document.getElementById('lista');

    if (requerimentos.length === 0) {
      lista.innerHTML = '<p class="text-sm text-muted">Nenhum requerimento ainda.</p>';
      return;
    }

    lista.innerHTML = requerimentos.map((r) => `
      <div class="bg-card border border-border rounded-2xl p-5 relative overflow-hidden">
        <div class="absolute top-0 left-6 h-1 w-12 bg-amber rounded-b"></div>
        <div class="flex items-center justify-between">
          <div>
            <p class="font-semibold capitalize">${r.tipo.replace(/_/g, ' ')}</p>
            <p class="text-xs text-muted mt-0.5">${r.tag_requerimento} · ${formatarData(r.criado_em)}</p>
          </div>
          <span class="text-xs font-semibold px-3 py-1 rounded-full ${BADGE_STATUS[r.status] || 'bg-white/10 text-white'} capitalize">
            ${r.status}
          </span>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('btn-logout').addEventListener('click', () => Auth.logout());

  if (!Auth.estaLogado()) {
    window.location.href = 'index.html';
  } else {
    carregar();
  }
</script>
</body>
</html>
