<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 px-6 py-8">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-display font-bold">Documentos</h1>
      <button id="btn-novo-documento" class="hidden text-xs font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">
        <i class="fa-solid fa-plus"></i> Novo documento
      </button>
    </div>

    <div id="form-novo-documento" class="hidden bg-card border border-border rounded-2xl shadow-sm p-5 mb-5 max-w-xl"></div>

    <div id="lista-categorias" class="space-y-6">
      <p class="text-sm text-muted">Carregando…</p>
    </div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/editor-html.js"></script>
<script>
  const BADGE_STATUS_DOC = {
    vigente: 'bg-green-500/15 text-green-600', em_revisao: 'bg-accent/15 text-accent', arquivado: 'bg-white/10 text-muted',
  };

  async function carregar(me) {
    const [docsResp, categoriasResp, minhasPermResp] = await Promise.all([
      apiFetch('/documentos'), apiFetch('/documentos-categorias'), apiFetch('/documentos-permissoes/minhas'),
    ]);
    const documentosLista = docsResp.ok ? await docsResp.json() : [];
    const categorias = categoriasResp.ok ? await categoriasResp.json() : [];
    const minhasPermissoes = minhasPermResp.ok ? await minhasPermResp.json() : { pode_criar: false, pode_editar: false, pode_deletar: false };

    document.getElementById('btn-novo-documento').classList.toggle('hidden', !minhasPermissoes.pode_criar);

    const listaCategorias = document.getElementById('lista-categorias');
    listaCategorias.innerHTML = categorias.map((cat) => {
      const docsDaCategoria = documentosLista.filter((d) => d.categoria_id === cat.id);
      return `
        <div class="bg-card border border-border rounded-2xl shadow-sm overflow-hidden">
          <div class="h-24 bg-cover bg-center flex items-end p-4 ${!cat.banner_url ? 'bg-basebg' : ''}" ${cat.banner_url ? `style="background-image: url('${cat.banner_url}')"` : ''}>
            <p class="text-lg font-display font-bold ${cat.banner_url ? 'text-white drop-shadow' : 'text-dark'}">${cat.nome}</p>
          </div>
          <div class="divide-y divide-border">
            ${docsDaCategoria.length ? docsDaCategoria.map((d) => `
              <div class="flex items-center justify-between px-5 py-3 hover:bg-basebg transition-colors">
                <a href="/documentos/${d.slug}" class="flex-1">
                  <p class="text-sm font-semibold">${d.titulo}</p>
                  <p class="text-xs text-muted mt-0.5">revisão nº ${d.numero_revisao_atual}</p>
                </a>
                <div class="flex items-center gap-3">
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full capitalize ${BADGE_STATUS_DOC[d.status] || ''}">${d.status.replace(/_/g, ' ')}</span>
                  ${minhasPermissoes.pode_deletar ? `
                    <button data-excluir-documento="${d.id}" data-titulo="${d.titulo}" class="text-muted hover:text-red-600 transition-colors px-1">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  ` : ''}
                </div>
              </div>
            `).join('') : '<p class="text-sm text-muted px-5 py-3">Nenhum documento nessa categoria ainda.</p>'}
          </div>
        </div>
      `;
    }).join('') || '<p class="text-sm text-muted">Nenhuma categoria cadastrada — crie uma no painel de admin.</p>';

    listaCategorias.querySelectorAll('[data-excluir-documento]').forEach((btn) => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm(`Excluir "${btn.dataset.titulo}" definitivamente? Isso apaga todas as revisões e o histórico dele também. Essa ação não pode ser desfeita.`)) return;
        const resp = await apiFetch(`/documentos/${btn.dataset.excluirDocumento}`, { method: 'DELETE' });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          alert(d.erro || 'Não foi possível excluir.');
          return;
        }
        carregar(me);
      });
    });

    document.getElementById('btn-novo-documento').onclick = () => {
      const container = document.getElementById('form-novo-documento');
      const abrindo = container.classList.contains('hidden');
      container.classList.add('hidden');
      if (!abrindo) return;
      container.classList.remove('hidden');
      container.innerHTML = `
        <form class="space-y-3">
          <input data-campo="titulo" placeholder="Título" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <label class="block text-xs text-muted">URL do documento
            <div class="flex items-center mt-1">
              <span class="text-sm text-muted bg-basebg border border-r-0 border-border rounded-l-lg px-3 py-2">/documentos/</span>
              <input data-campo="slug" placeholder="constituicao-militar" required pattern="[a-z0-9]+(-[a-z0-9]+)*" class="flex-1 bg-basebg border border-border rounded-r-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            </div>
          </label>
          <select data-campo="categoria_id" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            ${categorias.map((c) => `<option value="${c.id}">${c.nome}</option>`).join('')}
          </select>
          <label class="block text-xs text-muted mb-1">Conteúdo inicial</label>
          ${htmlEditorHtml('editor-novo-doc', '')}
          <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Criar</button>
          <p data-erro class="hidden text-xs text-red-500"></p>
        </form>
      `;
      ligarEditorHtml('editor-novo-doc');
      container.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const resp = await apiFetch('/documentos', {
          method: 'POST',
          body: JSON.stringify({
            titulo: container.querySelector('[data-campo="titulo"]').value.trim(),
            slug: container.querySelector('[data-campo="slug"]').value.trim(),
            categoria_id: Number(container.querySelector('[data-campo="categoria_id"]').value),
            conteudo_atual: document.getElementById('editor-novo-doc-textarea').value,
          }),
        });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          const erroEl = container.querySelector('[data-erro]');
          erroEl.textContent = d.erro || 'Não foi possível criar.';
          erroEl.classList.remove('hidden');
          return;
        }
        const { slug } = await resp.json();
        window.location.href = `/documentos/${slug}`;
      });
    };
  }

  montarLayout('/documentos.html').then((me) => { if (me) carregar(me); });
</script>
</body>
</html>
