<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-base text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-base p-4 overflow-y-auto"></aside>

  <main class="ml-60 max-w-6xl px-4 py-8">
    <a href="/grupos.html" class="inline-flex items-center gap-1.5 bg-card border border-border rounded-full pl-2.5 pr-4 py-1.5 text-sm font-medium text-muted hover:text-dark hover:border-accent transition-colors shadow-sm">
      <span class="text-base leading-none">←</span> Grupos
    </a>
    <div id="conteudo" class="mt-2">
      <p class="text-sm text-muted">Carregando…</p>
    </div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/layout.js"></script>
<script>
  const partes = location.pathname.split('/').filter(Boolean); // ['grupos', slug, aba?]
  const slug = decodeURIComponent(partes[1] || '');
  const aba = partes[2] || 'membros';

  const TIPO_LABEL = {
    companhia: 'Companhia', subcompanhia: 'Subcompanhia',
    orgao_topo: 'Órgão de Topo', setor_inteligencia: 'Setor de Inteligência',
  };

  const TIPO_REGISTRO_LABEL = {
    admissao: 'Admissão', promocao: 'Promoção', rebaixamento: 'Rebaixamento', saida: 'Saída',
  };

  function renderAbas(ehAdmin) {
    const abas = [
      { id: 'membros', label: 'Membros', href: `/grupos/${slug}` },
      { id: 'noticias', label: 'Notícias', href: `/grupos/${slug}/noticias` },
      { id: 'registros', label: 'Requerimentos internos', href: `/grupos/${slug}/registros` },
    ];
    if (ehAdmin) abas.push({ id: 'configuracoes', label: 'Configurações', href: `/grupos/${slug}/configuracoes` });

    return `
      <div class="bg-card border border-border rounded-2xl shadow-sm px-5 pt-3 mb-4">
        <div class="flex gap-6 border-b border-border">
          ${abas.map((a) => `
            <a href="${a.href}" class="pb-3 text-sm font-semibold border-b-2 transition-colors ${aba === a.id ? 'border-accent text-dark' : 'border-transparent text-muted hover:text-dark'}">
              ${a.label}
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderMembro(m) {
    const avatar = m.figure ? avatarUrl(m.figure, 'mini') : null;
    return `
      <a href="/perfil/${m.nick}" class="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-base transition-colors">
        <div class="flex items-center gap-3">
          <span class="h-9 w-9 rounded-full bg-border overflow-hidden inline-block shrink-0">
            ${avatar ? `<img src="${avatar}" class="w-full h-[190%] object-cover object-top" alt="">` : `<span class="w-full h-full flex items-center justify-center text-xs font-semibold">${m.nick.slice(0,2).toUpperCase()}</span>`}
          </span>
          <span class="text-sm font-medium">${m.nick}${m.tag ? ` <span class="text-muted font-normal">[${m.tag}]</span>` : ''}</span>
        </div>
        <span class="text-xs text-muted">${m.nivel}${m.administrador_grupo ? ' · Admin' : ''}</span>
      </a>
    `;
  }

  function renderNoticias(noticias) {
    if (!noticias.length) return '<p class="text-sm text-muted">Nenhuma notícia publicada ainda.</p>';
    return `
      <div class="space-y-3">
        ${noticias.map((n) => `
          <div class="bg-card border border-border rounded-xl p-4 shadow-sm">
            <p class="text-sm font-semibold">${n.titulo}</p>
            <p class="text-sm text-muted mt-1 whitespace-pre-wrap">${n.conteudo}</p>
            <p class="text-xs text-muted mt-2">${new Date(n.publicado_em || n.criado_em).toLocaleDateString('pt-BR')}</p>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderRegistros(registros) {
    if (!registros.length) return '<p class="text-sm text-muted">Nenhum registro interno ainda.</p>';
    return `
      <div class="space-y-2">
        ${registros.map((r) => `
          <div class="bg-card border border-border rounded-xl px-4 py-3 shadow-sm">
            <div class="flex items-center justify-between">
              <p class="text-sm font-semibold">${TIPO_REGISTRO_LABEL[r.tipo] || r.tipo} — ${r.usuario_nick}</p>
              <p class="text-xs text-muted">${new Date(r.criado_em).toLocaleDateString('pt-BR')}</p>
            </div>
            ${r.nivel_anterior_nome || r.nivel_novo_nome ? `<p class="text-xs text-muted mt-1">${r.nivel_anterior_nome || '—'} → ${r.nivel_novo_nome || '—'}</p>` : ''}
            ${r.motivo ? `<p class="text-xs text-muted mt-1">${r.motivo}</p>` : ''}
            ${r.registrado_por_nick ? `<p class="text-xs text-muted/70 mt-1">Registrado por ${r.registrado_por_nick}</p>` : ''}
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderConfiguracoes(grupo) {
    return `
      <form id="form-config" class="bg-card border border-border rounded-2xl p-5 space-y-3 max-w-lg shadow-sm">
        <div>
          <label class="block text-xs text-muted mb-1">Nome</label>
          <input id="gc-nome" value="${grupo.nome}" class="w-full bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
        </div>
        <div>
          <label class="block text-xs text-muted mb-1">Tipo</label>
          <select id="gc-tipo" class="w-full bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <option value="companhia" ${grupo.tipo === 'companhia' ? 'selected' : ''}>Companhia</option>
            <option value="subcompanhia" ${grupo.tipo === 'subcompanhia' ? 'selected' : ''}>Subcompanhia</option>
            <option value="orgao_topo" ${grupo.tipo === 'orgao_topo' ? 'selected' : ''}>Órgão de Topo</option>
            <option value="setor_inteligencia" ${grupo.tipo === 'setor_inteligencia' ? 'selected' : ''}>Setor de Inteligência</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-muted mb-1">URL da imagem/logo</label>
          <input id="gc-imagem" value="${grupo.imagem_url || ''}" placeholder="https://…" class="w-full bg-base border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
        </div>
        <div class="flex items-center gap-3">
          <label class="text-xs text-muted">Cor</label>
          <input id="gc-cor" type="color" value="${grupo.cor || '#046b2f'}" class="h-9 w-14 bg-base border border-border rounded-lg cursor-pointer">
        </div>
        <label class="flex items-center gap-2 text-sm">
          <input id="gc-aulas" type="checkbox" ${grupo.permite_aulas ? 'checked' : ''}> Permite aulas
        </label>
        <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Salvar</button>
        <p id="form-config-erro" class="hidden text-xs text-red-400"></p>
      </form>
    `;
  }

  async function carregar(me) {
    const container = document.getElementById('conteudo');

    const grupoResp = await apiFetch(`/grupos/${encodeURIComponent(slug)}`);
    if (!grupoResp.ok) {
      container.innerHTML = '<p class="text-sm text-red-400">Grupo não encontrado.</p>';
      return;
    }
    const grupo = await grupoResp.json();
    const souAdmin = Boolean(me.administrador_sistema);

    let conteudoAba = '<p class="text-sm text-muted">Carregando…</p>';
    if (aba === 'membros') {
      const r = await apiFetch(`/grupos/${slug}/membros`);
      conteudoAba = r.ok ? (await r.json()).map(renderMembro).join('') || '<p class="text-sm text-muted">Nenhum membro ainda.</p>' : '<p class="text-sm text-red-400">Erro ao carregar membros.</p>';
      conteudoAba = `<div class="bg-card border border-border rounded-2xl divide-y divide-border overflow-hidden shadow-sm">${conteudoAba}</div>`;
    } else if (aba === 'noticias') {
      const r = await apiFetch(`/grupos/${slug}/noticias`);
      const noticias = r.ok ? (await r.json()).filter((n) => n.status === 'publicada') : [];
      conteudoAba = renderNoticias(noticias);
    } else if (aba === 'registros') {
      const r = await apiFetch(`/grupos/${slug}/registros`);
      conteudoAba = renderRegistros(r.ok ? await r.json() : []);
    } else if (aba === 'configuracoes' && souAdmin) {
      conteudoAba = renderConfiguracoes(grupo);
    }

    container.innerHTML = `
      <div class="relative mb-10">
        <div class="h-36 rounded-2xl overflow-hidden shadow-sm" style="background: linear-gradient(135deg, ${grupo.cor || '#212529'}, #12161c)"></div>
        <div class="absolute left-6 -bottom-8 h-28 w-28 flex items-end justify-center">
          ${grupo.imagem_url
            ? `<img src="${grupo.imagem_url}" class="max-h-28 max-w-28 object-contain drop-shadow-lg" alt="">`
            : `<div class="h-20 w-20 rounded-2xl bg-card border border-border shadow-sm flex items-center justify-center text-lg font-bold">${grupo.codigo}</div>`}
        </div>
      </div>

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-4 mt-4">
        <h1 class="text-xl font-display font-bold">${grupo.nome}</h1>
        <p class="text-xs text-muted">${TIPO_LABEL[grupo.tipo] || grupo.tipo}</p>
      </div>

      ${renderAbas(souAdmin)}

      <div>${conteudoAba}</div>
    `;

    if (aba === 'configuracoes' && souAdmin) {
      document.getElementById('form-config').addEventListener('submit', async (e) => {
        e.preventDefault();
        const erroEl = document.getElementById('form-config-erro');
        erroEl.classList.add('hidden');

        const resposta = await apiFetch(`/grupos/${slug}`, {
          method: 'PATCH',
          body: JSON.stringify({
            nome: document.getElementById('gc-nome').value.trim(),
            tipo: document.getElementById('gc-tipo').value,
            imagem_url: document.getElementById('gc-imagem').value.trim() || undefined,
            cor: document.getElementById('gc-cor').value,
            permite_aulas: document.getElementById('gc-aulas').checked,
          }),
        });

        if (!resposta.ok) {
          const dados = await resposta.json().catch(() => ({}));
          erroEl.textContent = dados.erro || 'Não foi possível salvar.';
          erroEl.classList.remove('hidden');
          return;
        }
        carregar(me);
      });
    }
  }

  montarLayout('/grupos.html').then((me) => { if (me) carregar(me); });
</script>
</body>
</html>
