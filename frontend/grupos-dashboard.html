<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
  <div class="max-w-6xl mx-auto flex-1 w-full px-4 pt-8">
    <a href="/grupos.html" class="inline-flex items-center gap-1.5 bg-card border border-border rounded-full pl-2.5 pr-4 py-1.5 text-sm font-medium text-muted hover:text-dark hover:border-accent transition-colors shadow-sm">
      <span class="text-base leading-none">←</span> Grupos
    </a>
    <div id="conteudo" class="mt-2">
      <p class="text-sm text-muted">Carregando…</p>
    </div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/editor-html.js"></script>
<script src="/assets/seletor-usuarios.js"></script>
<script>
  // Formatos de URL:
  //   /grupos/{slug}                → membros
  //   /grupos/{slug}/noticias
  //   /grupos/{slug}/registros
  //   /grupos/{slug}/aulas           → lista de aulas (categorizada)
  //   /grupos/{slug}/aulas/{aulaSlug} → aula individual
  //   /grupos/{slug}/metas           → dashboard da meta semanal (grupos com permite_aulas)
  //   /grupos/{slug}/configuracoes
  const partes = location.pathname.split('/').filter(Boolean);
  const slug = decodeURIComponent(partes[1] || '');
  const aba = partes[2] || 'membros';
  const subPagina = partes[3] || null; // slug da aula, quando aba === 'aulas'

  const TIPO_LABEL = {
    companhia: 'Companhia', subcompanhia: 'Subcompanhia',
    orgao_topo: 'Órgão de Topo', setor_inteligencia: 'Setor de Inteligência',
  };
  const TIPO_REGISTRO_LABEL = {
    admissao: 'Admissão', promocao: 'Promoção', rebaixamento: 'Rebaixamento', saida: 'Desligamento', advertencia: 'Advertência',
  };

  function formatarDataCurtaGrupo(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return `${String(d.getDate()).padStart(2,'0')} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
  }

  // Data de HOJE no fuso do navegador, pra preencher <input type="date">
  // — 'new Date().toISOString().slice(0,10)' converte pra UTC antes de
  // cortar, então em fuso negativo (ex: BRT/UTC-3) qualquer horário a
  // partir das 21h local já cai no dia seguinte em UTC, e o campo abre
  // marcado com a data errada. Usa os getters LOCAIS em vez disso.
  function hojeLocalISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  const _cacheFigurePorNick = {};
  async function buscarFigurePorNick(nick) {
    if (!nick || nick === '—') return null;
    if (nick in _cacheFigurePorNick) return _cacheFigurePorNick[nick];
    try {
      const r = await apiFetch(`/usuarios/nick/${encodeURIComponent(nick)}`);
      _cacheFigurePorNick[nick] = r.ok ? (await r.json()).figure : null;
    } catch { _cacheFigurePorNick[nick] = null; }
    return _cacheFigurePorNick[nick];
  }

  function renderAbas(grupo, souMembro, souAdminDoGrupo) {
    if (!souMembro) {
      return `
        <div class="bg-card border border-border rounded-2xl shadow-sm px-5 pt-3 mb-4">
          <div class="flex gap-6 border-b border-border">
            <a href="/grupos/${slug}" class="pb-3 text-sm font-semibold border-b-2 border-accent text-dark">Membros</a>
          </div>
        </div>
      `;
    }

    const abas = [
      { id: 'membros', label: 'Membros', href: `/grupos/${slug}` },
      { id: 'noticias', label: 'Notícias', href: `/grupos/${slug}/noticias` },
      { id: 'regimento', label: 'Regimento Interno', href: `/grupos/${slug}/regimento` },
      { id: 'registros', label: 'Requerimentos internos', href: `/grupos/${slug}/registros` },
    ];
    if (grupo.permite_aulas) {
      abas.push({ id: 'aulas', label: 'Aulas', href: `/grupos/${slug}/aulas` });
      abas.push({ id: 'relatorios', label: 'Relatórios', href: `/grupos/${slug}/relatorios` });
      abas.push({ id: 'metas', label: 'Metas', href: `/grupos/${slug}/metas` });
    }
    if (souAdminDoGrupo) abas.push({ id: 'configuracoes', label: 'Configurações', href: `/grupos/${slug}/configuracoes` });

    return `
      <div class="bg-card border border-border rounded-2xl shadow-sm px-5 pt-3 mb-4">
        <div class="flex gap-6 border-b border-border overflow-x-auto">
          ${abas.map((a) => `
            <a href="${a.href}" class="pb-3 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap ${aba === a.id ? 'border-accent text-dark' : 'border-transparent text-muted hover:text-dark'}">
              ${a.label}
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }

  // ---------- Membros (igual às listagens: agrupado por nível, com avatar) ----------
  async function renderMembrosAgrupados(membros, niveis) {
    await Promise.all(membros.map(async (m) => {
      if (m.figure !== undefined) return;
      try {
        const r = await apiFetch(`/usuarios/nick/${encodeURIComponent(m.nick)}`);
        m.figure = r.ok ? (await r.json()).figure : null;
      } catch { m.figure = null; }
    }));

    const gruposPorNivel = [...niveis].sort((a, b) => a.ordem - b.ordem).map((nv) => ({
      nivel: nv,
      membros: membros.filter((m) => m.nivel_id === nv.id),
    }));

    return `
      <div class="space-y-4">
        ${gruposPorNivel.map(({ nivel, membros: lista }) => `
          <div class="bg-card border border-border rounded-2xl shadow-sm overflow-hidden">
            <div class="flex items-center gap-3 px-4 py-3 bg-basebg border-b border-border">
              <p class="text-sm font-bold uppercase tracking-wide">${nivel.nome}</p>
              <span class="text-xs text-muted ml-auto">${lista.length}</span>
            </div>
            <div class="divide-y divide-border">
              ${lista.length ? lista.map((m) => `
                <a href="/perfil/${m.nick}" class="flex items-center justify-between px-4 py-2.5 hover:bg-basebg transition-colors">
                  <div class="flex items-center gap-3">
                    <span class="h-9 w-9 rounded-full bg-basebg border border-border overflow-hidden inline-block shrink-0">
                      ${m.figure ? `<img src="${avatarUrl(m.figure, 'mini', '2')}" class="w-full h-[190%] object-cover object-top -mt-2 transition-transform duration-300 hover:-translate-y-[8px]" alt="">` : `<span class="w-full h-full flex items-center justify-center text-xs font-bold">${m.nick.slice(0,2).toUpperCase()}</span>`}
                    </span>
                    <span class="text-sm font-medium">${m.nick}${m.tag ? ` <span class="text-muted font-normal">[${m.tag}]</span>` : ''}${m.administrador_grupo ? ' <span class="text-accent text-xs font-semibold">· Admin</span>' : ''}</span>
                  </div>
                  <span class="text-xs text-muted">desde ${formatarDataCurtaGrupo(m.data_ingresso)}</span>
                </a>
              `).join('') : '<p class="text-sm text-muted px-4 py-3">Ninguém nesse cargo no momento.</p>'}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function montarNoticias(souAdminDoGrupo, me) {
    const container = document.getElementById('conteudo-principal');
    const r = await apiFetch(`/grupos/${slug}/noticias`);
    const noticias = r.ok ? (await r.json()).filter((n) => n.status === 'publicada') : [];

    container.innerHTML = `
      ${souAdminDoGrupo ? `
        <div class="bg-card border border-border rounded-2xl p-4 mb-4">
          <div class="flex items-center gap-2.5 mb-2">
            <span class="h-9 w-9 rounded-full bg-basebg border border-border overflow-hidden inline-block shrink-0">
              ${me.figure ? `<img src="${avatarUrl(me.figure, 'mini', '2')}" class="w-full h-[190%] object-cover object-top -mt-2" alt="">` : ''}
            </span>
            <span class="font-semibold text-sm">${me.nick}</span>
          </div>
          <input id="nova-noticia-titulo" placeholder="Título da notícia" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-accent">
          ${htmlEditorHtml('editor-nova-noticia', '')}
          <div class="flex justify-end mt-2">
            <button id="btn-publicar-noticia" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-xl px-5 py-2 text-sm transition-colors">Publicar</button>
          </div>
          <p id="erro-nova-noticia" class="hidden text-xs text-red-500 mt-1"></p>
        </div>
      ` : ''}
      <div id="lista-noticias">${await renderNoticias(noticias, souAdminDoGrupo)}</div>
    `;
    ligarEditorHtml('editor-nova-noticia');

    document.querySelectorAll('.btn-deletar-noticia').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Excluir essa notícia?')) return;
        const resp = await apiFetch(`/grupos/${slug}/noticias/${btn.dataset.id}`, { method: 'DELETE' });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          alert(d.erro || 'Não foi possível excluir.');
          return;
        }
        btn.closest('[data-noticia-id]').remove();
      });
    });

    const btnPublicar = document.getElementById('btn-publicar-noticia');
    if (btnPublicar) {
      btnPublicar.addEventListener('click', async () => {
        const titulo = document.getElementById('nova-noticia-titulo').value.trim();
        const conteudo = document.getElementById('editor-nova-noticia-textarea').value;
        const erroEl = document.getElementById('erro-nova-noticia');
        if (!titulo || !conteudo) {
          erroEl.textContent = 'Preencha o título e o conteúdo.';
          erroEl.classList.remove('hidden');
          return;
        }
        const resp = await apiFetch(`/grupos/${slug}/noticias`, { method: 'POST', body: JSON.stringify({ titulo, conteudo }) });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          erroEl.textContent = d.erro || 'Não foi possível publicar.';
          erroEl.classList.remove('hidden');
          return;
        }
        const { id } = await resp.json();
        const respPublicar = await apiFetch(`/grupos/${slug}/noticias/${id}/publicar`, { method: 'POST' });
        if (!respPublicar.ok) {
          const d = await respPublicar.json().catch(() => ({}));
          erroEl.textContent = d.erro || 'Não foi possível publicar.';
          erroEl.classList.remove('hidden');
          return;
        }
        montarNoticias(souAdminDoGrupo, me);
      });
    }
  }

  // ---------- Regimento Interno ----------
  async function montarRegimentoInterno(souAdminDoGrupo) {
    const container = document.getElementById('conteudo-principal');
    const resp = await apiFetch(`/grupos/${slug}/paginas/regimento-interno`);
    const pagina = resp.ok ? await resp.json() : { conteudo_html: '' };
    const temConteudo = Boolean(pagina.conteudo_html?.trim());

    container.innerHTML = `
      <div class="bg-card border border-border rounded-2xl shadow-sm p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-display font-bold">Regimento Interno</h2>
          ${souAdminDoGrupo ? '<button id="btn-editar-regimento" class="text-xs font-semibold text-accent hover:underline">Editar</button>' : ''}
        </div>
        <div id="regimento-view" class="text-sm">${temConteudo ? pagina.conteudo_html : '<p class="text-muted">Ainda não foi definido.</p>'}</div>
        <div id="regimento-edit" class="hidden"></div>
      </div>
    `;

    const btnEditar = document.getElementById('btn-editar-regimento');
    if (!btnEditar) return;

    btnEditar.addEventListener('click', () => {
      document.getElementById('regimento-view').classList.add('hidden');
      btnEditar.classList.add('hidden');
      const editArea = document.getElementById('regimento-edit');
      editArea.classList.remove('hidden');
      editArea.innerHTML = `
        ${htmlEditorHtml('editor-regimento', temConteudo ? pagina.conteudo_html : '')}
        <button id="btn-salvar-regimento" class="mt-2 text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Salvar</button>
      `;
      ligarEditorHtml('editor-regimento');
      editArea.querySelector('#btn-salvar-regimento').addEventListener('click', async () => {
        const resp = await apiFetch(`/grupos/${slug}/paginas/regimento-interno`, {
          method: 'PATCH',
          body: JSON.stringify({ titulo: 'Regimento Interno', conteudo_html: document.getElementById('editor-regimento-textarea').value }),
        });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          alert(d.erro || 'Não foi possível salvar.');
          return;
        }
        montarRegimentoInterno(souAdminDoGrupo);
      });
    });
  }

  async function renderCardNoticia(n, souAdminDoGrupo) {
    const figura = await buscarFigurePorNick(n.autor_nick);
    return `
      <div class="bg-card border border-border rounded-2xl p-4" data-noticia-id="${n.id}">
        <div class="flex items-center gap-2.5 mb-2">
          <span class="h-9 w-9 rounded-full bg-basebg border border-border overflow-hidden inline-block shrink-0">
            ${figura ? `<img src="${avatarUrl(figura, 'mini', '2')}" class="w-full h-[190%] object-cover object-top -mt-2 transition-transform duration-300 hover:-translate-y-[8px]" alt="">` : `<span class="w-full h-full flex items-center justify-center text-xs font-bold">${(n.autor_nick || '?').slice(0,2).toUpperCase()}</span>`}
          </span>
          <div>
            <p class="font-semibold text-sm">${n.autor_nick}${n.autor_cargo ? ` <span class="text-muted font-normal">· ${n.autor_cargo}</span>` : ''}</p>
          </div>
        </div>
        <p class="text-sm font-bold mb-1">${n.titulo}</p>
        <div class="text-sm">${n.conteudo}</div>
        <hr class="border-border my-3">
        <div class="flex items-center justify-between text-xs text-muted">
          <p><i class="fa-regular fa-clock"></i> ${new Date(n.publicado_em || n.criado_em).toLocaleString('pt-BR')}</p>
          ${souAdminDoGrupo ? `<button class="btn-deletar-noticia hover:text-red-600 transition-colors px-1" data-id="${n.id}" title="Excluir"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>
      </div>
    `;
  }

  async function renderNoticias(noticias, souAdminDoGrupo) {
    if (!noticias.length) return '<p class="text-sm text-muted">Nenhuma notícia publicada ainda.</p>';
    const cards = await Promise.all(noticias.map((n) => renderCardNoticia(n, souAdminDoGrupo)));
    return `<div class="space-y-3">${cards.join('')}</div>`;
  }

  const COR_TIPO_REGISTRO = {
    admissao: '#046b2f', promocao: '#046b2f', rebaixamento: '#c2410c',
    saida: '#dc2626', advertencia: '#ca8a04',
  };

  // Campos de cada tipo — todos usam nick/data/observações; os 4
  // últimos também pedem permissão (quem autorizou).
  const CAMPOS_TIPO_REGISTRO = {
    admissao: { rotuloCargo: 'Cargo', permissao: false },
    promocao: { rotuloCargo: 'Próximo cargo', permissao: true },
    rebaixamento: { rotuloCargo: 'Próximo cargo', permissao: true },
    saida: { rotuloCargo: 'Cargo', permissao: true },
    advertencia: { rotuloCargo: 'Cargo', permissao: true },
  };

  // Só formata pra EXIBIÇÃO — o que vai pro backend em `data_efetiva`
  // é sempre o valor ISO (YYYY-MM-DD) puro do <input type="date">,
  // nunca esse texto livre (antes os dois eram confundidos e o texto
  // já formatado é que ia parar no banco).
  function formatarDataExtensoRegistro(valorIso) {
    if (!valorIso) return '—';
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const [ano, mes, dia] = valorIso.split('-').map(Number);
    return `${String(dia).padStart(2,'0')} ${MESES[mes - 1]} ${ano}`;
  }

  async function renderCardRegistroGrupo(r, souAdminDoGrupo) {
    const cor = COR_TIPO_REGISTRO[r.tipo] || '#6b7280';
    const [figAlvo, figAutor] = await Promise.all([
      buscarFigurePorNick(r.usuario_nick), buscarFigurePorNick(r.registrado_por_nick),
    ]);

    function avatarPessoa(nick, figure) {
      return `
        <span class="h-7 w-7 rounded-full bg-basebg border border-border overflow-hidden inline-block shrink-0">
          ${figure ? `<img src="${avatarUrl(figure, 'mini', '2')}" class="w-full h-[190%] object-cover object-top -mt-2" alt="">` : `<span class="w-full h-full flex items-center justify-center text-[0.6rem] font-bold">${nick.slice(0,2).toUpperCase()}</span>`}
        </span>
      `;
    }

    return `
      <div class="bg-card border border-border rounded-2xl shadow-sm overflow-hidden" data-registro-id="${r.id}" style="border-left: 4px solid ${cor}">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-border">
          <p class="text-sm font-bold">${TIPO_REGISTRO_LABEL[r.tipo] || r.tipo}</p>
          <div class="flex items-center gap-3">
            <p class="text-xs text-muted">${r.data_efetiva ? formatarDataExtensoRegistro(r.data_efetiva) : new Date(r.criado_em).toLocaleDateString('pt-BR')}</p>
            ${souAdminDoGrupo ? `<button class="btn-deletar-registro hover:text-red-600 transition-colors text-muted" data-id="${r.id}" title="Excluir"><i class="fa-solid fa-trash text-xs"></i></button>` : ''}
          </div>
        </div>
        <div class="px-4 py-3 text-sm space-y-2">
          <div class="flex items-center gap-2">
            ${avatarPessoa(r.usuario_nick, figAlvo)}
            <p>${r.usuario_nick}${r.usuario_cargo_atual ? ` <span class="text-muted text-xs">· ${r.usuario_cargo_atual}</span>` : ''}</p>
          </div>
          ${r.nivel_novo_nome ? `<p><b>${CAMPOS_TIPO_REGISTRO[r.tipo]?.rotuloCargo || 'Cargo'}:</b> ${r.nivel_novo_nome}</p>` : ''}
          ${r.motivo ? `<p><b>Observações:</b> ${r.motivo}</p>` : ''}
          ${r.permissao ? `<p><b>Permissão:</b> ${r.permissao}</p>` : ''}
          <div class="flex items-center gap-2 pt-1 border-t border-border">
            ${avatarPessoa(r.registrado_por_nick || '—', figAutor)}
            <p class="text-xs text-muted">Registrado por ${r.registrado_por_nick || '—'}${r.registrado_por_cargo ? ` · ${r.registrado_por_cargo}` : ''}</p>
          </div>
        </div>
      </div>
    `;
  }

  async function montarRegistros(souAdminDoGrupo) {
    const container = document.getElementById('conteudo-principal');
    const r = await apiFetch(`/grupos/${slug}/registros`);
    const registros = r.ok ? await r.json() : [];

    let niveis = [];
    if (souAdminDoGrupo) {
      const niveisResp = await apiFetch(`/grupos/${slug}/niveis`);
      niveis = niveisResp.ok ? await niveisResp.json() : [];
    }

    function repintarCamposTipo(tipo) {
      const cfg = CAMPOS_TIPO_REGISTRO[tipo];
      document.getElementById('nr-rotulo-cargo').textContent = cfg.rotuloCargo;
      document.getElementById('nr-bloco-permissao').classList.toggle('hidden', !cfg.permissao);
    }

    container.innerHTML = `
      ${souAdminDoGrupo ? `
        <form id="form-novo-registro" class="bg-card border border-border rounded-2xl shadow-sm p-4 space-y-3 mb-5">
          <select id="nr-tipo" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <option value="admissao">Admissão</option>
            <option value="promocao">Promoção</option>
            <option value="rebaixamento">Rebaixamento</option>
            <option value="saida">Desligamento</option>
            <option value="advertencia">Advertência</option>
          </select>

          <div>
            <label class="block text-xs text-muted mb-1">Nick</label>
            ${seletorUsuariosHtml('nr-seletor-nick', 'Buscar por nick…')}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-muted mb-1">Data</label>
              <input id="nr-data" type="date" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            </div>
            <div>
              <label id="nr-rotulo-cargo" class="block text-xs text-muted mb-1">Cargo</label>
              <select id="nr-cargo" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                ${[...niveis].sort((a,b) => a.ordem - b.ordem).map((n) => `<option value="${n.id}">${n.nome}</option>`).join('')}
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs text-muted mb-1">Observações (opcional)</label>
            <textarea id="nr-observacoes" rows="2" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
          </div>

          <div id="nr-bloco-permissao">
            <label class="block text-xs text-muted mb-1">Permissão (quem autorizou)</label>
            <input id="nr-permissao" placeholder="Nick [TAG] de quem autorizou" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          </div>

          <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Registrar</button>

    `;

    const listaRegistros = document.getElementById('lista-registros');
    listaRegistros.innerHTML = registros.length
      ? (await Promise.all(registros.map((r) => renderCardRegistroGrupo(r, souAdminDoGrupo)))).join('')
      : '<p class="text-sm text-muted">Nenhum requerimento interno ainda.</p>';

    if (!souAdminDoGrupo) return;

    ligarSeletorUsuarios('nr-seletor-nick', {});
    document.getElementById('nr-tipo').addEventListener('change', (e) => repintarCamposTipo(e.target.value));
    repintarCamposTipo('admissao');
    document.getElementById('nr-data').value = hojeLocalISO();

    document.querySelectorAll('.btn-deletar-registro').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Excluir esse requerimento interno? Isso só apaga o registro — não desfaz o efeito já aplicado.')) return;
        const resp = await apiFetch(`/grupos/${slug}/registros/${btn.dataset.id}`, { method: 'DELETE' });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          alert(d.erro || 'Não foi possível excluir.');
          return;
        }
        document.querySelector(`[data-registro-id="${btn.dataset.id}"]`).remove();

      if (!selecionados.length) {
        erroEl.textContent = 'Escolha o nick.';
        erroEl.classList.remove('hidden');
        return;
      }
      const dataInput = document.getElementById('nr-data').value;
      const resp = await apiFetch(`/grupos/${slug}/registros`, {
        method: 'POST',
        body: JSON.stringify({
          tipo: document.getElementById('nr-tipo').value,
          usuario_id: selecionados[0],
          nivel_novo_id: Number(document.getElementById('nr-cargo').value),
          motivo: document.getElementById('nr-observacoes').value.trim() || undefined,
          permissao: document.getElementById('nr-permissao').value.trim() || undefined,
          data_efetiva: dataInput || undefined,
        }),
      });
      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        erroEl.textContent = d.erro || 'Não foi possível registrar.';
        erroEl.classList.remove('hidden');
        return;
      }
      montarRegistros(souAdminDoGrupo);
    });

  // ---------- Relatórios de aula ----------
  let paginaRelatorios = 1;

  function avatarPessoaPequeno(nick, figure) {
    return `
      <span class="h-6 w-6 rounded-full bg-basebg border border-border overflow-hidden inline-block shrink-0">
        ${figure ? `<img src="${avatarUrl(figure, 'mini', '2')}" class="w-full h-[190%] object-cover object-top -mt-1.5" alt="">` : `<span class="w-full h-full flex items-center justify-center text-[0.55rem] font-bold">${nick.slice(0,2).toUpperCase()}</span>`}
      </span>
    `;
  }

  async function renderCardRelatorioAula(rel, souAdminDoGrupo) {
    const figInstrutor = await buscarFigurePorNick(rel.instrutor_nick);
    const figurasAlunos = await Promise.all(rel.alunos.map((a) => buscarFigurePorNick(a.nick)));

    return `
      <div class="bg-card border border-border rounded-2xl shadow-sm overflow-hidden" data-relatorio-id="${rel.id}" style="border-left: 4px solid ${rel.aprovado ? '#046b2f' : '#dc2626'}">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-border">
          <p class="text-sm font-bold">${rel.curso_titulo}</p>
          <div class="flex items-center gap-3">
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${rel.aprovado ? 'bg-green-500/15 text-green-600' : 'bg-red-500/15 text-red-600'}">${rel.aprovado ? 'Aprovado' : 'Reprovado'}</span>
            ${souAdminDoGrupo ? `<button class="btn-deletar-relatorio hover:text-red-600 transition-colors text-muted" data-id="${rel.id}" title="Excluir"><i class="fa-solid fa-trash text-xs"></i></button>` : ''}
          </div>
        </div>
        <div class="px-4 py-3 text-sm space-y-2">
          <div class="flex items-center gap-2">
            ${avatarPessoaPequeno(rel.instrutor_nick, figInstrutor)}
            <p><b>Instrutor:</b> ${rel.instrutor_nick}</p>
          </div>
          <p><b>Data:</b> ${formatarDataExtensoRegistro(rel.data_efetiva)}</p>
          <div>
            <p class="font-semibold mb-1">Aluno${rel.alunos.length > 1 ? 's' : ''}:</p>
            <div class="space-y-1">
              ${rel.alunos.map((a, i) => `
                <div class="flex items-center gap-2">
                  ${avatarPessoaPequeno(a.nick, figurasAlunos[i])}
                  <p>${a.nick}</p>
                </div>
              `).join('')}
            </div>
          </div>
          ${rel.comentario ? `<p><b>Comentário:</b> ${rel.comentario}</p>` : ''}
        </div>
      </div>

  }

  async function montarRelatoriosAula(grupo, souAdminDoGrupo, me) {
    const container = document.getElementById('conteudo-principal');

    const [aulasResp, relResp] = await Promise.all([
      apiFetch(`/grupos/${slug}/aulas`), apiFetch(`/grupos/${slug}/aulas-relatorios?pagina=${paginaRelatorios}`),
    ]);
    const aulas = aulasResp.ok ? await aulasResp.json() : [];
    const { relatorios, total } = relResp.ok ? await relResp.json() : { relatorios: [], total: 0 };
    const totalPaginas = Math.max(1, Math.ceil(total / 10));

    container.innerHTML = `
      ${souAdminDoGrupo ? `
        <form id="form-relatorio-aula" class="bg-card border border-border rounded-2xl shadow-sm p-4 space-y-3 mb-5">
          <div>
            <label class="block text-xs text-muted mb-1">Instrutor</label>
            ${seletorUsuariosHtml('rel-seletor-instrutor', 'Buscar por nick…')}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-muted mb-1">Data</label>
              <input id="rel-data" type="date" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            </div>
            <div>
              <label class="block text-xs text-muted mb-1">Curso</label>
              <select id="rel-curso" required class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                ${aulas.map((a) => `<option value="${a.id}">${a.titulo}</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs text-muted mb-1">Aluno(s)</label>
            ${seletorUsuariosHtml('rel-seletor-alunos', 'Buscar por nick…')}
          </div>
          <div>
            <label class="block text-xs text-muted mb-1">Resultado</label>
            <select id="rel-resultado" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <option value="1">Aprovado</option>
              <option value="0">Reprovado</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-muted mb-1">Comentário (opcional)</label>
            <textarea id="rel-comentario" rows="2" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
          </div>
          <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Registrar relatório</button>
          <p id="rel-erro" class="hidden text-xs text-red-500"></p>
        </form>
      ` : ''}

      ${!aulas.length ? '<p class="text-xs text-muted mb-3">Nenhum curso cadastrado nesse grupo ainda — crie um na aba Aulas.</p>' : ''}

      <div class="space-y-3">
        ${relatorios.length ? (await Promise.all(relatorios.map((r) => renderCardRelatorioAula(r, souAdminDoGrupo)))).join('') : '<p class="text-sm text-muted">Nenhum relatório registrado ainda.</p>'}
      </div>

      ${totalPaginas > 1 ? `
        <div class="flex items-center justify-center gap-2 mt-5">
          <button id="rel-pagina-anterior" ${paginaRelatorios === 1 ? 'disabled' : ''} class="h-8 w-8 rounded-lg bg-card border border-border text-sm disabled:opacity-40 hover:bg-basebg transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
          <span class="text-xs text-muted px-2">Página ${paginaRelatorios} de ${totalPaginas}</span>
          <button id="rel-pagina-seguinte" ${paginaRelatorios === totalPaginas ? 'disabled' : ''} class="h-8 w-8 rounded-lg bg-card border border-border text-sm disabled:opacity-40 hover:bg-basebg transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      ` : ''}
    `;

    document.getElementById('rel-pagina-anterior')?.addEventListener('click', () => { paginaRelatorios--; montarRelatoriosAula(grupo, souAdminDoGrupo, me); });
    document.getElementById('rel-pagina-seguinte')?.addEventListener('click', () => { paginaRelatorios++; montarRelatoriosAula(grupo, souAdminDoGrupo, me); });

    document.querySelectorAll('.btn-deletar-relatorio').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Excluir esse relatório de aula?')) return;
        const resp = await apiFetch(`/grupos/${slug}/aulas-relatorios/${btn.dataset.id}`, { method: 'DELETE' });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          alert(d.erro || 'Não foi possível excluir.');
          return;
        }
        document.querySelector(`[data-relatorio-id="${btn.dataset.id}"]`).remove();
      });
    });

    if (!souAdminDoGrupo) return;

    ligarSeletorUsuarios('rel-seletor-instrutor', { iniciais: [{ id: me.id, nick: me.nick }] });
    ligarSeletorUsuarios('rel-seletor-alunos', {});
    document.getElementById('rel-data').value = hojeLocalISO();

    document.getElementById('form-relatorio-aula').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('rel-erro');
      const instrutores = obterSelecionados('rel-seletor-instrutor');
      const alunos = obterSelecionados('rel-seletor-alunos');
      if (!instrutores.length || !alunos.length) {
        erroEl.textContent = 'Escolha o instrutor e ao menos um aluno.';
        erroEl.classList.remove('hidden');
        return;
      }
      const dataInput = document.getElementById('rel-data').value;
      const resp = await apiFetch(`/grupos/${slug}/aulas-relatorios`, {
        method: 'POST',
        body: JSON.stringify({
          aula_id: Number(document.getElementById('rel-curso').value),
          instrutor_id: instrutores[0],
          alunos_ids: alunos,
          aprovado: document.getElementById('rel-resultado').value === '1',
          comentario: document.getElementById('rel-comentario').value.trim() || undefined,
          data_efetiva: dataInput || undefined,
        }),
      });
      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        erroEl.textContent = d.erro || 'Não foi possível registrar.';
        erroEl.classList.remove('hidden');
        return;
      }
      paginaRelatorios = 1;
      montarRelatoriosAula(grupo, souAdminDoGrupo, me);
    });
  }

  // ---------- Aulas: lista categorizada + página individual ----------
  async function montarAulas(grupo, souAdminDoGrupo) {
    const container = document.getElementById('conteudo-principal');

    if (subPagina) { await montarAulaIndividual(grupo, souAdminDoGrupo, container); return; }

    const [aulasResp, categoriasResp, niveisResp] = await Promise.all([
      apiFetch(`/grupos/${slug}/aulas`), apiFetch(`/grupos/${slug}/aulas-categorias`), apiFetch(`/grupos/${slug}/niveis`),
    ]);
    const aulas = aulasResp.ok ? await aulasResp.json() : [];
    const categorias = categoriasResp.ok ? await categoriasResp.json() : [];
    const niveis = niveisResp.ok ? await niveisResp.json() : [];

    const semCategoria = aulas.filter((a) => !a.categoria_id);
    const grupos = [
      ...categorias.map((cat) => ({ categoria: cat, itens: aulas.filter((a) => a.categoria_id === cat.id) })),
      ...(semCategoria.length ? [{ categoria: { id: null, nome: 'Sem categoria', niveis_ids: [] }, itens: semCategoria }] : []),
    ];

    function checkboxesNiveis(idPrefixo, niveisMarcados) {
      return [...niveis].sort((a,b) => a.ordem - b.ordem).map((n) => `
        <label class="flex items-center gap-2 bg-basebg border border-border rounded-lg px-3 py-1.5 text-xs">
          <input type="checkbox" data-nivel-id="${n.id}" ${niveisMarcados.includes(n.id) ? 'checked' : ''}> ${n.nome}
        </label>
      `).join('');
    }

    container.innerHTML = `
      ${souAdminDoGrupo ? `
        <div class="flex gap-2 mb-4">
          <button id="btn-nova-aula" class="text-xs font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-3 py-2 transition-colors"><i class="fa-solid fa-plus"></i> Nova aula</button>
          <button id="btn-nova-categoria-aula" class="text-xs font-semibold bg-card border border-border hover:bg-basebg rounded-lg px-3 py-2 transition-colors"><i class="fa-solid fa-plus"></i> Nova categoria</button>
        </div>
        <div id="form-nova-aula" class="hidden mb-4"></div>
        <div id="form-nova-categoria-aula" class="hidden mb-4"></div>
      ` : ''}
      ${grupos.length ? grupos.map(({ categoria, itens }) => `
        <div class="bg-card border border-border rounded-2xl shadow-sm overflow-hidden mb-3">
          <div class="flex items-center gap-3 px-4 py-3 bg-basebg border-b border-border">
            <p class="text-sm font-bold uppercase tracking-wide">${categoria.nome}</p>
            ${categoria.id && categoria.niveis_ids?.length ? `<span class="text-[0.65rem] text-muted" title="Só visível pra: ${categoria.niveis_ids.map((id) => niveis.find((n) => n.id === id)?.nome || '?').join(', ')}"><i class="fa-solid fa-lock"></i> restrita</span>` : ''}
            ${souAdminDoGrupo && categoria.id ? `
              <button data-editar-categoria-aula="${categoria.id}" class="text-muted hover:text-accent transition-colors ml-auto px-1" title="Editar acesso"><i class="fa-solid fa-gear text-xs"></i></button>
              <button data-excluir-categoria-aula="${categoria.id}" class="text-muted hover:text-red-600 transition-colors px-1" title="Excluir"><i class="fa-solid fa-trash text-xs"></i></button>
            ` : ''}
          </div>
          <div id="form-editar-categoria-${categoria.id}" class="hidden"></div>
          <div class="divide-y divide-border">
            ${itens.length ? itens.map((a) => `
              <a href="/grupos/${slug}/aulas/${a.slug}" class="flex items-center justify-between px-4 py-2.5 hover:bg-basebg transition-colors">
                <div>
                  <p class="text-sm font-semibold">${a.titulo}${a.abreviacao ? ` <span class="text-muted font-normal">(${a.abreviacao})</span>` : ''}</p>
                  ${a.descricao ? `<p class="text-xs text-muted mt-0.5">${a.descricao}</p>` : ''}
                </div>
                <i class="fa-solid fa-chevron-right text-muted text-xs"></i>
              </a>
            `).join('') : '<p class="text-sm text-muted px-4 py-3">Nenhuma aula nessa categoria ainda.</p>'}
          </div>
        </div>
      `).join('') : '<p class="text-sm text-muted">Nenhuma aula cadastrada ainda.</p>'}
    `;

    if (!souAdminDoGrupo) return;

    document.getElementById('btn-nova-categoria-aula').addEventListener('click', () => {
      const form = document.getElementById('form-nova-categoria-aula');
      const abrindo = form.classList.contains('hidden');
      form.classList.add('hidden');
      if (!abrindo) return;
      form.classList.remove('hidden');
      form.innerHTML = `
        <form class="bg-card border border-border rounded-2xl shadow-sm p-4 space-y-2">
          <div class="flex gap-2">
            <input id="nome-nova-categoria-aula" placeholder="Nome da categoria" required class="flex-1 bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">

        const resp = await apiFetch(`/grupos/${slug}/aulas-categorias`, {

    container.querySelectorAll('[data-editar-categoria-aula]').forEach((btn) => {
      btn.addEventListener('click', () => {

        const abrindo = form.classList.contains('hidden');

        form.classList.remove('hidden');
        form.innerHTML = `
          <form class="p-4 border-b border-border space-y-2">

          </form>
        `;
        form.querySelector('form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const niveisSelecionados = [...form.querySelectorAll('[data-nivel-id]')].filter((chk) => chk.checked).map((chk) => Number(chk.dataset.nivelId));
          const resp = await apiFetch(`/grupos/${slug}/aulas-categorias/${catId}`, {
            method: 'PATCH', body: JSON.stringify({ niveis_ids: niveisSelecionados }),
          });
          if (!resp.ok) {
            const d = await resp.json().catch(() => ({}));
            alert(d.erro || 'Não foi possível salvar.');
            return;
          }
          montarAulas(grupo, souAdminDoGrupo);
        });
      });
    });

    container.querySelectorAll('[data-excluir-categoria-aula]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Excluir essa categoria? As aulas dela ficam sem categoria.')) return;
        const resp = await apiFetch(`/grupos/${slug}/aulas-categorias/${btn.dataset.excluirCategoriaAula}`, { method: 'DELETE' });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          alert(d.erro || 'Não foi possível excluir.');
          return;
        }
        montarAulas(grupo, souAdminDoGrupo);
      });
    });

    document.getElementById('btn-nova-aula').addEventListener('click', async () => {
      const form = document.getElementById('form-nova-aula');
      const abrindo = form.classList.contains('hidden');
      form.classList.add('hidden');
      if (!abrindo) return;
      form.classList.remove('hidden');

      const niveisResp = await apiFetch(`/grupos/${slug}/niveis`);
      const niveis = niveisResp.ok ? await niveisResp.json() : [];

      form.innerHTML = `

  // ---------- Metas (dashboard de acompanhamento da meta semanal) ----------
  let semanaMetasDashboard = null; // null = semana atual; senão, 'YYYY-MM-DD' (qualquer dia dela)

  // `semana_inicio`/`semana_fim` são datas puras ('YYYY-MM-DD'), não
  // instantes — não pode passar por `new Date(...)` + getters locais
  // (formatarDataCurtaGrupo é pra timestamps ISO de verdade, tipo
  // data_ingresso) ou o dia exibido "anda pra trás" em fuso negativo.
  function formatarDataSemana(dataIso) {
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const [ano, mes, dia] = dataIso.split('-').map(Number);
    return `${String(dia).padStart(2,'0')} ${MESES[mes - 1]} ${ano}`;
  }

  function deslocarSemana(dataIso, dias) {
    const d = new Date(`${dataIso}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() + dias);
    return d.toISOString().slice(0, 10);
  }

  const STATUS_META = {
    isento: { label: 'Isento (entrou essa semana)', cor: 'bg-gray-500/15 text-gray-600' },
    cumpriu: { label: 'Meta batida', cor: 'bg-green-500/15 text-green-600' },
    andamento: { label: 'Em andamento', cor: 'bg-yellow-500/15 text-yellow-700' },
    naoCumpriu: { label: 'Não cumpriu', cor: 'bg-red-500/15 text-red-600' },
  };

  function statusMetaMembro(m, dados) {
    if (m.isento) return STATUS_META.isento;
    if (m.cumpriu) return STATUS_META.cumpriu;
    if (dados.semana_atual) return STATUS_META.andamento;
    return STATUS_META.naoCumpriu;
  }

  async function renderLinhaMetaMembro(m, dados) {
    const figure = await buscarFigurePorNick(m.nick);
    const status = statusMetaMembro(m, dados);
    const quantidade = dados.quantidade || 0;
    const pct = quantidade ? Math.min(100, Math.round((m.aulas_dadas / quantidade) * 100)) : 0;

    return `
      <div class="flex items-center gap-3 px-4 py-3">
        <span class="h-10 w-10 rounded-full bg-basebg border border-border overflow-hidden inline-block shrink-0">
          ${figure ? `<img src="${avatarUrl(figure, 'mini', '2')}" class="w-full h-[190%] object-cover object-top -mt-2.5" alt="">` : `<span class="w-full h-full flex items-center justify-center text-xs font-bold">${m.nick.slice(0,2).toUpperCase()}</span>`}
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate">${m.nick}${m.tag ? ` <span class="text-muted font-normal">[${m.tag}]</span>` : ''} <span class="text-muted font-normal text-xs">· ${m.nivel_nome}</span></p>
          <div class="h-1.5 bg-basebg border border-border rounded-full overflow-hidden mt-1.5 max-w-xs">
            <div class="h-full bg-accent" style="width: ${pct}%"></div>
          </div>
        </div>
        <div class="text-right shrink-0">
          <p class="text-sm font-bold">${m.aulas_dadas}${quantidade ? `/${quantidade}` : ''}</p>
          <span class="text-[0.65rem] font-semibold px-2 py-0.5 rounded-full ${status.cor} inline-block mt-0.5">${status.label}</span>
        </div>
      </div>
    `;
  }

  async function montarMetasDashboard(grupo, souAdminDoGrupo) {
    const container = document.getElementById('conteudo-principal');
    container.innerHTML = '<p class="text-sm text-muted">Carregando…</p>';

    const resp = await apiFetch(`/grupos/${slug}/meta/dashboard${semanaMetasDashboard ? `?semana=${semanaMetasDashboard}` : ''}`);
    if (!resp.ok) {
      container.innerHTML = '<p class="text-sm text-red-400">Não foi possível carregar o painel de metas.</p>';
      return;
    }
    const dados = await resp.json();

    if (!dados.ativa) {
      container.innerHTML = `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-6 text-center">
          <p class="text-sm text-muted">A meta semanal ainda não está ativa nesse grupo.</p>
          ${souAdminDoGrupo ? `<a href="/grupos/${slug}/configuracoes" class="text-xs font-semibold text-accent hover:underline mt-2 inline-block">Configurar em Configurações → Metas</a>` : ''}
        </div>
      `;
      return;
    }

    const nomeSemana = `${formatarDataSemana(dados.semana_inicio)} — ${formatarDataSemana(dados.semana_fim)}${dados.semana_atual ? ' (semana atual)' : ''}`;

    container.innerHTML = `
      <div class="flex items-center justify-between mb-4">
        <button id="metas-semana-anterior" class="h-9 w-9 rounded-lg bg-card border border-border text-sm hover:bg-basebg transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
        <p class="text-sm font-semibold">${nomeSemana}</p>
        <button id="metas-semana-seguinte" ${dados.semana_atual ? 'disabled' : ''} class="h-9 w-9 rounded-lg bg-card border border-border text-sm disabled:opacity-40 hover:bg-basebg transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      ${!dados.tem_niveis_configurados ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-4 mb-4 text-sm text-muted">
          Nenhum cargo está configurado pra receber essa meta.
          ${souAdminDoGrupo ? `<a href="/grupos/${slug}/configuracoes" class="text-accent hover:underline">Configure em Configurações → Metas</a>.` : ''}
        </div>
      ` : ''}

      <div class="bg-card border border-border rounded-2xl shadow-sm divide-y divide-border overflow-hidden">
        ${dados.membros.length
          ? (await Promise.all(dados.membros.map((m) => renderLinhaMetaMembro(m, dados)))).join('')
          : `<p class="text-sm text-muted p-4">${dados.tem_niveis_configurados ? 'Nenhum membro nos cargos selecionados.' : 'Nada a mostrar.'}</p>`}
      </div>
    `;

    document.getElementById('metas-semana-anterior').addEventListener('click', () => {
      semanaMetasDashboard = deslocarSemana(dados.semana_inicio, -7);
      montarMetasDashboard(grupo, souAdminDoGrupo);
    });
    document.getElementById('metas-semana-seguinte').addEventListener('click', () => {
      if (dados.semana_atual) return;
      semanaMetasDashboard = deslocarSemana(dados.semana_inicio, 7);
      montarMetasDashboard(grupo, souAdminDoGrupo);
    });
  }

      <form id="form-config-meta" class="bg-card border border-border rounded-2xl shadow-sm p-5 max-w-lg space-y-3">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-1">Meta semanal de aulas</h2>
        <p class="text-xs text-muted mb-2">Quantidade mínima de aulas (relatórios registrados) que cada membro dos cargos selecionados precisa dar por semana. Quem entrar no grupo durante a própria semana fica isento da meta nessa semana.</p>

        <label class="flex items-center gap-2 text-sm">
          <input id="meta-ativa" type="checkbox" ${meta.ativa ? 'checked' : ''}> Meta ativa
        </label>

        <div>
          <label class="block text-xs text-muted mb-1">Aulas por semana</label>
          <input id="meta-quantidade" type="number" min="1" value="${meta.quantidade ?? ''}" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
        </div>

        <div>
          <label class="block text-xs text-muted mb-1">Aplica-se aos cargos</label>
          <div class="space-y-1.5">
            ${[...niveis].sort((a,b) => a.ordem - b.ordem).map((n) => `
              <label class="flex items-center gap-2 bg-basebg border border-border rounded-lg px-3 py-2 text-sm">
                <input type="checkbox" data-meta-nivel="${n.id}" ${meta.niveis_ids.includes(n.id) ? 'checked' : ''}> ${n.nome}
              </label>
            `).join('') || '<p class="text-sm text-muted">Nenhum cargo cadastrado ainda — crie um na aba Hierarquia.</p>'}
          </div>
        </div>

        <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Salvar</button>
        <p id="form-config-meta-erro" class="hidden text-xs text-red-400"></p>
        <p id="form-config-meta-sucesso" class="hidden text-xs text-green-600">Salvo!</p>
      </form>
    `;

    document.getElementById('form-config-meta').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('form-config-meta-erro');
      const sucessoEl = document.getElementById('form-config-meta-sucesso');
      erroEl.classList.add('hidden');
      sucessoEl.classList.add('hidden');

      const niveisSelecionados = [...config.querySelectorAll('[data-meta-nivel]')]
        .filter((chk) => chk.checked).map((chk) => Number(chk.dataset.metaNivel));

      const resp = await apiFetch(`/grupos/${slug}/meta`, {
        method: 'PATCH',
        body: JSON.stringify({
          ativa: document.getElementById('meta-ativa').checked,
          quantidade: document.getElementById('meta-quantidade').value ? Number(document.getElementById('meta-quantidade').value) : null,
          niveis_ids: niveisSelecionados,
        }),
      });
      if (!resp.ok) {
        const d = await resp.json().catch(() => ({}));
        erroEl.textContent = d.erro || 'Não foi possível salvar.';
        erroEl.classList.remove('hidden');
        return;
      }
      sucessoEl.classList.remove('hidden');
    });
  }

  function ligarConfigTabs(grupo, me) {
    document.querySelectorAll('[data-subaba-config]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        subAbaConfig = btn.dataset.subabaConfig;
        document.getElementById('conteudo-principal').innerHTML = renderConfigTabs(grupo);
        ligarConfigTabs(grupo, me);
        if (subAbaConfig === 'basico') { document.getElementById('config-conteudo').innerHTML = renderConfigBasico(grupo, me); ligarFormBasico(grupo, me); }
        else if (subAbaConfig === 'hierarquia') montarConfigHierarquia(grupo);
        else if (subAbaConfig === 'metas') montarConfigMetas(grupo);
      });
    });
  }

  function ligarFormBasico(grupo, me) {
    document.getElementById('form-config').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('form-config-erro');
      erroEl.classList.add('hidden');
      const novoSlug = document.getElementById('gc-slug').value.trim();
      const resposta = await apiFetch(`/grupos/${slug}`, {
        method: 'PATCH',
        body: JSON.stringify({
          nome: document.getElementById('gc-nome').value.trim(),
          slug: novoSlug,
          tipo: me.administrador_sistema ? document.getElementById('gc-tipo').value : undefined,
          imagem_url: document.getElementById('gc-imagem').value.trim() || undefined,
          banner_url: document.getElementById('gc-banner').value.trim() || undefined,
          cor: document.getElementById('gc-cor').value,
          permite_aulas: document.getElementById('gc-aulas').checked,
          oculto: me.administrador_sistema ? document.getElementById('gc-oculto').checked : undefined,
          aparece_listagem: me.administrador_sistema ? document.getElementById('gc-aparece-listagem').checked : undefined,
        }),
      });
      if (!resposta.ok) {
        const dados = await resposta.json().catch(() => ({}));
        erroEl.textContent = dados.erro || 'Não foi possível salvar.';
        erroEl.classList.remove('hidden');
        return;
      }
      if (novoSlug && novoSlug !== slug) {
        window.location.href = `/grupos/${novoSlug}/configuracoes`;
        return;
      }
      grupo.permite_aulas = document.getElementById('gc-aulas').checked;
    });
  }

  async function carregar(me) {
    const container = document.getElementById('conteudo');

    const grupoResp = await apiFetch(`/grupos/${encodeURIComponent(slug)}`);
    if (!grupoResp.ok) {
      container.innerHTML = '<p class="text-sm text-red-400">Grupo não encontrado.</p>';
      return;
    }
    const grupo = await grupoResp.json();

    const membrosResp = await apiFetch(`/grupos/${slug}/membros`);
    const membros = membrosResp.ok ? await membrosResp.json() : [];
    const souAdminDoGrupo = Boolean(me.administrador_sistema) || Boolean(membros.find((m) => m.id === me.id)?.administrador_grupo);
    const souMembro = souAdminDoGrupo || Boolean(membros.find((m) => m.id === me.id));

    container.innerHTML = `
      <div class="relative mb-10">
        <div class="h-36 rounded-2xl overflow-hidden shadow-sm bg-cover bg-center" style="${grupo.banner_url ? `background-image: url('${grupo.banner_url}')` : `background: linear-gradient(135deg, ${grupo.cor || '#212529'}, #12161c)`}"></div>
        <div class="absolute left-6 -bottom-8 h-24 w-24 rounded-2xl bg-card border border-border shadow-sm flex items-center justify-center p-3">
          ${grupo.imagem_url
            ? `<img src="${grupo.imagem_url}" class="max-w-full object-contain" style="height: 68px;" alt="">`
            : `<span class="text-lg font-bold">${grupo.codigo}</span>`}
        </div>
      </div>

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-4 mt-4">
        <h1 class="text-xl font-display font-bold">${grupo.nome}</h1>
        <p class="text-xs text-muted">${TIPO_LABEL[grupo.tipo] || grupo.tipo}</p>
      </div>

      ${renderAbas(grupo, souMembro, souAdminDoGrupo)}

      <div id="conteudo-principal"><p class="text-sm text-muted">Carregando…</p></div>
    `;

    const conteudoPrincipal = document.getElementById('conteudo-principal');
    const abaPermitida = souMembro || aba === 'membros';

    if (!abaPermitida) {
      conteudoPrincipal.innerHTML = '<p class="text-sm text-muted">Você não pertence a este grupo — só quem é membro (ou administrador) pode ver essa aba.</p>';
      return;
    }

    if (aba === 'membros') {
      const niveisResp = await apiFetch(`/grupos/${slug}/niveis`);
      const niveis = niveisResp.ok ? await niveisResp.json() : [];
      conteudoPrincipal.innerHTML = await renderMembrosAgrupados(membros, niveis);
    } else if (aba === 'noticias') {
      await montarNoticias(souAdminDoGrupo, me);
    } else if (aba === 'regimento') {
      await montarRegimentoInterno(souAdminDoGrupo);
    } else if (aba === 'registros') {
      await montarRegistros(souAdminDoGrupo);
    } else if (aba === 'relatorios' && grupo.permite_aulas) {
      await montarRelatoriosAula(grupo, souAdminDoGrupo, me);
    } else if (aba === 'aulas' && grupo.permite_aulas) {
      await montarAulas(grupo, souAdminDoGrupo);
    } else if (aba === 'metas' && grupo.permite_aulas) {
      await montarMetasDashboard(grupo, souAdminDoGrupo);
    } else if (aba === 'configuracoes' && souAdminDoGrupo) {
      subAbaConfig = 'basico';
      conteudoPrincipal.innerHTML = renderConfigTabs(grupo);
      ligarConfigTabs(grupo, me);
      document.getElementById('config-conteudo').innerHTML = renderConfigBasico(grupo, me);
      ligarFormBasico(grupo, me);
    } else {
      conteudoPrincipal.innerHTML = '<p class="text-sm text-muted">Você não tem acesso a essa aba.</p>';
    }
  }

  montarLayout('/grupos.html').then((me) => { if (me) carregar(me); });
</script>
</body>
</html>
