<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Processo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 min-h-screen flex flex-col">
    <div class="flex-1 min-w-0 px-6 py-8">
      <div class="max-w-3xl mx-auto">
        <a href="/projetos.html" class="text-sm text-muted hover:text-accent transition-colors mb-4 inline-block">
          <i class="fa-solid fa-arrow-left"></i> Voltar aos processos
        </a>
        <div id="conteudo-projeto">
          <p class="text-sm text-muted">Carregando…</p>
        </div>
      </div>
    </div>
    <div id="layout-footer"></div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/projetos.js"></script>
<script src="/assets/footer.js"></script>
<script src="/assets/layout.js"></script>
<script>
  const projetoId = location.pathname.split('/').filter(Boolean)[1];
  let euId = null;

  function escapeHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto || '';
    return div.innerHTML;
  }

  function cardHistorico(historico) {
    if (!historico.length) return '';
    return `
      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Linha do tempo</h2>
        <div class="space-y-3">
          ${historico.map((h) => `
            <div class="flex gap-3 text-sm">
              <span class="text-muted shrink-0 w-32">${formatarDataProjeto(h.criado_em)}</span>
              <p><span class="font-semibold">${h.criado_por_nick || 'Sistema'}</span> — ${escapeHtml(h.descricao)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function cardVotos(p, souMembro) {
    const votos = p.votos || [];
    const aprova = votos.filter((v) => v.voto === 'aprova').length;
    const reprova = votos.filter((v) => v.voto === 'reprova').length;
    const meuVoto = votos.find((v) => v.usuario_id === euId);

    const podeVotarAgora = p.status === 'em_votacao' && souMembro;

    return `
      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-muted">Votação</h2>
          <p class="text-sm"><span class="text-green-600 font-semibold">${aprova} aprova</span> · <span class="text-red-600 font-semibold">${reprova} reprova</span></p>
        </div>

        ${podeVotarAgora ? `
          <form id="form-votar" class="space-y-2 mb-4">
            <div class="flex gap-2">
              <button type="button" data-voto="aprova" class="btn-voto flex-1 text-sm font-semibold px-3 py-2 rounded-lg border ${meuVoto?.voto === 'aprova' ? 'bg-green-500/15 border-green-500 text-green-600' : 'bg-basebg border-border text-muted'}">
                <i class="fa-solid fa-check"></i> Aprova
              </button>
              <button type="button" data-voto="reprova" class="btn-voto flex-1 text-sm font-semibold px-3 py-2 rounded-lg border ${meuVoto?.voto === 'reprova' ? 'bg-red-500/15 border-red-500 text-red-600' : 'bg-basebg border-border text-muted'}">
                <i class="fa-solid fa-xmark"></i> Reprova
              </button>
            </div>
            <textarea id="voto-comentario" rows="2" placeholder="Comentário (opcional)" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">${meuVoto?.comentario || ''}</textarea>
            <input type="hidden" id="voto-valor" value="${meuVoto?.voto || ''}">
            <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">${meuVoto ? 'Atualizar voto' : 'Votar'}</button>
            <p id="votar-erro" class="hidden text-xs text-red-500"></p>
          </form>
        ` : ''}

        ${votos.length ? `
          <div class="space-y-2">
            ${votos.map((v) => `
              <div class="flex items-start justify-between gap-3 bg-basebg border border-border rounded-lg px-3 py-2">
                <div class="min-w-0">
                  <p class="text-sm">${avatarNickHtml(v.usuario_nick, v.figure, { size: 6, bold: true })}</p>
                  ${v.comentario ? `<p class="text-xs text-muted mt-0.5">${escapeHtml(v.comentario)}</p>` : ''}
                </div>
                <span class="text-xs font-semibold shrink-0 ${v.voto === 'aprova' ? 'text-green-600' : 'text-red-600'}">${v.voto === 'aprova' ? 'Aprova' : 'Reprova'}</span>
              </div>
            `).join('')}
          </div>
        ` : '<p class="text-sm text-muted">Ninguém votou ainda.</p>'}
      </div>
    `;
  }

  async function render() {
    const container = document.getElementById('conteudo-projeto');
    const resp = await apiFetch(`/projetos/${projetoId}`);
    if (resp.status === 403) {
      container.innerHTML = '<p class="text-sm text-red-500">Você não tem permissão para ver este processo (só membros do grupo responsável e administradores do sistema).</p>';
      return;
    }
    if (!resp.ok) {
      container.innerHTML = '<p class="text-sm text-red-500">Processo não encontrado.</p>';
      return;
    }
    const p = await resp.json();

    const grupo = await buscarGrupoResponsavelProjetos();
    const souAdmin = grupo ? await souAdminDoGrupoResponsavel(grupo.id) : false;
    const membros = grupo ? await buscarMembrosGrupoResponsavel(grupo.slug) : [];
    const souMembro = membros.some((m) => m.id === euId);
    const ehResponsavel = p.responsavel_id === euId;

    const [autorFigure, responsavelFigure] = await Promise.all([
      buscarFigureProjeto(p.autor_nick),
      p.responsavel_nick ? buscarFigureProjeto(p.responsavel_nick) : Promise.resolve(null),
    ]);
    p.votos = await Promise.all((p.votos || []).map(async (v) => ({ ...v, figure: await buscarFigureProjeto(v.usuario_nick) })));

    const naoTerminal = ['aberto', 'em_analise', 'em_votacao', 'aguardando_implementacao'].includes(p.status);

    container.innerHTML = `
      <div class="bg-card border border-border rounded-2xl shadow-sm p-5">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap mb-2">
              <span class="text-xs text-muted font-mono">#${p.id}</span>
              ${badgeTipoProjeto(p.tipo)}
              ${badgeStatusProjeto(p.status)}
            </div>
            <h1 class="font-display text-xl font-black tracking-tight mb-1">${escapeHtml(p.titulo)}</h1>
            <p class="text-xs text-muted mb-4">Aberto por ${avatarNickHtml(p.autor_nick, autorFigure, { size: 5, bold: true })} em ${formatarDataProjeto(p.criado_em)}</p>
            <p class="text-sm whitespace-pre-wrap">${escapeHtml(p.descricao)}</p>

            ${souAdmin ? `
              <div class="mt-4 pt-4 border-t border-border flex items-center gap-4">
                ${naoTerminal ? '<button id="btn-arquivar" class="text-xs font-semibold text-red-600 hover:underline"><i class="fa-solid fa-box-archive"></i> Arquivar processo</button>' : ''}
                <button id="btn-excluir" class="text-xs font-semibold text-red-700 hover:underline"><i class="fa-solid fa-trash"></i> Excluir processo</button>
              </div>
            ` : ''}
          </div>
          ${avatarGrandeHtml(autorFigure, p.autor_nick)}
        </div>
      </div>

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0 flex-1">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Responsável</h2>
            ${p.responsavel_nick ? `<p class="text-sm mb-3">${avatarNickHtml(p.responsavel_nick, responsavelFigure, { size: 6, bold: true })} — definido em ${formatarDataProjeto(p.responsavel_definido_em)}</p>` : '<p class="text-sm text-muted mb-3">Ainda não definido.</p>'}
            ${souAdmin && naoTerminal ? `
              <form id="form-responsavel" class="flex gap-2">
                <select id="resp-usuario-id" class="flex-1 bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                  <option value="">Escolha um membro do grupo…</option>
                  ${membros.map((m) => `<option value="${m.id}" ${m.id === p.responsavel_id ? 'selected' : ''}>${m.nick}</option>`).join('')}
                </select>
                <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors whitespace-nowrap">${p.responsavel_id ? 'Trocar' : 'Definir'}</button>
              </form>
            ` : ''}
          </div>
          ${p.responsavel_nick ? avatarGrandeHtml(responsavelFigure, p.responsavel_nick) : ''}
        </div>
      </div>

      ${p.parecer_postado_em ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-muted">Análise e parecer do responsável</h2>
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${p.veredito === 'aprova' ? 'bg-green-500/15 text-green-600' : 'bg-red-500/15 text-red-600'}">Recomendação: ${p.veredito === 'aprova' ? 'Aprova' : 'Reprova'}</span>
          </div>
          <p class="text-xs font-semibold text-muted mb-1">Análise</p>
          <p class="text-sm whitespace-pre-wrap mb-3">${escapeHtml(p.analise)}</p>
          <p class="text-xs font-semibold text-muted mb-1">Parecer</p>
          <p class="text-sm whitespace-pre-wrap">${escapeHtml(p.parecer)}</p>
        </div>
      ` : (p.status === 'em_analise' && ehResponsavel ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Postar análise e parecer</h2>
          <form id="form-parecer" class="space-y-3">
            <textarea id="parecer-analise" rows="3" placeholder="Análise do processo…" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
            <textarea id="parecer-texto" rows="3" placeholder="Parecer…" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
            <select id="parecer-veredito" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
              <option value="aprova">Recomendo aprovar</option>
              <option value="reprova">Recomendo reprovar</option>
            </select>
            <p class="text-xs text-muted">O veredito é só uma recomendação — quem decide é a votação dos membros do grupo, que abre assim que você postar.</p>
            <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Postar e abrir votação</button>
            <p id="parecer-erro" class="hidden text-xs text-red-500"></p>
          </form>
        </div>
      ` : '')}

      ${(p.status === 'em_votacao' || p.votos?.length) ? cardVotos(p, souMembro) : ''}

      ${p.status === 'em_votacao' && souAdmin ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
          <button id="btn-encerrar-votacao" class="bg-dark hover:bg-black text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Encerrar votação</button>
          <p id="encerrar-erro" class="hidden text-xs text-red-500 mt-2"></p>
        </div>
      ` : ''}

      ${p.status === 'aguardando_implementacao' && ehResponsavel ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-3">Concluir implementação</h2>
          <form id="form-concluir" class="space-y-3">
            <textarea id="concluir-descricao" rows="3" placeholder="Descreva o que foi feito pra implementar o processo…" class="w-full bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
            <button type="submit" class="bg-accent hover:bg-accent-dark text-white font-semibold rounded-lg px-4 py-2 text-sm transition-colors">Concluir processo</button>
            <p id="concluir-erro" class="hidden text-xs text-red-500"></p>
          </form>
        </div>
      ` : ''}

      ${p.status === 'concluido' ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-2">Implementação</h2>
          <p class="text-sm whitespace-pre-wrap">${escapeHtml(p.implementacao_descricao)}</p>
          <p class="text-xs text-muted mt-2">Concluído em ${formatarDataProjeto(p.concluido_em)}</p>
        </div>
      ` : ''}

      ${p.status === 'arquivado' ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mt-5">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-muted mb-2">Arquivado</h2>
          ${p.motivo_arquivamento ? `<p class="text-sm">${escapeHtml(p.motivo_arquivamento)}</p>` : ''}
          <p class="text-xs text-muted mt-2">${formatarDataProjeto(p.arquivado_em)}</p>
          ${souAdmin ? `
            <div class="flex gap-2 mt-4 pt-4 border-t border-border">
              <button id="btn-desarquivar-implementacao" class="text-xs font-semibold bg-basebg border border-border rounded-lg px-3 py-2 hover:bg-border/40 transition-colors">Desarquivar → aguardando implementação</button>
              <button id="btn-desarquivar-votacao" class="text-xs font-semibold bg-basebg border border-border rounded-lg px-3 py-2 hover:bg-border/40 transition-colors">Desarquivar → reiniciar votação</button>
            </div>
          ` : ''}
        </div>
      ` : ''}

      ${cardHistorico(p.historico || [])}
    `;

    document.getElementById('btn-arquivar')?.addEventListener('click', async () => {
      const motivo = prompt('Motivo do arquivamento (opcional):') || undefined;
      if (!confirm('Arquivar este processo?')) return;
      await apiFetch(`/projetos/${projetoId}/arquivar`, { method: 'POST', body: JSON.stringify({ motivo }) });
      render();
    });

    document.getElementById('btn-excluir')?.addEventListener('click', async () => {
      if (!confirm('Excluir este processo permanentemente? Essa ação não pode ser desfeita.')) return;
      const resp = await apiFetch(`/projetos/${projetoId}`, { method: 'DELETE' });
      if (!resp.ok) {
        const dados = await resp.json().catch(() => ({}));
        alert(dados.erro || 'Não foi possível excluir o processo.');
        return;
      }
      window.location.href = '/projetos.html';
    });

    document.getElementById('form-responsavel')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const usuarioId = document.getElementById('resp-usuario-id').value;
      if (!usuarioId) return;
      await apiFetch(`/projetos/${projetoId}/responsavel`, { method: 'POST', body: JSON.stringify({ usuario_id: Number(usuarioId) }) });
      render();
    });

    document.getElementById('form-parecer')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('parecer-erro');
      const resp = await apiFetch(`/projetos/${projetoId}/parecer`, {
        method: 'POST',
        body: JSON.stringify({
          analise: document.getElementById('parecer-analise').value.trim(),
          parecer: document.getElementById('parecer-texto').value.trim(),
          veredito: document.getElementById('parecer-veredito').value,
        }),
      });
      if (!resp.ok) {
        const dados = await resp.json().catch(() => ({}));
        erroEl.textContent = dados.erro || 'Não foi possível postar o parecer.';
        erroEl.classList.remove('hidden');
        return;
      }
      render();
    });

    document.querySelectorAll('.btn-voto').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.getElementById('voto-valor').value = btn.dataset.voto;
        document.querySelectorAll('.btn-voto').forEach((b) => {
          b.className = 'btn-voto flex-1 text-sm font-semibold px-3 py-2 rounded-lg border bg-basebg border-border text-muted';
        });
        btn.className = btn.dataset.voto === 'aprova'
          ? 'btn-voto flex-1 text-sm font-semibold px-3 py-2 rounded-lg border bg-green-500/15 border-green-500 text-green-600'
          : 'btn-voto flex-1 text-sm font-semibold px-3 py-2 rounded-lg border bg-red-500/15 border-red-500 text-red-600';
      });
    });

    document.getElementById('form-votar')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('votar-erro');
      const voto = document.getElementById('voto-valor').value;
      if (!voto) {
        erroEl.textContent = 'Escolha aprova ou reprova.';
        erroEl.classList.remove('hidden');
        return;
      }
      const resp = await apiFetch(`/projetos/${projetoId}/votar`, {
        method: 'POST',
        body: JSON.stringify({ voto, comentario: document.getElementById('voto-comentario').value.trim() || undefined }),
      });
      if (!resp.ok) {
        const dados = await resp.json().catch(() => ({}));
        erroEl.textContent = dados.erro || 'Não foi possível votar.';
        erroEl.classList.remove('hidden');
        return;
      }
      render();
    });

    document.getElementById('btn-encerrar-votacao')?.addEventListener('click', async () => {
      const erroEl = document.getElementById('encerrar-erro');
      const resp = await apiFetch(`/projetos/${projetoId}/encerrar-votacao`, { method: 'POST' });
      if (!resp.ok) {
        const dados = await resp.json().catch(() => ({}));
        erroEl.textContent = dados.erro || 'Não foi possível encerrar a votação.';
        erroEl.classList.remove('hidden');
        return;
      }
      render();
    });

    document.getElementById('form-concluir')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById('concluir-erro');
      const descricao = document.getElementById('concluir-descricao').value.trim();
      if (!descricao) {
        erroEl.textContent = 'Descreva o que foi feito.';
        erroEl.classList.remove('hidden');
        return;
      }
      const resp = await apiFetch(`/projetos/${projetoId}/concluir`, {
        method: 'POST',
        body: JSON.stringify({ implementacao_descricao: descricao }),
      });
      if (!resp.ok) {
        const dados = await resp.json().catch(() => ({}));
        erroEl.textContent = dados.erro || 'Não foi possível concluir o processo.';
        erroEl.classList.remove('hidden');
        return;
      }
      render();
    });

    document.getElementById('btn-desarquivar-implementacao')?.addEventListener('click', async () => {
      if (!confirm('Desarquivar direto pra "aguardando implementação"?')) return;
      await apiFetch(`/projetos/${projetoId}/desarquivar`, { method: 'POST', body: JSON.stringify({ destino: 'aguardando_implementacao' }) });
      render();
    });

    document.getElementById('btn-desarquivar-votacao')?.addEventListener('click', async () => {
      if (!confirm('Desarquivar e reiniciar a votação do zero (os votos antigos serão apagados)?')) return;
      await apiFetch(`/projetos/${projetoId}/desarquivar`, { method: 'POST', body: JSON.stringify({ destino: 'em_votacao' }) });
      render();
    });
  }

  montarLayout('/projetos.html').then((me) => {
    if (!me) return;
    euId = me.id;
    render();
  });
</script>
</body>
</html>
