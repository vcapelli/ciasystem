<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Documento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="bg-basebg text-dark font-sans min-h-screen">

  <div class="fixed inset-0 -z-10 habbo-floor-bg"></div>

  <aside id="layout-sidebar" class="w-60 fixed left-0 top-[72px] bottom-0 border-r border-border bg-basebg p-4 overflow-y-auto"></aside>

  <main class="ml-60 px-6 py-8">
    <a href="/documentos.html" class="text-xs text-muted hover:text-dark transition-colors">← Voltar pros documentos</a>
    <div id="conteudo" class="mt-2">
      <p class="text-sm text-muted">Carregando…</p>
    </div>
  </main>

<script src="/assets/api.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/editor-html.js"></script>
<script src="/assets/seletor-usuarios.js"></script>
<script>
  // Formatos de URL possíveis:
  //   /documentos/{slug}                  → documento vigente
  //   /documentos/{slug}/{numero}          → versão antiga (implementada), só leitura
  //   /documentos/{slug}/revisao/{numero}   → página da solicitação (rascunho/votação)
  const partesUrl = window.location.pathname.split('/').filter(Boolean);
  const slugDocumento = partesUrl[1];
  const ehPaginaSolicitacao = partesUrl[2] === 'revisao';
  const numeroSolicitacao = ehPaginaSolicitacao ? partesUrl[3] : null;
  const numeroVersaoAntiga = !ehPaginaSolicitacao ? (partesUrl[2] || null) : null;

  const BADGE_STATUS_DOC = {
    vigente: 'bg-green-500/15 text-green-600', em_revisao: 'bg-accent/15 text-accent', arquivado: 'bg-white/10 text-muted',
    rascunho: 'bg-white/10 text-muted', em_aprovacao: 'bg-accent/15 text-accent', aprovado: 'bg-green-500/15 text-green-600',
    reprovado: 'bg-red-500/15 text-red-600', agendado: 'bg-amber-500/15 text-amber-600', implementado: 'bg-green-500/15 text-green-600',
    cancelado: 'bg-red-500/15 text-red-600', pendente: 'bg-gray-500/15 text-gray-600',
  };
  const TIPOS_DOC = {
    constituicao_militar: 'Constituição Militar', codigo_penal_militar: 'Código Penal Militar',
    guia_defesa_batalhao: 'Guia de Defesa do Batalhão', outro: 'Outro',
  };
  const LABEL_PAPEL = { autor: 'Autores', aprovador: 'Aprovadores', administrador_forum: 'Administradores do Fórum' };
  const ORDEM_PAPEIS = ['autor', 'aprovador', 'administrador_forum'];

  function formatarData(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('pt-BR');
  }

  async function buscarFigure(nick) {
    if (!nick) return null;
    try {
      const r = await apiFetch(`/usuarios/nick/${encodeURIComponent(nick)}`);
      return r.ok ? (await r.json()).figure : null;
    } catch { return null; }
  }

  async function renderRodapeRevisao(info) {
    if (!info) return '';
    const porPapel = {};
    for (const papel of ORDEM_PAPEIS) porPapel[papel] = info.aprovadores.filter((a) => a.papel === papel);

    const secoes = await Promise.all(ORDEM_PAPEIS.map(async (papel) => {
      const pessoas = await Promise.all(porPapel[papel].map(async (a) => ({ ...a, figure: await buscarFigure(a.usuario_nick) })));
      return { papel, pessoas };
    }));

    return `
      <hr class="my-4 border-border">
      <div class="grid grid-cols-3 gap-4 text-xs mb-4">
        <div><p class="uppercase text-muted font-semibold mb-0.5">Revisão</p><p>nº ${info.numero_revisao}</p></div>
        <div><p class="uppercase text-muted font-semibold mb-0.5">Data da revisão</p><p>${formatarData(info.criado_em)}</p></div>
        <div><p class="uppercase text-muted font-semibold mb-0.5">Implementado em</p><p>${formatarData(info.implementado_em)}</p></div>
      </div>
      <div class="flex flex-wrap gap-6">
        ${secoes.map(({ papel, pessoas }) => pessoas.map((a) => `
          <div class="text-center">
            <span class="h-12 w-12 mx-auto rounded-full bg-basebg border border-border overflow-hidden inline-block">
              ${a.figure ? `<img src="${avatarUrl(a.figure, 'mini', '2')}" class="w-full h-[190%] object-cover object-top -mt-3 transition-transform duration-300 hover:-translate-y-[10px]" alt="">` : `<span class="w-full h-full flex items-center justify-center text-xs font-bold">${(a.usuario_nick || '?').slice(0,2).toUpperCase()}</span>`}
            </span>
            <p class="text-xs font-semibold mt-1">${LABEL_PAPEL[papel].replace(/s$/, '')}</p>
            <p class="text-xs text-muted">${a.usuario_nick || '—'}</p>
            ${a.comentario ? `<p class="text-xs text-muted italic mt-0.5">"${a.comentario}"</p>` : ''}
          </div>
        `).join('')).join('')}
      </div>
    `;
  }

  // ---------- Visão de uma versão antiga (somente leitura) ----------
  async function montarVersaoAntiga() {
    const container = document.getElementById('conteudo');
    const resp = await apiFetch(`/documentos/slug/${slugDocumento}/versao/${Number(numeroVersaoAntiga)}`);
    if (!resp.ok) { container.innerHTML = '<p class="text-sm text-red-500 mt-2">Versão não encontrada.</p>'; return; }
    const { documento, revisao } = await resp.json();

    container.innerHTML = `
      <div class="flex items-center justify-between mt-2 mb-1">
        <h1 class="text-xl font-display font-bold">${documento.titulo}</h1>
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-white/10 text-muted">Versão arquivada nº ${revisao.numero_revisao}</span>
      </div>
      <p class="text-xs text-muted mb-4">
        Esta é uma versão anterior, não é mais a vigente.
        <a href="/documentos/${slugDocumento}" class="text-accent hover:underline">Ver versão atual →</a>
      </p>
      <div class="bg-card border border-border rounded-2xl shadow-sm p-5">
        <div class="text-sm">${revisao.conteudo_proposto}</div>
        <div id="rodape-versao-antiga"></div>
      </div>
    `;
    document.getElementById('rodape-versao-antiga').innerHTML = await renderRodapeRevisao(revisao);
  }

  // ---------- Vista principal do documento (vigente + solicitações abertas) ----------
  async function montarDocumento(me) {
    const container = document.getElementById('conteudo');
    container.innerHTML = '<p class="text-sm text-muted mt-2">Carregando…</p>';

    const docResp = await apiFetch(`/documentos/slug/${slugDocumento}`);
    if (!docResp.ok) { container.innerHTML = '<p class="text-sm text-red-500 mt-2">Documento não encontrado.</p>'; return; }
    const doc = await docResp.json();

    const revisoesResp = await apiFetch(`/documentos/${doc.id}/revisoes`);
    const revisoes = revisoesResp.ok ? await revisoesResp.json() : [];
    const versoesImplementadas = revisoes.filter((r) => r.status === 'implementado');

    container.innerHTML = `
      <div class="flex items-center justify-between mt-2 mb-1">
        <h1 class="text-xl font-display font-bold">${doc.titulo}</h1>
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full capitalize ${BADGE_STATUS_DOC[doc.status] || ''}">${doc.status.replace(/_/g, ' ')}</span>
      </div>
      <p class="text-xs text-muted mb-4">${TIPOS_DOC[doc.tipo] || doc.tipo} · /documentos/${slugDocumento}</p>

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-5">
        <div class="text-sm">${doc.conteudo_atual}</div>
        <div id="rodape-atual"></div>
      </div>

      <button id="btn-abrir-solicitacao" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors mb-6">
        <i class="fa-solid fa-pen"></i> Abrir solicitação de alteração
      </button>
      <div id="form-abrir-solicitacao" class="hidden bg-card border border-border rounded-2xl shadow-sm p-5 mb-6"></div>

      ${doc.solicitacoes_abertas?.length ? `
        <h2 class="text-sm font-bold uppercase tracking-wide text-muted mb-3">Solicitações em aberto</h2>
        <div class="flex flex-wrap gap-2 mb-6">
          ${doc.solicitacoes_abertas.map((r) => `
            <a href="/documentos/${slugDocumento}/revisao/${r.numero_revisao}" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-accent/10 text-accent hover:bg-accent/20 transition-colors">
              Solicitação nº ${r.numero_revisao} <span class="capitalize">· ${r.status.replace(/_/g, ' ')}</span>
            </a>
          `).join('')}
        </div>
      ` : ''}

      ${versoesImplementadas.length ? `
        <h2 class="text-sm font-bold uppercase tracking-wide text-muted mb-3">Versões anteriores</h2>
        <div class="flex flex-wrap gap-2 mb-6">
          ${versoesImplementadas.map((r) => `
            <a href="/documentos/${slugDocumento}/${String(r.numero_revisao).padStart(2, '0')}" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-card border border-border hover:bg-basebg transition-colors">
              Versão ${String(r.numero_revisao).padStart(2, '0')}
            </a>
          `).join('')}
        </div>
      ` : ''}
    `;

    if (doc.ultima_revisao_implementada) {
      document.getElementById('rodape-atual').innerHTML = await renderRodapeRevisao(doc.ultima_revisao_implementada);
    }

    document.getElementById('btn-abrir-solicitacao').addEventListener('click', () => {
      const form = document.getElementById('form-abrir-solicitacao');
      const abrindo = form.classList.contains('hidden');
      form.classList.add('hidden');
      if (!abrindo) return;
      form.classList.remove('hidden');
      form.innerHTML = `
        <form class="space-y-3">
          <label class="text-xs text-muted">O que pretende alterar? (descrição inicial)
            <textarea data-campo="descricao_inicial" rows="2" required class="w-full mt-1 bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
          </label>
          <label class="block text-xs text-muted mb-1">Coautores (opcional — podem editar o rascunho junto com você)</label>
          ${seletorUsuariosHtml('seletor-coautores-abrir', 'Buscar por nick…')}
          <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Abrir solicitação</button>
          <p data-erro class="hidden text-xs text-red-500"></p>
        </form>
      `;
      ligarSeletorUsuarios('seletor-coautores-abrir', { excluirIds: [me.id] });

      form.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const resp = await apiFetch(`/documentos/${doc.id}/revisoes`, {
          method: 'POST',
          body: JSON.stringify({
            descricao_inicial: form.querySelector('[data-campo="descricao_inicial"]').value.trim(),
            coautores_ids: obterSelecionados('seletor-coautores-abrir'),
          }),
        });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          const erroEl = form.querySelector('[data-erro]');
          erroEl.textContent = d.erro || 'Não foi possível abrir a solicitação.';
          erroEl.classList.remove('hidden');
          return;
        }
        const { numero_revisao } = await resp.json();
        window.location.href = `/documentos/${slugDocumento}/revisao/${numero_revisao}`;
      });
    });
  }

  // ---------- Página da solicitação (rascunho / votação em etapas) ----------
  async function montarSolicitacao(me) {
    const container = document.getElementById('conteudo');
    container.innerHTML = '<p class="text-sm text-muted mt-2">Carregando…</p>';

    const resp = await apiFetch(`/documentos/slug/${slugDocumento}/revisao/${numeroSolicitacao}`);
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      container.innerHTML = `<p class="text-sm text-red-500 mt-2">${d.erro || 'Solicitação não encontrada.'}</p>`;
      return;
    }
    const r = await resp.json();
    const documentoId = r.documento.id;

    const souAutor = r.aprovadores.some((a) => a.papel === 'autor' && a.usuario_id === me.id);
    const minhaLinhaEtapaAtual = r.aprovadores.find((a) => {
      const papelDaEtapa = ORDEM_PAPEIS[r.etapa_atual - 1];
      return a.papel === papelDaEtapa && a.usuario_id === me.id;
    });

    container.innerHTML = `
      <a href="/documentos/${slugDocumento}" class="text-xs text-muted hover:text-dark transition-colors">← Voltar pro documento</a>
      <div class="flex items-center justify-between mt-2 mb-1">
        <h1 class="text-lg font-display font-bold">${r.documento.titulo} — Solicitação nº ${r.numero_revisao}</h1>
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full capitalize ${BADGE_STATUS_DOC[r.status] || ''}">${r.status.replace(/_/g, ' ')}</span>
      </div>
      <p class="text-xs text-muted mb-4">por ${r.autor_nick || '—'} · aberta em ${formatarData(r.criado_em)}</p>

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-5">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-semibold uppercase tracking-wide text-muted">Conteúdo proposto</h2>
          ${r.status === 'rascunho' && souAutor ? '<span class="text-xs text-muted">Editável (rascunho)</span>' : ''}
        </div>
        <div id="area-conteudo"></div>
      </div>

      ${r.status === 'rascunho' && souAutor ? `
        <button id="btn-enviar-aprovacao" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors mb-6">
          <i class="fa-solid fa-paper-plane"></i> Salvar e enviar pra aprovação
        </button>
        <div id="form-enviar-aprovacao" class="hidden bg-card border border-border rounded-2xl shadow-sm p-5 mb-6"></div>
      ` : ''}

      ${r.status !== 'rascunho' ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-5">
          <h2 class="text-xs font-semibold uppercase tracking-wide text-muted mb-3">Etapas de assinatura</h2>
          <div class="space-y-4">
            ${ORDEM_PAPEIS.map((papel, i) => {
              const pessoas = r.aprovadores.filter((a) => a.papel === papel);
              const etapaNum = i + 1;
              const ativa = r.etapa_atual === etapaNum;
              return `
                <div>
                  <p class="text-xs font-semibold uppercase tracking-wide mb-1.5 ${ativa ? 'text-accent' : 'text-muted'}">${LABEL_PAPEL[papel]}${ativa ? ' — vez atual' : ''}</p>
                  <div class="space-y-1.5">
                    ${pessoas.map((a) => `
                      <div class="flex items-center justify-between px-3 py-2 bg-basebg border border-border rounded-lg">
                        <p class="text-sm">${a.usuario_nick || '—'}${a.comentario ? ` — <span class="text-muted italic">"${a.comentario}"</span>` : ''}</p>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full capitalize ${BADGE_STATUS_DOC[a.status] || ''}">${a.status}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          ${minhaLinhaEtapaAtual && minhaLinhaEtapaAtual.status === 'pendente' ? `
            <div class="flex gap-2 mt-4">
              <button id="btn-assinar-aprovar" class="text-sm font-semibold px-4 py-2 rounded-lg bg-green-500/15 text-green-600 hover:bg-green-500/25 transition-colors"><i class="fa-solid fa-check"></i> Aprovar</button>
              <button id="btn-assinar-reprovar" class="text-sm font-semibold px-4 py-2 rounded-lg bg-red-500/15 text-red-600 hover:bg-red-500/25 transition-colors"><i class="fa-solid fa-xmark"></i> Reprovar</button>
            </div>
          ` : ''}
        </div>
      ` : ''}

      ${r.status === 'aprovado' && r.aprovadores.some((a) => a.papel === 'administrador_forum' && a.usuario_id === me.id) ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-5">
          <h2 class="text-xs font-semibold uppercase tracking-wide text-muted mb-2">Agendar implementação</h2>
          <div class="flex items-center gap-2">
            <input id="input-agendar" type="datetime-local" class="bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <button id="btn-agendar" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Agendar</button>
          </div>
        </div>
      ` : ''}

      ${r.status === 'agendado' ? `
        <div class="bg-card border border-border rounded-2xl shadow-sm p-5 mb-5">
          <p class="text-sm">Agendado para <b>${formatarData(r.agendado_para)}</b>.</p>
          ${r.aprovadores.some((a) => a.papel === 'administrador_forum' && a.usuario_id === me.id) || me.administrador_sistema ? `
            <button id="btn-implementar" class="mt-2 text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Implementar agora</button>
          ` : ''}
        </div>
      ` : ''}

      <div class="bg-card border border-border rounded-2xl shadow-sm p-5">
        <h2 class="text-xs font-semibold uppercase tracking-wide text-muted mb-3">O que foi alterado</h2>
        <div class="space-y-2 mb-3">
          ${r.historico.map((h) => `
            <div class="text-sm border-l-2 border-border pl-3">
              <p>${h.descricao}</p>
              <p class="text-xs text-muted mt-0.5">${h.criado_por_nick || '—'} · ${formatarData(h.criado_em)}</p>
            </div>
          `).join('')}
        </div>
        ${r.status === 'rascunho' && souAutor ? `
          <form id="form-novo-historico" class="flex gap-2">
            <input placeholder="Descreva mais uma alteração…" required class="flex-1 bg-basebg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Adicionar</button>
          </form>
        ` : ''}
      </div>
    `;

    // --- Conteúdo: editável se rascunho + sou autor, senão só exibe ---
    const areaConteudo = document.getElementById('area-conteudo');
    if (r.status === 'rascunho' && souAutor) {
      areaConteudo.innerHTML = `
        ${htmlEditorHtml('editor-conteudo-solicitacao', r.conteudo_proposto)}
        <button id="btn-salvar-rascunho" class="mt-2 text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Salvar rascunho</button>
      `;
      ligarEditorHtml('editor-conteudo-solicitacao');
      document.getElementById('btn-salvar-rascunho').addEventListener('click', async () => {
        await apiFetch(`/documentos/${documentoId}/revisoes/${r.id}/historico`, {
          method: 'POST',
          body: JSON.stringify({ descricao: 'Rascunho salvo.', conteudo_proposto: document.getElementById('editor-conteudo-solicitacao-textarea').value }),
        });
        montarSolicitacao(me);
      });
    } else {
      areaConteudo.innerHTML = `<div class="text-sm">${r.conteudo_proposto}</div>`;
    }

    // --- Enviar pra aprovação ---
    const btnEnviar = document.getElementById('btn-enviar-aprovacao');
    if (btnEnviar) {
      btnEnviar.addEventListener('click', () => {
        const form = document.getElementById('form-enviar-aprovacao');
        const abrindo = form.classList.contains('hidden');
        form.classList.add('hidden');
        if (!abrindo) return;
        form.classList.remove('hidden');

        const autoresAtuaisIds = r.aprovadores.filter((a) => a.papel === 'autor').map((a) => a.usuario_id);

        form.innerHTML = `
          <form class="space-y-4">
            <div>
              <label class="block text-xs text-muted mb-1">Coautores adicionais (opcional)</label>
              ${seletorUsuariosHtml('seletor-coautores-enviar', 'Buscar por nick…')}
            </div>
            <div>
              <label class="block text-xs text-muted mb-1">Aprovadores (obrigatório — ao menos 1)</label>
              ${seletorUsuariosHtml('seletor-aprovadores-enviar', 'Buscar por nick…')}
            </div>
            <div>
              <label class="block text-xs text-muted mb-1">Administradores do Fórum (obrigatório — só administradores do sistema)</label>
              ${seletorUsuariosHtml('seletor-admforum-enviar', 'Buscar por nick de um admin…')}
            </div>
            <button type="submit" class="text-sm font-semibold bg-accent hover:bg-accent-dark text-white rounded-lg px-4 py-2 transition-colors">Enviar pra aprovação</button>
            <p data-erro class="hidden text-xs text-red-500"></p>
          </form>
        `;
        ligarSeletorUsuarios('seletor-coautores-enviar', { excluirIds: autoresAtuaisIds });
        ligarSeletorUsuarios('seletor-aprovadores-enviar', {});
        ligarSeletorUsuarios('seletor-admforum-enviar', { apenasAdmin: true });

        form.querySelector('form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const erroEl = form.querySelector('[data-erro]');
          const aprovadoresIds = obterSelecionados('seletor-aprovadores-enviar');
          const administradoresIds = obterSelecionados('seletor-admforum-enviar');
          if (!aprovadoresIds.length || !administradoresIds.length) {
            erroEl.textContent = 'Escolha ao menos um aprovador e um administrador do fórum.';
            erroEl.classList.remove('hidden');
            return;
          }
          const resp = await apiFetch(`/documentos/${documentoId}/revisoes/${r.id}/enviar-para-aprovacao`, {
            method: 'POST',
            body: JSON.stringify({
              coautores_adicionais_ids: obterSelecionados('seletor-coautores-enviar'),
              aprovadores_ids: aprovadoresIds,
              administradores_forum_ids: administradoresIds,
            }),
          });
          if (!resp.ok) {
            const d = await resp.json().catch(() => ({}));
            erroEl.textContent = d.erro || 'Não foi possível enviar.';
            erroEl.classList.remove('hidden');
            return;
          }
          montarSolicitacao(me);
        });
      });
    }

    // --- Assinar (aprovar/reprovar na etapa atual) ---
    const btnAprovar = document.getElementById('btn-assinar-aprovar');
    if (btnAprovar) {
      btnAprovar.addEventListener('click', async () => {
        await apiFetch(`/documentos/${documentoId}/revisoes/${r.id}/assinar`, { method: 'POST', body: JSON.stringify({ status: 'aprovado' }) });
        montarSolicitacao(me);
      });
    }
    const btnReprovar = document.getElementById('btn-assinar-reprovar');
    if (btnReprovar) {
      btnReprovar.addEventListener('click', async () => {
        const comentario = prompt('Motivo da reprovação (opcional) — isso reinicia toda a votação:') || undefined;
        await apiFetch(`/documentos/${documentoId}/revisoes/${r.id}/assinar`, { method: 'POST', body: JSON.stringify({ status: 'reprovado', comentario }) });
        montarSolicitacao(me);
      });
    }

    const btnAgendar = document.getElementById('btn-agendar');
    if (btnAgendar) {
      btnAgendar.addEventListener('click', async () => {
        const valor = document.getElementById('input-agendar').value;
        if (!valor) return;
        await apiFetch(`/documentos/${documentoId}/revisoes/${r.id}/agendar`, {
          method: 'POST', body: JSON.stringify({ agendado_para: new Date(valor).toISOString() }),
        });
        montarSolicitacao(me);
      });
    }

    const btnImplementar = document.getElementById('btn-implementar');
    if (btnImplementar) {
      btnImplementar.addEventListener('click', async () => {
        if (!confirm('Implementar essa revisão agora? Isso substitui o conteúdo vigente do documento.')) return;
        await apiFetch(`/documentos/${documentoId}/revisoes/${r.id}/implementar`, { method: 'POST' });
        window.location.href = `/documentos/${slugDocumento}`;
      });
    }

    const formHistorico = document.getElementById('form-novo-historico');
    if (formHistorico) {
      formHistorico.addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = formHistorico.querySelector('input');
        await apiFetch(`/documentos/${documentoId}/revisoes/${r.id}/historico`, {
          method: 'POST', body: JSON.stringify({ descricao: input.value.trim() }),
        });
        montarSolicitacao(me);
      });
    }
  }

  montarLayout('/documentos.html').then((me) => {
    if (!me) return;
    if (!slugDocumento) { document.getElementById('conteudo').innerHTML = '<p class="text-sm text-red-500 mt-2">Nenhum documento especificado.</p>'; return; }
    if (ehPaginaSolicitacao) montarSolicitacao(me);
    else if (numeroVersaoAntiga) montarVersaoAntiga();
    else montarDocumento(me);
  });
</script>
</body>
</html>
