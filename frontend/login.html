<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Entrar</title>
<link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.2.1/css/pro.min.css">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
<link href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body class="font-sans cia-bg min-h-screen flex items-center justify-center px-4 py-10 relative">

  <div class="w-full max-w-md relative z-10">
    <div class="bg-card rounded-2xl overflow-hidden shadow-2xl">

      <div class="bg-dark text-white px-8 py-8 text-center">
        <div id="login-logo" class="h-16 w-16 rounded-xl bg-accent/20 flex items-center justify-center text-accent font-display font-black text-xl mx-auto mb-3 overflow-hidden">CIA</div>
        <h1 class="text-2xl font-display font-extrabold uppercase tracking-wide">Fazer Login</h1>
        <p class="text-sm text-white/60 mt-1 normal-case">Use sua conta da Central de Inteligência e Ação</p>
      </div>

      <div class="px-8 pt-6">
        <div class="flex gap-6 mb-5 border-b border-border uppercase text-sm font-bold">
          <button id="tab-senha" class="pb-3 border-b-2 border-accent text-dark">Senha</button>
          <button id="tab-codigo" class="pb-3 border-b-2 border-transparent text-muted hover:text-dark transition-colors">Código na missão</button>
        </div>
      </div>

      <div class="px-8 pb-8">
        <form id="form-senha" class="space-y-3">
          <input id="senha-nick" type="text" required autocomplete="username" placeholder="Digite o seu nick"
            class="w-full border border-border rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <input id="senha-senha" type="password" required autocomplete="current-password" placeholder="Digite a sua senha"
            class="w-full border border-border rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
          <button type="submit"
            class="w-full bg-accent hover:bg-accent-dark text-white font-bold uppercase text-sm rounded px-6 py-3.5 transition-colors">
            Acessar conta
          </button>
        </form>

        <form id="form-codigo" class="space-y-3 hidden">
          <input id="codigo-nick" type="text" required autocomplete="username" placeholder="Digite o seu nick"
            class="w-full border border-border rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent">

          <div id="codigo-instrucao" class="hidden bg-basebg border border-border rounded px-4 py-3 text-xs normal-case text-muted">
            Coloque <span id="codigo-valor" class="text-accent font-bold"></span> na sua missão do Habblet, salve e confirme abaixo.
          </div>

          <button type="button" id="btn-solicitar-codigo"
            class="w-full border border-dark text-dark font-bold uppercase text-sm rounded px-6 py-3 hover:bg-dark hover:text-white transition-colors">
            Gerar código
          </button>

          <div id="codigo-confirmar-wrap" class="hidden space-y-3">
            <div class="relative">
              <input id="codigo-valor-input" type="text" disabled
                class="w-full border border-border rounded px-4 py-3 pr-11 text-sm text-muted bg-basebg">
              <button type="button" id="btn-copiar-codigo" title="Copiar código"
                class="absolute inset-y-0 right-0 flex items-center px-3.5 text-muted hover:text-accent transition-colors">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
            <button type="submit" id="btn-confirmar-codigo"
              class="w-full bg-accent hover:bg-accent-dark text-white font-bold uppercase text-sm rounded px-6 py-3.5 transition-colors disabled:opacity-60 disabled:cursor-wait">
              Já coloquei na missão — Entrar
            </button>
          </div>
        </form>

        <p id="erro" class="hidden mt-4 text-xs normal-case text-red-700 bg-red-50 border border-red-200 rounded px-4 py-2.5"></p>
      </div>
    </div>

    <p class="text-center text-xs text-white/70 mt-6 normal-case">Ainda não tem senha? Use "Código na missão" e defina uma depois no seu perfil.</p>
  </div>

<script src="/assets/api.js"></script>
<script>
  buscarConfiguracoes().then((config) => {
    if (config.logo_url) {
      document.getElementById('login-logo').innerHTML = `<img src="${config.logo_url}" class="w-full h-full object-contain" alt="Logo">`;
      let iconeLink = document.querySelector('link[rel="icon"]');
      if (!iconeLink) {
        iconeLink = document.createElement('link');
        iconeLink.rel = 'icon';
        document.head.appendChild(iconeLink);
      }
      iconeLink.href = config.logo_url;
    }

    // Fundo customizável via admin (aba Configurações). Sem valor
    // configurado, mantém o fundo padrão definido em .cia-bg (theme.css).
    if (config.login_fundo_url) {
      document.body.style.backgroundImage = `url('${config.login_fundo_url}')`;
      if (config.login_fundo_modo === 'repetir') {
        document.body.style.backgroundRepeat = 'repeat';
        document.body.style.backgroundSize = 'auto';
      } else {
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundSize = 'cover';
      }
      document.body.style.backgroundPosition = 'center';
    }
  });

  const tabSenha = document.getElementById('tab-senha');
  const tabCodigo = document.getElementById('tab-codigo');
  const formSenha = document.getElementById('form-senha');
  const formCodigo = document.getElementById('form-codigo');
  const erroEl = document.getElementById('erro');

  function mostrarErro(mensagem) {
    erroEl.textContent = mensagem;
    erroEl.classList.remove('hidden');
  }
  function limparErro() {
    erroEl.classList.add('hidden');
  }

  function ativarAba(aba) {
    limparErro();
    pararPolling();
    resetarBotaoConfirmar();
    const ehSenha = aba === 'senha';
    formSenha.classList.toggle('hidden', !ehSenha);
    formCodigo.classList.toggle('hidden', ehSenha);
    tabSenha.classList.toggle('border-accent', ehSenha);
    tabSenha.classList.toggle('text-dark', ehSenha);
    tabSenha.classList.toggle('border-transparent', !ehSenha);
    tabSenha.classList.toggle('text-muted', !ehSenha);
    tabCodigo.classList.toggle('border-accent', !ehSenha);
    tabCodigo.classList.toggle('text-dark', !ehSenha);
    tabCodigo.classList.toggle('border-transparent', ehSenha);
    tabCodigo.classList.toggle('text-muted', ehSenha);
  }

  tabSenha.addEventListener('click', () => ativarAba('senha'));
  tabCodigo.addEventListener('click', () => ativarAba('codigo'));

  formSenha.addEventListener('submit', async (e) => {
    e.preventDefault();
    limparErro();
    const nick = document.getElementById('senha-nick').value.trim();
    const senha = document.getElementById('senha-senha').value;

    const resposta = await fetch(`${API_BASE}/auth/login-senha`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nick, senha }),
    });
    const dados = await resposta.json();

    if (!resposta.ok) return mostrarErro(dados.erro || 'Não foi possível entrar.');

    Auth.salvarSessao(dados);
    window.location.href = '/index.html';
  });

  const codigoValorInput = document.getElementById('codigo-valor-input');
  const btnCopiarCodigo = document.getElementById('btn-copiar-codigo');
  const btnConfirmarCodigo = document.getElementById('btn-confirmar-codigo');

  btnCopiarCodigo.addEventListener('click', async () => {
    const valor = codigoValorInput.value;
    if (!valor) return;

    try {
      await navigator.clipboard.writeText(valor);
    } catch {
      // fallback pra quando a Clipboard API não está disponível (contexto sem
      // permissão, navegador mais antigo, etc)
      codigoValorInput.removeAttribute('disabled');
      codigoValorInput.select();
      document.execCommand('copy');
      codigoValorInput.setAttribute('disabled', 'disabled');
    }

    const iconeOriginal = btnCopiarCodigo.innerHTML;
    btnCopiarCodigo.innerHTML = '<i class="fa-solid fa-check text-accent"></i>';
    setTimeout(() => { btnCopiarCodigo.innerHTML = iconeOriginal; }, 1500);
  });

  document.getElementById('btn-solicitar-codigo').addEventListener('click', async () => {
    limparErro();
    const nick = document.getElementById('codigo-nick').value.trim();
    if (!nick) return mostrarErro('Digite seu nickname primeiro.');

    const resposta = await fetch(`${API_BASE}/auth/solicitar-codigo`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nick, finalidade: 'login' }),
    });
    const dados = await resposta.json();

    if (!resposta.ok) return mostrarErro(dados.erro || 'Não foi possível gerar o código.');

    document.getElementById('codigo-valor').textContent = dados.codigo;
    document.getElementById('codigo-valor-input').value = dados.codigo;
    document.getElementById('codigo-instrucao').classList.remove('hidden');
    document.getElementById('codigo-confirmar-wrap').classList.remove('hidden');
  });

  // O jogo (API do Habblet) às vezes demora de 30s a 1min pra refletir a
  // missão atualizada, então em vez de checar uma vez só, fica tentando de
  // novo sozinho por um tempo em vez de já mandar a pessoa clicar de novo.
  let pollAtivo = false;
  let pollTimeoutId = null;

  function pararPolling() {
    pollAtivo = false;
    if (pollTimeoutId) {
      clearTimeout(pollTimeoutId);
      pollTimeoutId = null;
    }
  }

  function resetarBotaoConfirmar() {
    btnConfirmarCodigo.disabled = false;
    btnConfirmarCodigo.textContent = 'Já coloquei na missão — Entrar';
  }

  formCodigo.addEventListener('submit', (e) => {
    e.preventDefault();
    if (pollAtivo) return; // já está verificando, um segundo clique não faz nada
    limparErro();

    const nick = document.getElementById('codigo-nick').value.trim();
    const codigo = codigoValorInput.value;

    const TEMPO_AVISO = 20000;  // 20s: pode ser a API do Habblet demorando
    const TEMPO_LIMITE = 90000; // 90s: desiste e deixa a pessoa tentar de novo
    const INTERVALO = 4000;     // tenta a cada 4s

    const inicio = Date.now();
    let avisoMostrado = false;

    pollAtivo = true;
    btnConfirmarCodigo.disabled = true;
    btnConfirmarCodigo.textContent = 'Verificando na missão…';

    const tentar = async () => {
      if (!pollAtivo) return;

      const decorrido = Date.now() - inicio;

      if (decorrido >= TEMPO_LIMITE) {
        pararPolling();
        mostrarErro('Não conseguimos confirmar o código na missão a tempo. Confira se colocou certinho na missão do Habblet e tente novamente.');
        resetarBotaoConfirmar();
        return;
      }

      if (!avisoMostrado && decorrido >= TEMPO_AVISO) {
        avisoMostrado = true;
        mostrarErro('Ainda não encontramos o código na sua missão — pode ser a API do Habblet demorando pra atualizar (às vezes leva até 1 minuto). Continuamos tentando automaticamente...');
      }

      try {
        const resposta = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nick, codigo }),
        });
        const dados = await resposta.json();

        if (resposta.ok) {
          pararPolling();
          limparErro();
          Auth.salvarSessao(dados);
          window.location.href = '/index.html';
          return;
        }

        // Código inválido/expirado (a checagem no banco, não no jogo) ou nick
        // sem conta: erro definitivo, insistir não vai resolver.
        const mensagemErro = String(dados.erro || '');
        const erroDefinitivo = resposta.status === 404 ||
          (resposta.status === 401 && !mensagemErro.includes('missão'));

        if (erroDefinitivo) {
          pararPolling();
          mostrarErro(mensagemErro || 'Não foi possível entrar.');
          resetarBotaoConfirmar();
          return;
        }

        // 401 "código não encontrado na missão" ou 502 (API do Habblet fora
        // do ar/lenta no momento): ainda vale a pena tentar de novo.
        pollTimeoutId = setTimeout(tentar, INTERVALO);
      } catch {
        // Falha de rede local também é passageira — segue tentando.
        pollTimeoutId = setTimeout(tentar, INTERVALO);
      }
    };

    tentar();
  });

  if (Auth.estaLogado()) window.location.href = '/index.html';
</script>
</body>
</html>
