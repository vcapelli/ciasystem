<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIASystem — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/tailwind-config.js"></script>
</head>
<body class="bg-base text-white font-sans min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <p class="text-sm tracking-wide text-muted">Central de Inteligência e Ação</p>
      <h1 class="text-2xl font-bold mt-1">CIASystem</h1>
    </div>

    <div class="bg-card border border-border rounded-2xl p-8 relative overflow-hidden">
      <div class="absolute top-0 left-8 h-1 w-16 bg-amber rounded-b"></div>

      <div class="flex gap-6 mb-6 border-b border-border">
        <button id="tab-senha" class="pb-3 text-sm font-semibold border-b-2 border-amber text-white">Senha</button>
        <button id="tab-codigo" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-muted hover:text-white transition-colors">Código na missão</button>
      </div>

      <form id="form-senha" class="space-y-4">
        <div>
          <label class="block text-sm text-muted mb-1.5" for="senha-nick">Nickname</label>
          <input id="senha-nick" type="text" required autocomplete="username"
            class="w-full bg-base border border-border rounded-xl px-4 py-2.5 text-white placeholder:text-muted/60 focus:outline-none focus:ring-2 focus:ring-amber"
            placeholder="Seu nick do Habblet">
        </div>
        <div>
          <label class="block text-sm text-muted mb-1.5" for="senha-senha">Senha</label>
          <input id="senha-senha" type="password" required autocomplete="current-password"
            class="w-full bg-base border border-border rounded-xl px-4 py-2.5 text-white placeholder:text-muted/60 focus:outline-none focus:ring-2 focus:ring-amber"
            placeholder="••••••••">
        </div>
        <button type="submit"
          class="w-full bg-amber hover:bg-amber-dark text-base font-semibold rounded-xl py-2.5 transition-colors">
          Entrar
        </button>
      </form>

      <form id="form-codigo" class="space-y-4 hidden">
        <div>
          <label class="block text-sm text-muted mb-1.5" for="codigo-nick">Nickname</label>
          <input id="codigo-nick" type="text" required autocomplete="username"
            class="w-full bg-base border border-border rounded-xl px-4 py-2.5 text-white placeholder:text-muted/60 focus:outline-none focus:ring-2 focus:ring-amber"
            placeholder="Seu nick do Habblet">
        </div>

        <div id="codigo-instrucao" class="hidden bg-base border border-border rounded-xl p-4 text-sm text-muted">
          Coloque <span id="codigo-valor" class="text-amber font-semibold"></span> na sua missão do Habblet, salve e confirme abaixo.
        </div>

        <button type="button" id="btn-solicitar-codigo"
          class="w-full bg-transparent border border-border hover:border-amber text-white font-semibold rounded-xl py-2.5 transition-colors">
          Gerar código
        </button>

        <div id="codigo-confirmar-wrap" class="hidden space-y-4">
          <div>
            <label class="block text-sm text-muted mb-1.5" for="codigo-valor-input">Código gerado</label>
            <input id="codigo-valor-input" type="text" disabled
              class="w-full bg-base border border-border rounded-xl px-4 py-2.5 text-muted">
          </div>
          <button type="submit"
            class="w-full bg-amber hover:bg-amber-dark text-base font-semibold rounded-xl py-2.5 transition-colors">
            Já coloquei na missão — Entrar
          </button>
        </div>
      </form>

      <p id="erro" class="hidden mt-4 text-sm text-red-400 bg-red-400/10 border border-red-400/30 rounded-xl px-4 py-2.5"></p>
    </div>

    <p class="text-center text-xs text-muted mt-6">Ainda não tem senha? Use "Código na missão" e defina uma depois no seu perfil.</p>
  </div>

<script src="/assets/api.js"></script>
<script>
  const tabSenha = document.getElementById('tab-senha');
  const tabCodigo = document.getElementById('tab-codigo');
  const formSenha = document.getElementById('form-senha');
  const formCodigo = document.getElementById('form-codigo');
  const erroEl = document.getElementById('erro');

  function mostrarErro(mensagem) {
    erroEl.textContent = mensagem;
    erroEl.classList.remove('hidden');
  }
  function limparErro() {
    erroEl.classList.add('hidden');
  }

  function ativarAba(aba) {
    limparErro();
    const ehSenha = aba === 'senha';
    formSenha.classList.toggle('hidden', !ehSenha);
    formCodigo.classList.toggle('hidden', ehSenha);
    tabSenha.classList.toggle('border-amber', ehSenha);
    tabSenha.classList.toggle('text-white', ehSenha);
    tabSenha.classList.toggle('border-transparent', !ehSenha);
    tabSenha.classList.toggle('text-muted', !ehSenha);
    tabCodigo.classList.toggle('border-amber', !ehSenha);
    tabCodigo.classList.toggle('text-white', !ehSenha);
    tabCodigo.classList.toggle('border-transparent', ehSenha);
    tabCodigo.classList.toggle('text-muted', ehSenha);
  }

  tabSenha.addEventListener('click', () => ativarAba('senha'));
  tabCodigo.addEventListener('click', () => ativarAba('codigo'));

  formSenha.addEventListener('submit', async (e) => {
    e.preventDefault();
    limparErro();
    const nick = document.getElementById('senha-nick').value.trim();
    const senha = document.getElementById('senha-senha').value;

    const resposta = await fetch(`${API_BASE}/auth/login-senha`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nick, senha }),
    });
    const dados = await resposta.json();

    if (!resposta.ok) return mostrarErro(dados.erro || 'Não foi possível entrar.');

    Auth.salvarSessao(dados);
    window.location.href = '/index.html';
  });

  document.getElementById('btn-solicitar-codigo').addEventListener('click', async () => {
    limparErro();
    const nick = document.getElementById('codigo-nick').value.trim();
    if (!nick) return mostrarErro('Digite seu nickname primeiro.');

    const resposta = await fetch(`${API_BASE}/auth/solicitar-codigo`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nick, finalidade: 'login' }),
    });
    const dados = await resposta.json();

    if (!resposta.ok) return mostrarErro(dados.erro || 'Não foi possível gerar o código.');

    document.getElementById('codigo-valor').textContent = dados.codigo;
    document.getElementById('codigo-valor-input').value = dados.codigo;
    document.getElementById('codigo-instrucao').classList.remove('hidden');
    document.getElementById('codigo-confirmar-wrap').classList.remove('hidden');
  });

  formCodigo.addEventListener('submit', async (e) => {
    e.preventDefault();
    limparErro();
    const nick = document.getElementById('codigo-nick').value.trim();
    const codigo = document.getElementById('codigo-valor-input').value;

    const resposta = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nick, codigo }),
    });
    const dados = await resposta.json();

    if (!resposta.ok) return mostrarErro(dados.erro || 'Não foi possível entrar.');

    Auth.salvarSessao(dados);
    window.location.href = '/index.html';
  });

  if (Auth.estaLogado()) window.location.href = '/index.html';
</script>
</body>
</html>
